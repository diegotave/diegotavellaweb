<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Señal de Ajuste</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
    }

    #screen {
      position: relative;
      width: 100vw; height: 100vh;
      display: flex; flex-direction: column;
    }

    #zona-a { flex: 67 0 0; display: flex; }
    #zona-b { flex: 8  0 0; display: flex; }
    #zona-c { flex: 25 0 0; display: flex; }
    .franja  { flex: 1 0 0; }

    #c-izq    { flex: 2 0 0; display: flex; }
    #c-centro { flex: 7 0 0; display: flex; }
    #c-der    { flex: 3 0 0; display: flex; }


    #btn {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      width: 100%; height: 100%;
      background: transparent;
      border: none;
      color: #000;
      font-family: 'Courier New', Courier, monospace;
      font-size: 26px; letter-spacing: 0.15em; font-weight: 700;
      cursor: pointer; outline: none;
    }

    #blanco {
      position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: #fff;
      z-index: 9; display: none; pointer-events: none;
    }

    #ola {
      position: fixed;
      top: -150px; left: -150px;
      width: calc(100vw + 300px);
      height: calc(100vh + 300px);
      display: flex; z-index: 10; pointer-events: none;
    }
    .barra { flex: 1 0 0; transform: translateY(calc(-100vh - 300px)); }
    #ola > .barra:first-child,
    #ola > .barra:last-child { flex: 1 0 150px; }

    #negro {
      position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: #000; z-index: 20;
      transform: translateY(-100vh); pointer-events: none;
    }

    #video {
      position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh;
      object-fit: contain; z-index: 30;
      opacity: 0; pointer-events: none;
      transform-origin: 50% 50%;
    }

    #vhs {
      position: fixed; top: 50%; left: 50%;
      width: 55vw; height: auto;
      transform: translate(-50%, calc(-50% + 100vh));
      z-index: 29;
      filter: invert(1);
      mix-blend-mode: screen;
      pointer-events: none;
    }

    #armalogo {
      position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh;
      object-fit: contain; z-index: 32;
      opacity: 0; pointer-events: none;
      transform-origin: 50% 50%;
      mix-blend-mode: multiply;
    }

    #loading-bar {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 21; display: none; pointer-events: none;
      font-family: 'Courier New', Courier, monospace;
      font-size: 26px; letter-spacing: 0.15em; font-weight: 700;
      white-space: nowrap; width: max-content;
    }
    #lb-white { color: #fff; }
    #lb-black {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      color: #000;
      clip-path: inset(0 0 0 100%);
    }

  </style>
</head>
<body>


<div id="screen">
  <div id="zona-a">
    <div class="franja" style="background:#FF4D1C"></div>
    <div class="franja" style="background:#FF9B3D"></div>
    <div class="franja" style="background:#FFE14D"></div>
    <div class="franja" style="background:#5BFF8F"></div>
    <div class="franja" style="background:#3DDFFF"></div>
    <div class="franja" style="background:#7B6FFF"></div>
    <div class="franja" style="background:#FF4D8F"></div>
  </div>
  <div id="zona-b">
    <div class="franja" style="background:#3DDFFF"></div>
    <div class="franja" style="background:#7B6FFF"></div>
    <div class="franja" style="background:#090909"></div>
    <div class="franja" style="background:#FFFFFF"></div>
    <div class="franja" style="background:#FF4D1C"></div>
    <div class="franja" style="background:#090909"></div>
    <div class="franja" style="background:#FF4D8F"></div>
  </div>
  <div id="zona-c">
    <div id="c-izq">
      <div class="franja" style="background:#FFFFFF"></div>
      <div class="franja" style="background:#404040"></div>
    </div>
    <div id="c-centro">
      <div class="franja" style="background:#000000"></div>
      <div class="franja" style="background:#2A2A2A"></div>
      <div class="franja" style="background:#555555"></div>
      <div class="franja" style="background:#808080"></div>
      <div class="franja" style="background:#AAAAAA"></div>
      <div class="franja" style="background:#D5D5D5"></div>
      <div class="franja" style="background:#FFFFFF"></div>
    </div>
    <div id="c-der">
      <div class="franja" style="background:#040404"></div>
      <div class="franja" style="background:#000000"></div>
      <div class="franja" style="background:#101010"></div>
    </div>
  </div>

  <button id="btn">[ BEGIN TRANSMISSION ]</button>
</div>

<div id="ola">
  <div class="barra" style="background:#FF4D1C"></div>
  <div class="barra" style="background:#FF9B3D"></div>
  <div class="barra" style="background:#FFE14D"></div>
  <div class="barra" style="background:#5BFF8F"></div>
  <div class="barra" style="background:#3DDFFF"></div>
  <div class="barra" style="background:#7B6FFF"></div>
  <div class="barra" style="background:#FF4D8F"></div>
</div>

<div id="blanco"></div>
<div id="loading-bar"><span id="lb-white">[ BEGIN TRANSMISSION ]</span><span id="lb-black">[ BEGIN TRANSMISSION ]</span></div>
<div id="negro"></div>

<video id="video"    src="assets/videos/nombrebrutal_colores.webm" preload="auto" playsinline></video>
<video id="vhs"      src="assets/videos/vhsentero.webm"           preload="auto" playsinline loop muted></video>
<video id="armalogo" src="assets/videos/armalogo_ajuste.webm" preload="auto" playsinline muted></video>

<script>
  var btn      = document.getElementById('btn');
  var ola      = document.getElementById('ola');
  var blanco   = document.getElementById('blanco');
  var negro    = document.getElementById('negro');
  var video    = document.getElementById('video');
  var vhs      = document.getElementById('vhs');
  var armalogo = document.getElementById('armalogo');

  var F = 1000 / 60;

  // ── Valores calibrados ────────────────────────────────────────────────────
  var VIDEO_FINAL_SCALE = 0.233;
  var VIDEO_OX = -0.32;
  var VIDEO_OY = -1.30;

  // armalogo arranca 11 frames antes de que nombrebrutal termine (animación 700ms a 30fps)
  var ARMA_DELAY = Math.round(700 - 11 * 1000 / 30);  // ≈ 333ms

  var swipeEnabled   = false;
  var swipeTriggered = false;
  var touchStartY    = null;
  var _fromResume    = false;
  var _resumeReady   = false;

  // ── Labels fase 2 ────────────────────────────────────────────────────────
  function switchLabels() {
    window.globalLabels.transition('1');
  }

  // ── Filmstrip ─────────────────────────────────────────────────────────────
  function buildFilmstrip() {
    var rect  = vhs.getBoundingClientRect();
    var tileW = rect.width;
    var tileH = rect.height;
    var P     = rect.top;   // distancia del top del VHS centrado al top del viewport
    var vpH   = window.innerHeight;

    var gaps = [];
    var g = P;
    while (g > 1) { gaps.push(g); g /= 2; }
    gaps.push(1);

    var numTiles = gaps.length + 1;
    var totalH   = numTiles * tileH + gaps.reduce(function(s, x) { return s + x; }, 0);
    var dur    = 2000;
    var startY = -totalH;
    var endY   = vpH;

    // Filtro SVG de blur vertical (motion blur)
    var NS  = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('style', 'position:absolute;width:0;height:0;overflow:hidden');
    var defs = document.createElementNS(NS, 'defs');
    var filt = document.createElementNS(NS, 'filter');
    filt.setAttribute('id', 'fs-vblur');
    filt.setAttribute('x', '-5%');  filt.setAttribute('width',  '110%');
    filt.setAttribute('y', '-40%'); filt.setAttribute('height', '180%');
    var fgb = document.createElementNS(NS, 'feGaussianBlur');
    fgb.setAttribute('in', 'SourceGraphic');
    fgb.setAttribute('stdDeviation', '0 0');
    filt.appendChild(fgb); defs.appendChild(filt); svg.appendChild(defs);
    document.body.appendChild(svg);

    var wrap = document.createElement('div');
    wrap.style.cssText =
      'position:fixed;top:0;left:50%;transform:translateX(-50%);' +
      'pointer-events:none;z-index:21;filter:url(#fs-vblur);';
    var strip = document.createElement('div');
    strip.style.cssText = 'display:flex;flex-direction:column;will-change:transform;';
    wrap.appendChild(strip);
    document.body.appendChild(wrap);

    // Blur lateral: dos overlays encima del wrap (z-index 22) con backdrop-filter
    var cx        = window.innerWidth / 2;
    var halfTile  = tileW / 2;
    var blurZoneW = 60;
    var blurMax   = 80;
    var blurDurMs = Math.round(dur * 0.8);
    [
      { pos: cx - halfTile,              grad: 'linear-gradient(to right, black, transparent)' },
      { pos: cx + halfTile - blurZoneW,  grad: 'linear-gradient(to left,  black, transparent)' }
    ].forEach(function(cfg) {
      var el = document.createElement('div');
      el.style.cssText =
        'position:fixed;top:0;bottom:0;left:' + cfg.pos + 'px;width:' + blurZoneW + 'px;' +
        'pointer-events:none;z-index:22;' +
        '-webkit-mask-image:' + cfg.grad + ';mask-image:' + cfg.grad + ';';
      document.body.appendChild(el);
      var t0 = performance.now();
      (function animEdge() {
        var t = Math.min(1, (performance.now() - t0) / blurDurMs);
        var b = 'blur(' + (t * blurMax).toFixed(1) + 'px)';
        el.style.backdropFilter = b;
        el.style.webkitBackdropFilter = b;
        if (t < 1) requestAnimationFrame(animEdge);
      })();
    });

    for (var i = 0; i < numTiles; i++) {
      var v = document.createElement('video');
      v.src = 'assets/videos/vhsentero.webm';
      v.muted = true;
      v.setAttribute('playsinline', '');
      v.style.cssText =
        'width:' + tileW + 'px;height:' + tileH + 'px;display:block;flex-shrink:0;' +
        'filter:invert(1);mix-blend-mode:screen;';
      if (i < gaps.length) v.style.marginBottom = gaps[i] + 'px';

      if (i < 3) {
        v.loop = true; v.preload = 'auto';
        v.addEventListener('loadedmetadata', (function(el) {
          return function() { el.play().catch(function() {}); };
        })(v));
      } else {
        v.preload = 'metadata';
        v.addEventListener('loadedmetadata', (function(el) {
          return function() { el.currentTime = 1; };
        })(v));
      }
      strip.appendChild(v);
    }

    strip.animate(
      [
        { transform: 'translateY(' + startY + 'px)' },
        { transform: 'translateY(' + endY   + 'px)' }
      ],
      { duration: dur, easing: 'cubic-bezier(0.4, 0, 0.2, 1)', fill: 'forwards' }
    );


    // Blur sube al pico (50%) y baja simétricamente
    var blurT0  = performance.now();
    var maxBlur = 14;
    (function animBlur() {
      var t = Math.min(1, (performance.now() - blurT0) / dur);
      var b = (1 - Math.abs(t * 2 - 1)) * maxBlur;
      fgb.setAttribute('stdDeviation', '0 ' + b.toFixed(1));
      if (t < 1) requestAnimationFrame(animBlur);
      else fgb.setAttribute('stdDeviation', '0 0');
    })();

  }

  // ── Swipe ─────────────────────────────────────────────────────────────────
  function doSwipeUp() {
    if (swipeTriggered) return;
    swipeTriggered = true;
    swipeEnabled   = false;

    // Viniendo de hom6dtv (resume): transición simple, sin secuencia de armalogo
    if (_fromResume) {
      vhs.animate(
        [{ transform: 'translate(-50%, -50%)' }, { transform: 'translate(-50%, 120vh)' }],
        { duration: 400, easing: 'cubic-bezier(0.5, 0, 1, 0.6)', fill: 'forwards' }
      );
      window.globalLabels.fadeOut();
      sessionStorage.setItem('from_ajuste_wipe', '1');
      setTimeout(function() { window.location.href = 'hom6dtv.html'; }, 450);
      return;
    }

    var vig = document.createElement('div');
    vig.style.cssText =
      'position:fixed;inset:0;pointer-events:none;z-index:25;' +
      'background:radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.45) 100%);';
    document.body.appendChild(vig);

    vhs.animate(
      [
        { transform: 'translate(-50%, -50%)' },
        { transform: 'translate(-50%, 120vh)' }
      ],
      { duration: 400, easing: 'cubic-bezier(0.5, 0, 1, 0.6)', fill: 'forwards' }
    );

    ola.animate([{}, { opacity: 0 }], { duration: 300, fill: 'forwards' });
    blanco.style.display = 'block';
    negro.animate(
      [{ transform: 'translateY(0)' }, { transform: 'translateY(100vh)' }],
      { duration: 1200, easing: 'cubic-bezier(0.4, 0, 0.2, 1)', fill: 'forwards' }
    );

    buildFilmstrip();

    // Cuando armalogo termina: freeze en último frame, parpadeo de salida, corte
    armalogo.addEventListener('ended', function onArmaEnd() {
      if (armalogo.duration && isFinite(armalogo.duration)) {
        armalogo.currentTime = armalogo.duration;
      }
      var seq = [[0,1],[11,0],[24,0.82],[34,0],[58,0.91],[66,0],[74,0.38],[81,0],[112,0.68],[121,0],[132,0.47],[140,0.12],[146,0],[173,0.28],[180,0],[196,0.08],[210,0]];
      var t0 = performance.now(), si = 0;
      function flickOut() {
        var t = performance.now() - t0;
        while (si < seq.length && seq[si][0] <= t) { armalogo.style.opacity = seq[si][1]; si++; }
        if (si < seq.length) requestAnimationFrame(flickOut);
        else { sessionStorage.setItem('from_ajuste_wipe', '1'); window.location.href = 'hom6dtv.html'; }
      }
      requestAnimationFrame(flickOut);
    }, { once: true });

    window.globalLabels.fadeOut();

    video.animate(
      [
        { transform: 'scale(1)' },
        { transform: 'scale(' + VIDEO_FINAL_SCALE + ')' }
      ],
      { duration: 700, easing: 'ease-in-out', fill: 'forwards' }
    );

    setTimeout(function() {
      video.animate([{ opacity: 1 }, { opacity: 0 }], { duration: Math.round(3 * 1000 / 30), fill: 'forwards' })
        .onfinish = function() { video.style.opacity = '0'; };
    }, ARMA_DELAY + Math.round(4 * 1000 / 30) + 15);

    setTimeout(function() {
      armalogo.currentTime = 0;
      var ap = armalogo.play();
      if (ap && ap.catch) ap.catch(function() {});
      armalogo.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 120, fill: 'forwards' })
        .onfinish = function() { armalogo.style.opacity = '1'; };
    }, ARMA_DELAY);
  }

  window.addEventListener('touchstart', function(e) {
    touchStartY = e.touches[0].clientY;
  }, { passive: true });
  window.addEventListener('touchend', function(e) {
    if (!swipeEnabled || touchStartY === null) return;
    var dy = touchStartY - e.changedTouches[0].clientY;
    if (_fromResume ? (Math.abs(dy) > 50 && _resumeReady) : dy > 50) doSwipeUp();
    touchStartY = null;
  }, { passive: true });
  window.addEventListener('mousedown', function(e) { touchStartY = e.clientY; });
  window.addEventListener('mouseup', function(e) {
    if (!swipeEnabled || touchStartY === null) return;
    var dy = touchStartY - e.clientY;
    if (_fromResume ? (Math.abs(dy) > 30 && _resumeReady) : dy > 30) doSwipeUp();
    touchStartY = null;
  });
  window.addEventListener('wheel', function(e) {
    if (!swipeEnabled) return;
    if (_fromResume) { if (_resumeReady) doSwipeUp(); }
    else { if (e.deltaY > 0) doSwipeUp(); }
  }, { passive: true });

  // ── Secuencia principal ───────────────────────────────────────────────────
  btn.addEventListener('click', function() {
    btn.style.pointerEvents = 'none';
    btn.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 250, fill: 'forwards' });

    // Forzar buffering inmediato del filmstrip (silencioso)
    video.muted = true;
    var vPreload = video.play();
    if (vPreload && vPreload.catch) vPreload.catch(function() {});

    var _blurDone   = false;
    var _videoReady = false;
    var _seqStarted = false;

    function tryStart() {
      if (_blurDone && _videoReady && !_seqStarted) {
        _seqStarted = true;
        startSequence();
      }
    }

    function startSequence() {
      var lb = document.getElementById('loading-bar');
      lb.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300, fill: 'forwards' });

      switchLabels();

      // Rebobinar y reproducir con audio
      video.pause();
      video.currentTime = 0;
      video.muted = false;
      video.style.opacity = '0';
      var va = video.animate(
        [{ opacity: 0 }, { opacity: 1 }],
        { duration: Math.round(15 * F), fill: 'forwards' }
      );
      va.onfinish = function() { video.style.opacity = '1'; };
      var vp = video.play();
      if (vp && vp.catch) vp.catch(function() {});
      video.addEventListener('ended', function() { video.pause(); }, { once: true });

      negro.animate(
        [{ transform: 'translateY(-100vh)' }, { transform: 'translateY(0)' }],
        { duration: Math.round(30 * F), easing: 'ease-in', fill: 'forwards' }
      );

      vhs.animate(
        [
          { transform: 'translate(-50%, calc(-50% + 100vh))' },
          { transform: 'translate(-50%, -50%)' }
        ],
        { duration: Math.round(30 * F), easing: 'ease-out', fill: 'forwards' }
      ).onfinish = function() {
        vhs.style.transform = 'translate(-50%, -50%)';
        swipeEnabled = true;
      };
      var vhsp = vhs.play();
      if (vhsp && vhsp.catch) vhsp.catch(function() {});
    }

    // Gate video
    if (video.readyState >= 4) {
      _videoReady = true;
    } else {
      video.addEventListener('canplaythrough', function() {
        _videoReady = true;
        tryStart();
      }, { once: true });
    }

    // Barras
    Array.from(document.querySelectorAll('.barra')).forEach(function(b, i) {
      b.animate(
        [
          { transform: 'translateY(calc(-100vh - 300px))' },
          { transform: 'translateY(0)' }
        ],
        {
          delay:    Math.abs(i - 3) * 100,
          duration: 1000,
          easing:   'cubic-bezier(0.34, 1.56, 0.64, 1)',
          fill:     'forwards',
        }
      );
    });

    setTimeout(function() {
      blanco.style.display = 'block';
      var blurDur = Math.round(60 * F);

      // Mostrar loading bar
      var lb      = document.getElementById('loading-bar');
      var lbBlack = document.getElementById('lb-black');
      lb.style.display = 'block';

      // Progreso: blanco → negro de derecha a izquierda
      (function updateLB() {
        if (_seqStarted) return;
        if (_videoReady) { lbBlack.style.clipPath = 'inset(0 0 0 0%)'; return; }
        var p = 0;
        if (video.duration && isFinite(video.duration) && video.buffered.length) {
          p = Math.min(1, video.buffered.end(video.buffered.length - 1) / video.duration);
        }
        lbBlack.style.clipPath = 'inset(0 0 0 ' + ((1 - p) * 100).toFixed(1) + '%)';
        requestAnimationFrame(updateLB);
      })();

      // Blur
      var blurAnim = ola.animate(
        [{ filter: 'blur(0px)' }, { filter: 'blur(120px)' }],
        { duration: blurDur, easing: 'linear', fill: 'forwards' }
      );
      blurAnim.onfinish = function() {
        ola.style.filter = 'blur(120px)';
        _blurDone = true;
        tryStart();
      };

    }, 950);
  });

  // ── Resume desde hom6dtv — estado post-INICIAR sin animaciones ────────────
  if (sessionStorage.getItem('resume_ajuste')) {
    sessionStorage.removeItem('resume_ajuste');

    btn.style.opacity       = '0';
    btn.style.pointerEvents = 'none';

    Array.from(document.querySelectorAll('.barra')).forEach(function(b) {
      b.style.transform = 'translateY(0)';
    });
    ola.style.filter = 'blur(120px)';

    blanco.style.display  = 'block';
    negro.style.transform = 'translateY(0)';

    // video freezado en último frame
    function seekVideoEnd() {
      if (video.duration && isFinite(video.duration)) {
        video.currentTime = video.duration;
      }
    }
    video.addEventListener('loadedmetadata', seekVideoEnd, { once: true });
    video.addEventListener('canplaythrough',  seekVideoEnd, { once: true });
    video.style.opacity = '1';

    // vhs centrado, en play, sin animación de entrada
    vhs.style.transform = 'translate(-50%, -50%)';
    var vhsp = vhs.play();
    if (vhsp && vhsp.catch) vhsp.catch(function() {});

    window.globalLabels.setState('1');

    armalogo.currentTime = 0;
    swipeTriggered = false;
    swipeEnabled   = true;
    _fromResume    = true;
    setTimeout(function() { _resumeReady = true; }, 700);
  }
</script>

<script src="labels.js"></script>
</body>
</html>
