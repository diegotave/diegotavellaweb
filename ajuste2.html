<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Señal de Ajuste</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

    #video {
      position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh;
      object-fit: contain; z-index: 30;
      pointer-events: none;
      will-change: transform, opacity, filter;
    }
    #vhs {
      position: fixed; top: 50%; left: 50%;
      width: 55vw; height: auto;
      transform: translate(-50%, -50%);
      z-index: 29;
      filter: invert(1);
      mix-blend-mode: screen;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <video id="video" src="assets/videos/nombrebrutal_colores.webm" preload="auto" playsinline muted></video>
  <video id="vhs"   src="assets/videos/vhsentero.webm"           preload="auto" playsinline loop muted></video>

  <script>
    var video = document.getElementById('video');
    var vhs   = document.getElementById('vhs');

    // Video al último frame
    function seekEnd() {
      if (video.duration && isFinite(video.duration)) video.currentTime = video.duration;
    }
    video.addEventListener('loadedmetadata', seekEnd, { once: true });
    video.addEventListener('canplaythrough',  seekEnd, { once: true });

    // VHS en loop
    var vp = vhs.play();
    if (vp && vp.catch) vp.catch(function() {});

    // ── Navegación ────────────────────────────────────────────────────────────
    var triggered  = false;
    var touchStartY = null;
    var ready      = false;
    setTimeout(function() { ready = true; }, 700);

    function goUp() {
      if (triggered) return;
      triggered = true;

      vhs.animate(
        [{ transform: 'translate(-50%, -50%)' }, { transform: 'translate(-50%, 120vh)' }],
        { duration: 400, easing: 'cubic-bezier(0.5, 0, 1, 0.6)', fill: 'forwards' }
      );

      video.animate([
        { transform: 'scale(1)',    opacity: 1,    filter: 'blur(0px)',  offset: 0,    easing: 'cubic-bezier(0.3, 0, 0.55, 1)' },
        { transform: 'scale(0.32)', opacity: 1,    filter: 'blur(3px)',  offset: 0.60, easing: 'linear' },
        { transform: 'scale(0.30)', opacity: 0.18, filter: 'blur(5px)',  offset: 0.68, easing: 'linear' },
        { transform: 'scale(0.30)', opacity: 0.72, filter: 'blur(3px)',  offset: 0.75, easing: 'linear' },
        { transform: 'scale(0.30)', opacity: 0.04, filter: 'blur(6px)',  offset: 0.82, easing: 'linear' },
        { transform: 'scale(0.30)', opacity: 0.42, filter: 'blur(4px)',  offset: 0.88, easing: 'linear' },
        { transform: 'scale(0.30)', opacity: 0,    filter: 'blur(5px)',  offset: 1 }
      ], { duration: 480, fill: 'forwards' });

      sessionStorage.setItem('resume_hom6dtv', '1');
      setTimeout(function() { window.location.href = 'hom6dtv.html'; }, 500);
    }

    window.addEventListener('touchstart', function(e) {
      touchStartY = e.touches[0].clientY;
    }, { passive: true });
    window.addEventListener('touchend', function(e) {
      if (!ready || touchStartY === null) return;
      if (Math.abs(touchStartY - e.changedTouches[0].clientY) > 50) goUp();
      touchStartY = null;
    }, { passive: true });
    window.addEventListener('mousedown', function(e) { touchStartY = e.clientY; });
    window.addEventListener('mouseup', function(e) {
      if (!ready || touchStartY === null) return;
      if (Math.abs(touchStartY - e.clientY) > 30) goUp();
      touchStartY = null;
    });
    window.addEventListener('wheel', function(e) {
      if (ready) goUp();
    }, { passive: true });
  </script>

  <script>sessionStorage.setItem('gl_state', '1');</script>
  <script src="labels.js"></script>
</body>
</html>
