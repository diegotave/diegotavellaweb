<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diego Tavella</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #fff;
    }

    @keyframes bg-open {
      from { clip-path: inset(58% 0 0 0); }
      to   { clip-path: inset(0%  0 0 0); }
    }

    body {
      animation: bg-open 900ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    #armalogo {
      position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh;
      object-fit: contain;
      pointer-events: none;
      filter: invert(1);
    }

    body::after {
      content: '';
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.45) 100%);
      pointer-events: none;
      z-index: 1;
    }
  </style>
</head>
<body><script>(function(){if(sessionStorage.getItem('from_ajuste_wipe')){sessionStorage.removeItem('from_ajuste_wipe');document.documentElement.style.cssText+='';var s=document.createElement('style');s.textContent='body{animation:none!important;clip-path:none!important}';document.head.appendChild(s);}})()</script>

  <video id="armalogo" src="assets/videos/armalogo_hom6dtv.webm" preload="auto" playsinline muted></video>

  <script>
    var v = document.getElementById('armalogo');

    // Armalogo: último frame
    function seekToEnd() {
      if (v.duration && isFinite(v.duration)) {
        v.currentTime = v.duration;
      }
    }
    v.addEventListener('loadedmetadata', seekToEnd, { once: true });
    v.addEventListener('canplaythrough',  seekToEnd, { once: true });

    var swipeTriggered = false;
    var swipeBack      = false;
    var touchStartY    = null;

    function doSwipeDown() {
      if (swipeBack) return;
      swipeBack = true;
      var cover = document.createElement('div');
      cover.style.cssText = 'position:fixed;inset:0;background:#000;z-index:9999;pointer-events:none;';
      document.body.appendChild(cover);
      cover.animate(
        [{ transform: 'translateY(-100vh)' }, { transform: 'translateY(0)' }],
        { duration: 500, easing: 'cubic-bezier(0.4, 0, 0.2, 1)', fill: 'forwards' }
      );
      sessionStorage.setItem('resume_ajuste', '1');
      setTimeout(function() { window.location.href = 'ajuste.html'; }, 510);
    }

    function doSwipeUp() {
      if (swipeTriggered) return;
      swipeTriggered = true;

      var cover = document.createElement('div');
      cover.style.cssText = 'position:fixed;inset:0;background:#000;z-index:9999;pointer-events:none;';
      document.body.appendChild(cover);
      cover.animate(
        [{ transform: 'translateY(100vh)' }, { transform: 'translateY(0)' }],
        { duration: 500, easing: 'cubic-bezier(0.4, 0, 0.2, 1)', fill: 'forwards' }
      );
      sessionStorage.setItem('from_hom6dtv', '1');
      setTimeout(function() { window.location.href = 'workka2.html'; }, 510);
    }

    window.addEventListener('touchstart', function(e) {
      touchStartY = e.touches[0].clientY;
    }, { passive: true });
    window.addEventListener('touchend', function(e) {
      if (touchStartY === null) return;
      var dy = touchStartY - e.changedTouches[0].clientY;
      if (dy > 50)  doSwipeUp();
      if (dy < -50) doSwipeDown();
      touchStartY = null;
    }, { passive: true });
    window.addEventListener('mousedown', function(e) { touchStartY = e.clientY; });
    window.addEventListener('mouseup', function(e) {
      if (touchStartY === null) return;
      var dy = touchStartY - e.clientY;
      if (dy > 30)  doSwipeUp();
      if (dy < -30) doSwipeDown();
      touchStartY = null;
    });
    window.addEventListener('wheel', function(e) {
      if (e.deltaY > 0) doSwipeUp();
      if (e.deltaY < 0) doSwipeDown();
    }, { passive: true });

  </script>

</body>
</html>
