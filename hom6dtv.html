<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diego Tavella</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #fff;
    }

    #push-cover {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 58vh;
      background: #fff;
      z-index: 50;
      pointer-events: none;
      animation: push-up 900ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes push-up {
      from { transform: translateY(0); }
      to   { transform: translateY(-100%); }
    }

    #armalogo {
      position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh;
      object-fit: contain;
      pointer-events: none;
    }

    html::after {
      content: '';
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.45) 100%);
      pointer-events: none;
      z-index: 1;
    }

  </style>
</head>
<body><script>(function(){
  var s = document.createElement('style');
  if (sessionStorage.getItem('from_ajuste_wipe')) {
    sessionStorage.removeItem('from_ajuste_wipe');
    s.textContent = '#push-cover{display:none!important}';
    document.head.appendChild(s);
    var s2 = document.createElement('style');
    s2.id = 'hide-armalogo';
    s2.textContent = '#armalogo{opacity:0!important}';
    document.head.appendChild(s2);
  } else if (sessionStorage.getItem('resume_hom6dtv')) {
    sessionStorage.removeItem('resume_hom6dtv');
    s.textContent = '#push-cover{display:none!important}#armalogo{opacity:1!important}';
    document.head.appendChild(s);
    window._resumeHom = true;
  }
})()</script>

  <div id="push-cover"></div>
  <video id="armalogo" src="assets/videos/armalogoblack_hom6dtv.webm" preload="auto" playsinline muted></video>

  <script>
    var v = document.getElementById('armalogo');

    // Armalogo: último frame
    function seekToEnd() {
      if (v.duration && isFinite(v.duration)) {
        v.currentTime = v.duration;
      }
    }

    if (window._resumeHom) {
      v.addEventListener('loadedmetadata', seekToEnd, { once: true });
      v.addEventListener('canplaythrough',  seekToEnd, { once: true });

      var cover = document.createElement('div');
      cover.style.cssText = 'position:fixed;inset:0;background:#000;z-index:100;pointer-events:none;';
      document.body.appendChild(cover);
      cover.animate(
        [{ transform: 'translateY(0)' }, { transform: 'translateY(100vh)' }],
        { duration: 400, easing: 'cubic-bezier(0, 0, 0.2, 1)', fill: 'forwards' }
      );
    } else {
      v.addEventListener('loadedmetadata', seekToEnd, { once: true });
      v.addEventListener('canplaythrough',  seekToEnd, { once: true });

      // Flicker de entrada solo del logo: desde 0 hasta opacity 1
      v.addEventListener('seeked', function() {
        var hideStyle = document.getElementById('hide-armalogo');
        if (hideStyle) hideStyle.remove();
        var seq = [[0,0],[19,0.58],[30,0],[52,0.88],[61,0],[68,0.32],[75,0],[108,0.72],[118,0],[130,0.61],[139,0.15],[145,0],[168,0.86],[178,0],[198,1]];
        var t0 = performance.now(), si = 0;
        function flickIn() {
          var t = performance.now() - t0;
          while (si < seq.length && seq[si][0] <= t) { v.style.opacity = seq[si][1]; si++; }
          if (si < seq.length) requestAnimationFrame(flickIn);
          else v.style.opacity = '1';
        }
        requestAnimationFrame(flickIn);
      }, { once: true });
    }

    var swipeTriggered = false;
    var swipeBack      = false;
    var touchStartY    = null;

    function doSwipeDown() {
      if (swipeBack) return;
      swipeBack = true;
      var cover = document.createElement('div');
      cover.style.cssText = 'position:fixed;inset:0;background:#000;z-index:9999;pointer-events:none;';
      document.body.appendChild(cover);
      cover.animate(
        [{ transform: 'translateY(-100vh)' }, { transform: 'translateY(0)' }],
        { duration: 500, easing: 'cubic-bezier(0.4, 0, 0.2, 1)', fill: 'forwards' }
      );
      setTimeout(function() { window.location.href = 'ajuste2.html'; }, 510);
    }

    function doSwipeUp() {
      if (swipeTriggered) return;
      swipeTriggered = true;

      var cover = document.createElement('div');
      cover.style.cssText = 'position:fixed;inset:0;background:#000;z-index:9999;pointer-events:none;';
      document.body.appendChild(cover);
      cover.animate(
        [{ transform: 'translateY(100vh)' }, { transform: 'translateY(0)' }],
        { duration: 500, easing: 'cubic-bezier(0.4, 0, 0.2, 1)', fill: 'forwards' }
      );
      sessionStorage.setItem('from_hom6dtv', '1');
      setTimeout(function() { window.location.href = 'workka2.html'; }, 510);
    }

    window.addEventListener('touchstart', function(e) {
      touchStartY = e.touches[0].clientY;
    }, { passive: true });
    window.addEventListener('touchend', function(e) {
      if (touchStartY === null) return;
      var dy = touchStartY - e.changedTouches[0].clientY;
      if (dy > 50)  doSwipeUp();
      if (dy < -50) doSwipeDown();
      touchStartY = null;
    }, { passive: true });
    window.addEventListener('mousedown', function(e) { touchStartY = e.clientY; });
    window.addEventListener('mouseup', function(e) {
      if (touchStartY === null) return;
      var dy = touchStartY - e.clientY;
      if (dy > 30)  doSwipeUp();
      if (dy < -30) doSwipeDown();
      touchStartY = null;
    });
    window.addEventListener('wheel', function(e) {
      if (e.deltaY > 0) doSwipeUp();
      if (e.deltaY < 0) doSwipeDown();
    }, { passive: true });

  </script>

<script src="labels.js"></script>
</body>
</html>
