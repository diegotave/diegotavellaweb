      // portrait now also uses #bg-video (see syncLogoToRect's own
      // isPortrait branch, which plays and scales it in), so its src is
      // set unconditionally same as landscape - no orientation guard here
      // anymore.
      document.getElementById('bg-video').src = 'assets/videos/fdo_invloop.webm';
      document.getElementById('onda-video').src = 'assets/videos/ondablanca.webm';
    }
    if (location.hash !== '#from-contact' && location.hash !== '#from-menu-portrait') {
      loadHeavyVideos();
    }

    // the tagline<->botonera transformation (collapseCenterTagline /
    // multiplyPlusIntoBars / restoreCenterTagline below) animates close
    // to 20 elements' own left/top/width/clipPath at once - each one is
    // cheap alone, but that many simultaneous layout-triggering
    // animations is the heaviest single moment on the page, worse on a
    // weak tablet CPU than even the rect's own overshoot. On touch
    // devices this swaps those calls for an instant jump straight to
    // the end-state geometry (set once, no per-frame layout cost) plus
    // a short real opacity animation where the original had one -
    // opacity is compositor-only, so it stays cheap regardless of how
    // many elements fade at once. Desktop (fine pointer) is untouched -
    // always takes the real el.animate() path below. Mimics just enough
    // of the Animation interface (finished/commitStyles/cancel) for
    // every call site here, which all either chain .finished.then(...)
    // or await it via Promise.allSettled.
    function lightAnimate(el, keyframes, opts) {
      if (!isCoarsePointer) return el.animate(keyframes, opts);
      const end = keyframes[keyframes.length - 1];
      Object.keys(end).forEach((prop) => {
        if (prop !== 'opacity') el.style[prop] = end[prop];
      });
      if (end.opacity === undefined) {
        return { finished: Promise.resolve(), commitStyles() {}, cancel() {} };
      }
      const start = keyframes[0].opacity;
      return el.animate([{ opacity: start !== undefined ? start : end.opacity }, { opacity: end.opacity }], opts);
    }

    const canvas = document.querySelector('.canvas');

    // last known real cursor position - :hover isn't reliable for the
    // "was the mouse already sitting over #rect when the password gate
    // disappeared" check unlockPassword needs (see there): :hover is
    // only re-evaluated on an actual pointer event, not just because an
    // overlapping element - the gate - got display:none'd out from under
    // a stationary cursor, so #rect can stay geometrically under the
    // mouse yet never actually match :hover until the mouse so much as
    // twitches. Tracking the raw coordinates and hit-testing them
    // manually against getBoundingClientRect() sidesteps that entirely.
    let lastMouseX = null;
    let lastMouseY = null;
    document.addEventListener('mousemove', (e) => {
      lastMouseX = e.clientX;
      lastMouseY = e.clientY;
    }, { passive: true });

    // LOGO_PORTRAIT_SCALE/PASSWORD_PORTRAIT_SCALE (how much bigger the
    // password box and the initial "logo desarme" mark render in
    // portrait - see --logo-scale/--password-scale in the stylesheet)
    // are declared in the early <script> right after </style>, not here -
    // see its own comment for why that first write has to happen before
    // this file's body is parsed at all. Both stay irrelevant past the
    // first click on #rect: onRectClick's own press hard-resets
    // bracket-left/right/logo-text to a literal scale(1) inline style,
    // overriding these vars entirely.
    function fitCanvas() {
      const scale = stageBox().scale;
      canvas.style.transform = `scale(${scale})`;
      const portrait = isPortraitViewport();
      document.documentElement.style.setProperty('--logo-scale', portrait ? LOGO_PORTRAIT_SCALE : 1);
      document.documentElement.style.setProperty('--password-scale', portrait ? PASSWORD_PORTRAIT_SCALE : 1);
    }
    fitCanvas();
    window.addEventListener('resize', fitCanvas);

    // password gate: replaces the compact "logo desarme" mark until the
    // password is typed (see #password-gate in the stylesheet) -
    // onRectClick/setButtonHover below both bail out while locked, since
    // the button sits underneath the password UI anyway.
    // SHA-256 of the real password, hex-encoded - keeps it out of plain
    // view (a Ctrl+F in "view source" finds nothing readable) rather
    // than storing it as a literal string. Doesn't make this gate
    // actually secure (nothing sensitive sits behind it - it's the
    // intro's own UX beat, see the block comment below), just not a
    // one-glance reveal. See isCorrectPassword/sha256Hex just below.
    const PASSWORD_HASH = '8254c329a92850f6d539dd376f4816ee2764517da5e0235514af433164480d7a';
    const PASSWORD_LENGTH = 1; // 'k'.length - safe to reveal on its own, doesn't help crack the hash
    async function sha256Hex(text) {
      const bytes = new TextEncoder().encode(text);
      const digestBuf = await crypto.subtle.digest('SHA-256', bytes);
      return Array.from(new Uint8Array(digestBuf)).map((b) => b.toString(16).padStart(2, '0')).join('');
    }
    async function isCorrectPassword(value) {
      return (await sha256Hex(value)) === PASSWORD_HASH;
    }
    let passwordUnlocked = false;
    // stays false for a beat after passwordUnlocked itself flips true -
    // the password box and the forming logo are two separate objects
    // graphically, but treating the button as live the INSTANT the gate
    // starts leaving (rather than once it's actually gone and settled)
    // is what let stray state from the password box's own exit leak into
    // the button - see unlockPassword, which flips this on its own delay
    let rectInteractionReady = false;
    const passwordInput = document.getElementById('password-input');
    const passwordGate = document.getElementById('password-gate');
    const passwordMask = document.getElementById('password-mask');
    passwordInput.focus();

    // "ENTER PASSWORD" is width-matched to the rect's own current width
    // by tuning letter-spacing - same technique playCenterTagline uses to
    // balance "Video Editor"/"motion graphics" against each other:
    // measure once at the label's own base spacing, then solve for the
    // spacing that closes the gap to the target width.
    (function matchPasswordLabelWidth() {
      const label = document.getElementById('password-label');
      const targetWidth = document.getElementById('rect').offsetWidth;
      document.getElementById('password-label-clip').style.width = targetWidth + 'px';
      const baseLetterSpacing = 2;
      label.style.letterSpacing = baseLetterSpacing + 'px';
      const baseWidth = label.offsetWidth;
      const extraPerGap = (targetWidth - baseWidth) / label.textContent.length;
      label.style.letterSpacing = (baseLetterSpacing + extraPerGap) + 'px';
    })();

    // shared "this attempt failed" feedback - shakes the field (see
    // password-shake in the stylesheet), keeping the typed asterisks
    // visible for the whole shake rather than clearing them the instant
    // it starts (matching the real macOS wrong-password shake), only
    // wiping the value once the shake itself finishes. Disables the
    // input for that same stretch so a keystroke mid-shake can't race
    // the clear below or restart a second shake before this one's done.
    const SHAKE_MS = 400; // matches password-shake's own 0.4s animation
    function shakeAndClearPassword() {
      const valueWrap = document.getElementById('password-value-wrap');
      passwordInput.disabled = true;
      valueWrap.classList.remove('shake');
      void valueWrap.offsetWidth; // restarts the shake if one's already mid-flight
      valueWrap.classList.add('shake');
      setTimeout(() => {
        passwordInput.value = '';
        passwordMask.textContent = '';
        passwordInput.disabled = false;
        passwordInput.focus();
      }, SHAKE_MS);
    }

    // hashing is async (Web Crypto), so a fast typist can have more than
    // one check in flight at once - passwordCheckToken tags each one
    // with the keystroke that triggered it, so a check that resolves
    // late (after a newer keystroke already fired its own) never acts
    // on stale input
    let passwordCheckToken = 0;
    passwordInput.addEventListener('input', () => {
      const value = passwordInput.value;
      passwordMask.textContent = '*'.repeat(value.length);
      const token = ++passwordCheckToken;
      isCorrectPassword(value).then((correct) => {
        if (token !== passwordCheckToken) return;
        if (correct) {
          unlockPassword();
          return;
        }
        // waits until one past PASSWORD_LENGTH before flagging it wrong,
        // rather than shaking on whichever keystroke first breaks the
        // prefix match - less twitchy, and doesn't telegraph exactly how
        // many characters were actually right
        if (value.length >= PASSWORD_LENGTH + 1) {
          shakeAndClearPassword();
        }
      });
    });

    // Enter or a click on the field also submits directly - mainly
    // useful for an incomplete-but-still-valid-prefix value (e.g. "prom"),
    // which the live "input" check above never rejects on its own since
    // it's not wrong yet, just unfinished
    function trySubmitPassword() {
      if (passwordUnlocked) return;
      const token = ++passwordCheckToken;
      isCorrectPassword(passwordInput.value).then((correct) => {
        if (token !== passwordCheckToken) return;
        if (correct) unlockPassword();
        else shakeAndClearPassword();
      });
    }
    passwordInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') trySubmitPassword();
    });
    document.getElementById('password-value-wrap').addEventListener('click', trySubmitPassword);

    // brackets slide in from #bracket-left/#bracket-right's own
    // .bracket-offstage position (see the CSS comment) to their normal
    // scale(1.1) rest transform - via WAAPI rather than toggling the
    // class and leaning on a CSS transition, since the shared transition
    // on these two elements (filter 0.2s, transform 0.09s - see the
    // .logo-sprite-adjacent rule below) is tuned for the click-press's
    // own snappy shrink and would make this look like a cut if reused
    // here; an explicit animation sidesteps that entirely, same reasoning
    // as the button's own borderGrow/borderDarken earlier in this file.
    // Returns the finished promise so unlockPassword can wait for it
    // before starting "Diego"/"Tavella" - see its own comment on why
    // that's sequential now instead of running alongside this.
    function slideInBrackets() {
      const bl = document.getElementById('bracket-left');
      const br = document.getElementById('bracket-right');
      const isPortrait = isPortraitViewport();
      const restScale = 1.1 * (isPortrait ? LOGO_PORTRAIT_SCALE : 1);
      const opts = { duration: BRACKET_SLIDE_MS, easing: 'ease-in', fill: 'forwards' };
      const blAnim = bl.animate([{ transform: getComputedStyle(bl).transform }, { transform: `scale(${restScale})` }], opts);
      const brAnim = br.animate([{ transform: getComputedStyle(br).transform }, { transform: `scale(${restScale})` }], opts);
      return Promise.allSettled([blAnim.finished, brAnim.finished]).then(() => {
        // these two share a `transform 0.09s ease-out` transition with
        // #logo-text (see .logo-sprite-adjacent) for a different, later
        // interaction - commitAndCancel keeps that transition from
        // spuriously replaying over this animation's own final value
        commitAndCancel(bl, blAnim);
        commitAndCancel(br, brAnim);
        bl.classList.remove('bracket-offstage');
        br.classList.remove('bracket-offstage');
      });
    }

    // success sequence: "ENTER PASSWORD" and the typed value exit first
    // (LABEL_EXIT_MS, matching their own 0.25s CSS transition) - THEN the
    // brackets slide in from outside the rect (BRACKET_SLIDE_MS) - only
    // once they're fully settled do "Diego"/"Tavella" converge from
    // above/below (TEXT_CONVERGE_MS, matching their own 0.75s ease-in CSS
    // transition - previously ran at the same time as the brackets, now
    // sequential instead) - and only once THAT'S done does #logo-text get
    // revealed, an invisible swap since the Diego/Tavella halves just
    // animated into exactly its own look. #logo-text-window's clip-path
    // just sits at its own fixed CSS value the whole time now (no JS ever
    // touches it) instead of tracking the brackets' live position frame
    // by frame - that tracking only mattered while text and brackets
    // moved at the same time, and the brackets are already at rest by
    // the time the text ever starts moving now.
    const LABEL_EXIT_MS = 250;
    const BRACKET_SLIDE_MS = 750;
    const TEXT_CONVERGE_MS = 750;
    function unlockPassword() {
      passwordUnlocked = true;
      passwordInput.blur();
      passwordInput.disabled = true;

      const label = document.getElementById('password-label');
      label.style.letterSpacing = ''; // clear matchPasswordLabelWidth's inline override so .exiting's own letter-spacing can actually take over (an inline style otherwise beats any class rule, transition or not)
      label.classList.add('exiting');
      const valueWrap = document.getElementById('password-value-wrap');
      valueWrap.classList.add('exiting');

      setTimeout(() => {
        valueWrap.style.display = 'none';
        slideInBrackets().then(() => {
          document.getElementById('text-diego-half').classList.add('entered');
          document.getElementById('text-tavella-half').classList.add('entered');

          setTimeout(() => {
            passwordGate.style.display = 'none';
            document.getElementById('text-diego-half').style.display = 'none';
            document.getElementById('text-tavella-half').style.display = 'none';
            document.getElementById('logo-text').classList.add('revealed');
            // the button itself only goes live a beat after the password
            // box has actually finished leaving, not the instant its gate
            // disappears - the two are meant to be entirely separate
            // objects, and this gap is what keeps it that way instead of
            // whatever state the password box exited in bleeding straight
            // into the button underneath it.
            const RECT_INTERACTION_GRACE_MS = 400;
            setTimeout(() => {
              rectInteractionReady = true;
              // the password gate was covering/blocking #rect this whole
              // time, so if the mouse was already sitting over it (e.g.
              // came in over the gate, or the password was submitted with
              // Enter instead of a click that would've moved the cursor),
              // no mouseenter ever fires once the gate's gone - and :hover
              // is no help either (confirmed - still didn't catch this):
              // it's only re-evaluated on an actual pointer event, not just
              // because the gate disappeared out from under a stationary
              // cursor, so #rect can be geometrically right under the mouse
              // and still not match :hover. Hit-testing the last real
              // mousemove coordinates (see the listener up top) against the
              // hover-zone's own current rect sidesteps that, and runs the
              // exact same hover-start logic a real mouseenter would have
              // (in particular, #rect2 being "born" - see setButtonHover),
              // instead of the button silently skipping straight to a first
              // click with none of that ever having happened.
              if (lastMouseX !== null) {
                const hz = document.getElementById('rect-hover-zone').getBoundingClientRect();
                if (lastMouseX >= hz.left && lastMouseX <= hz.right && lastMouseY >= hz.top && lastMouseY <= hz.bottom) {
                  setButtonHover(true);
                }
              }
            }, RECT_INTERACTION_GRACE_MS);
          }, TEXT_CONVERGE_MS);
        });
      }, LABEL_EXIT_MS);
    }

    // matched keyframe-for-keyframe against the AE export of
    // "RECTANGULO CENTRAL STROKE 2": the rect is born small, grows
    // past its final size into a big overshoot, holds there, then
    // eases back down to rest. Split into two stops instead of one
    // continuous play: stop 1 (click on the small rect) plays growth
    // + hold and then just sits at the overshoot size; stop 2 (click
    // on the grown rect) plays the remaining ease back down to final.
    // All values are the AE keyframe values themselves (already in the
    // comp's own 1920x1080 units, hence no scaling math - the canvas
    // transform above is what maps them onto the real screen).
    // border-radius keyframes are AE roundness + half the 2px stroke
    // (AE insets its stroke, CSS border-radius doesn't) so the shape's
    // outer corner matches.
    const DURATION = 2202 * MOTION_SCALE; // ms - matches the AE comp's own timing (29.97fps), scaled by MOTION_SCALE on touch devices
    const OFFSETS = [0, 0.1515, 0.5, 0.7727, 1];

    // rect's own stroke width once pressed (see press.finished) - reused
    // by #header-fill/#header-line (advanceFromOvershoot) to inset
    // themselves inside that stroke instead of overlapping/covering it
    const RECT_BORDER_WIDTH = 2;

    // "gray" convention shared across this file: solid black fading to
    // this opacity - #logo-text's own 0.6 opacity is what it already
    // reads as; multiplyPlusIntoBars/restoreCenterTagline reuse the exact
    // same value for "botonera videos" (brackets + the 7 bars)
    const GRAY_OPACITY = 0.6;

    // "botonera videos" bar thickness once settled - same as
    // RECT_BORDER_WIDTH/the bracket-*-thin.png stroke, so the whole block
    // reads as one consistent 2px weight
    const THIN_BAR_WIDTH = RECT_BORDER_WIDTH;

    // "Video Editor"/"motion graphics" swap-slide duration - shared so
    // playCenterTagline's own reveal and collapseCenterTagline's hide (the
    // same slide, played in reverse) can never drift out of matching
    // speeds from an edit to just one of them
    const TAGLINE_SWAP_MS = 800 * MOTION_SCALE;

    // "botonera videos" forming/un-forming durations - shared so the
    // center "+"'s own arm shortening/growing (collapseCenterTagline/
    // restoreCenterTagline) always takes exactly as long as the bars and
    // brackets forming around it (multiplyPlusIntoBars) and un-forming
    // (restoreCenterTagline's own push-out), instead of the arms settling
    // on their own separate timeline (previously the CSS transition's own
    // fixed 1.4s) and visibly finishing later than everything else.
    const BOTONERA_FORM_MS = 600 * MOTION_SCALE;
    const BOTONERA_UNFORM_MS = 400 * MOTION_SCALE;

    // "button" press: rect starts 10% bigger than its BASE_WIDTHS[0]
    // rest size, solid black, logo inverted white (see .rect and
    // #bracket-left/#bracket-right/#logo-text in the stylesheet) - first
    // click presses it down to the normal rest size, then swaps to the
    // empty-fill/black-stroke/black-logo look the rest of this animation
    // already uses, and only then hands off to the existing grow stage
    const PRESS_SCALE = 1.1;
    const PRESS_DURATION = 90; // ms - snappier press, less time visibly "stuck" at the smaller pressed size before the grow stage takes over

    // idle (pre-press, unhovered) button fill - 80% black, not pure #000;
    // matches .rect's own CSS default so JS never re-introduces true black
    // when reverting to this same look (reset, or the mouse leaving before
    // any click)
    const IDLE_BLACK = '#333';

    // the rect's own CSS anchor (see .rect) - reused here so the logo
    // sync math below always agrees with wherever the box is actually
    // centered, instead of assuming the comp's own (960,540)
    const RECT_CENTER_X = 960;
    const RECT_CENTER_Y = 539.5;

    // globe (#bg-video, fdo_invloop.webm) reveal geometry - see
    // advanceFromOvershoot's own bodyBoxCenterY calc and
    // positionHeaderVideoInfo's #body-box for the two places this is
    // used. Measured directly off the source video: the sphere spans y
    // 317-751 of its native 1920x1080 (center ~540, i.e. frame-center,
    // matching "centered" by design) - the north pole (317) sits 317/1080
    // down from the video's own top BEFORE playCenterTagline's own
    // +50%-of-rect-height reveal shift, so (317+540)/1080 down from
    // rect's own top AFTER it (see either usage for the full reasoning).
    const GLOBE_NORTH_POLE_FRACTION = (317 + 540) / 1080;

    // base AE values - index 2/3 is the overshoot hold, "the second
    // instance / when it's square". Index 0/1 (the resting size) is the
    // one deliberate deviation from the raw AE export: width/height
    // reshaped, and the box centered on RECT_CENTER_Y above (the bracket
    // mark's own true center, not the comp's 540) so the rest-state box
    // gives the compact bracket mark an equal 19.075px margin on all
    // four sides. Index 2/3's width is the other deviation: the raw AE
    // value (1409.3) was actually 1.27:1, not square despite the name -
    // narrowed to match BASE_HEIGHTS[2] exactly so the overshoot really
    // is a square, at any viewport (both axes still scale by the same
    // factor in overshootValues(), so equal base values stay equal).
    const BASE_WIDTHS = [206.15, 206.15, 1108.30055123673, 1108.30055123673, 498.480010986328];
    const BASE_HEIGHTS = [143.15, 143.15, 1108.30055123673, 1108.30055123673, 279.519989013672];
    const BASE_RADII = [3, 3, 31, 31, 4]; // index 0/1 (rest/pressed corners) bumped from the raw AE 1px to 3px, a touch more rounded

    // the overshoot's on-screen height is pinned to leave this much
    // vertical margin against the real viewport (not the 1920x1080
    // canvas) - width and border-radius are scaled by the exact same
    // factor as height, so the shape's proportions never change, only
    // its overall size
    const TOP_MARGIN_VH = 5;
    const BOTTOM_MARGIN_VH = 5;
    // portrait ("vertical version"): same idea as contact.html's own
    // PORTRAIT_RATIO/SIDE_MARGIN_VW (see its comment there) - the
    // overshoot stops being square and is sized by WIDTH instead, capped
    // by the same height budget above so it still can't overshoot
    // vertically. Not used for BASE_WIDTHS[0]/[1] (the small idle
    // button) - only the overshoot (index 2/3), which is what "step 1"'s
    // whole layout (logo/contact/blink-square/tagline/globe, all
    // positioned off this box's own live edges) is actually built around.
    const SIDE_MARGIN_VW = 8;
    // portrait's own rect block (rect/rect2/their frames) reads small
    // with the same margins landscape uses - tightened 65% for portrait
    // ONLY (landscape keeps TOP_MARGIN_VH/BOTTOM_MARGIN_VH/SIDE_MARGIN_VW
    // exactly as they've always been) so the whole block sits closer to
    // the real viewport edges and reads bigger overall
    const PORTRAIT_MARGIN_SCALE = 0.35; // 65% reduction from the base margins above
    // #rect's own border reads noticeably thin once the whole block is
    // bigger (see PORTRAIT_MARGIN_SCALE above) - a bit heavier in
    // portrait only, landscape's own 2px (set at both spots below)
    // untouched
    const RECT_BORDER_WIDTH_PORTRAIT = 3;

    const wEase = ['linear', 'cubic-bezier(0.2604,0,0.1443,1)', 'cubic-bezier(0.3333,0.3333,0.6667,0.6667)', 'cubic-bezier(0.1667,0,0.6667,1)'];
    const hEase = ['linear', 'cubic-bezier(0.2883,0,0.2990,1)', 'cubic-bezier(0.3333,0.3333,0.6667,0.6667)', 'cubic-bezier(0.1667,0,0.8333,1)'];
    const rEase = ['linear', 'cubic-bezier(0.3333,0.3333,0.6667,0.6667)', 'cubic-bezier(0.3333,0.3333,0.6667,0.6667)', 'cubic-bezier(0.3333,0.3333,0.6667,1)'];

    // slices [fromIdx, toIdx] of the 5-point keyframe series above into
    // its own self-contained animation, reusing the same per-segment
    // easings unchanged and rescaling duration/offsets proportionally
    // to how much of the full AE timeline that slice spans
    function buildStage(fromIdx, toIdx, widths, heights, radii) {
      const t = OFFSETS.map((o) => o * DURATION);
      const stageDuration = t[toIdx] - t[fromIdx];
      const stageOffsets = OFFSETS.slice(fromIdx, toIdx + 1).map((o) => (o * DURATION - t[fromIdx]) / stageDuration);

      function buildKeyframes(values, prop, fmt, easings) {
        return values.slice(fromIdx, toIdx + 1).map((v, i) => {
          const kf = { offset: stageOffsets[i] };
          kf[prop] = fmt(v);
          if (i < toIdx - fromIdx) kf.easing = easings[fromIdx + i];
          return kf;
        });
      }

      const px = (v) => v + 'px';
      const opts = { duration: stageDuration, fill: 'forwards', easing: 'linear' };
      return {
        keyframes: [
          buildKeyframes(widths, 'width', px, wEase),
          buildKeyframes(heights, 'height', px, hEase),
          buildKeyframes(radii, 'borderRadius', px, rEase)
        ],
        opts
      };
    }

    // portrait: fits the overshoot to its own side margin (tightened by
    // PORTRAIT_MARGIN_SCALE, same as the top/bottom margins in the
    // caller), independent of height - it's meant to read as a tall
    // portrait rect, not a scaled-up copy of the landscape square.
    // landscape: keeps the AE export's own square aspect instead, width
    // simply following whatever height desiredLocalHeightPx already
    // settled on.
    function computeOvershootWidth(isPortrait, canvasScale, desiredLocalHeightPx) {
      if (isPortrait) {
        const sideMarginVW = SIDE_MARGIN_VW * PORTRAIT_MARGIN_SCALE;
        const desiredRealWidthPx = stageBox().realW * (1 - (sideMarginVW * 2) / 100);
        return desiredRealWidthPx / canvasScale;
      }
      const s = desiredLocalHeightPx / BASE_HEIGHTS[2];
      return BASE_WIDTHS[2] * s;
    }

    // recomputes the overshoot (index 2/3) so it renders at exactly
    // (100 - TOP_MARGIN_VH - BOTTOM_MARGIN_VH)vh tall on the real
    // screen, undoing the canvas's own scale() first since sizes here
    // are in canvas-local (1920x1080) units. Width and radius are
    // scaled by the same factor as height so the overshoot's shape
    // never distorts, only grows/shrinks as a whole.
    function overshootValues() {
      const canvasScale = stageBox().scale;
      const isPortrait = isPortraitViewport();
      // landscape uses TOP_MARGIN_VH/BOTTOM_MARGIN_VH/SIDE_MARGIN_VW
      // untouched - portrait gets all three tightened by
      // PORTRAIT_MARGIN_SCALE (see its own comment)
      const topMarginVH = isPortrait ? TOP_MARGIN_VH * PORTRAIT_MARGIN_SCALE : TOP_MARGIN_VH;
      const bottomMarginVH = isPortrait ? BOTTOM_MARGIN_VH * PORTRAIT_MARGIN_SCALE : BOTTOM_MARGIN_VH;
      const desiredRealHeightPx = stageBox().realH * (1 - (topMarginVH + bottomMarginVH) / 100);
      const desiredLocalHeightPx = desiredRealHeightPx / canvasScale;

      const widths = BASE_WIDTHS.slice();
      const heights = BASE_HEIGHTS.slice();
      const radii = BASE_RADII.slice();

      const desiredLocalWidthPx = computeOvershootWidth(isPortrait, canvasScale, desiredLocalHeightPx);
      // radius still scales by ONE factor shared by both axes (the
      // smaller of the two, same reasoning as contact.html's own rect2
      // margin) so it stays circular instead of stretching into an
      // ellipse once width and height stop matching
      const radiusScale = Math.min(desiredLocalWidthPx, desiredLocalHeightPx) / BASE_HEIGHTS[2];
      widths[2] = widths[3] = desiredLocalWidthPx;
      heights[2] = heights[3] = desiredLocalHeightPx;
      radii[2] = radii[3] = BASE_RADII[2] * radiusScale;
      return { widths, heights, radii };
    }

    let step = 0; // 0 = at rest, 1 = grown/holding, 2 = settled at final
    let rectAnimating = false;

    function runStage(stage) {
      const el = document.getElementById('rect');
      rectAnimating = true;
      const anims = stage.keyframes.map((kf) => el.animate(kf, stage.opts));
      return Promise.allSettled(anims.map((a) => a.finished)).then(() => {
        anims.forEach((a) => a.commitStyles());
        anims.forEach((a) => a.cancel());
        rectAnimating = false;
      });
    }

    // hands a finished WAAPI animation's value off to a plain inline
    // style (commitStyles + cancel) the same way most of this file's
    // `.finished.then()` callbacks already do - except it also brackets
    // that handoff with a momentary transition:none on the element.
    // Needed only where the SAME property is also driven by a real CSS
    // `transition` rule elsewhere on that selector (bracket-left/right's
    // own transform, tagline-left/right's own left/right, bg-video's own
    // transform) - confirmed in Firefox specifically, canceling a WAAPI
    // animation can spuriously re-trigger that other transition for one
    // frame even though commitStyles already left the value unchanged,
    // reading as the move stuttering/repeating itself right at the end.
    // The offsetHeight read forces layout so the transition:none is
    // actually in effect for the commit+cancel before being lifted again.
    function commitAndCancel(el, anim) {
      const prevTransition = el.style.transition;
      el.style.transition = 'none';
      anim.commitStyles();
      anim.cancel();
      void el.offsetHeight;
      el.style.transition = prevTransition;
    }

    // portrait ("vertical version") only: bakes the remaining --logo-scale
    // multiplier into #rect/#rect2's own literal width/height/borderRadius
    // (removing their transform entirely) and matches buildStage's own
    // first keyframe (widths[1]/heights[1]/radii[1]) to it, instead of
    // animating the scale away in parallel with the growth stage that
    // follows this. Tried the parallel-animation version first: WAAPI
    // resolves a percentage transform like translate(-50%,-50%) against
    // whatever width/height the element had when that animation was
    // CREATED, not live per-frame, so it drifted further off-center every
    // frame the width/height kept changing underneath it via the SEPARATE
    // growth animation - confirmed as "se escapa de los limites, no viaja
    // recto" once actually looked at. Baking the multiplier into the width
    // instead means translate(-50%,-50%) is never WAAPI-animated at all -
    // it stays the plain, live-recalculating CSS value it always was
    // pre-portrait, so the growth stage (which only touches width/height/
    // borderRadius) keeps everything centered for free, every frame,
    // automatically. Called from onRectClick's own press.finished handler.
    function bakePortraitPressScale(el, rect2El, restTransform, widths, heights, radii) {
      [el, rect2El].forEach((sizeEl) => {
        const w = parseFloat(sizeEl.style.width) * LOGO_PORTRAIT_SCALE;
        const h = parseFloat(sizeEl.style.height) * LOGO_PORTRAIT_SCALE;
        const r = parseFloat(getComputedStyle(sizeEl).borderRadius) * LOGO_PORTRAIT_SCALE;
        sizeEl.style.width = w + 'px';
        sizeEl.style.height = h + 'px';
        sizeEl.style.borderRadius = r + 'px';
        sizeEl.style.transform = restTransform;
      });
      // #rect-frame never has its own width/height - syncRectMasks
      // (script) mirrors rect2's onto it every frame regardless, so it
      // only needs its transform dropped here, once, same as
      // #rect-hover-zone (also never separately sized) back in the caller.
      document.getElementById('rect-frame').style.transform = restTransform;
      // stage1Duration's own growth (buildStage, called right after this
      // in onRectClick) starts at index 1 - matching that index to
      // #rect's own just-baked bigger width/height/radius above keeps
      // that animation's first keyframe from jumping away from what's
      // actually on screen. Indices 2/3 (the overshoot) stay untouched:
      // growth ends at the normal, unscaled size same as landscape.
      widths[1] *= LOGO_PORTRAIT_SCALE;
      heights[1] *= LOGO_PORTRAIT_SCALE;
      radii[1] *= LOGO_PORTRAIT_SCALE;
    }

    function onRectClick() {
      if (!passwordUnlocked || !rectInteractionReady || rectAnimating) return;
      const el = document.getElementById('rect');

      if (step === 0) {
        rectAnimating = true; // block a second click during the press itself too, not just once the grow stage starts
        const logoInk = [document.getElementById('bracket-left'), document.getElementById('bracket-right'), document.getElementById('logo-text')];
        const isPortraitClick = isPortraitViewport();
        // logo shrinks from its own 1.1x-on-top-of-idle scale down to
        // just the idle multiplier itself (1 in landscape, where "idle"
        // means no extra multiplier at all; LOGO_PORTRAIT_SCALE in
        // portrait, where --logo-scale IS the idle multiplier) in step
        // with the button's own press (both PRESS_DURATION) - the same
        // proportional ~10% dip either way, just expressed as "drop the
        // 1.1x" instead of "drop everything". Dropping the portrait
        // multiplier here TOO (i.e. straight to scale(1)) was tried
        // first and shrank the button by ~64% in one frame instead of
        // the intended ~10% (1.1x AND 2.5x coming off at once,
        // compounding instead of just the press's own dip) - confirmed
        // as "se achica mucho" once portrait was actually looked at. The
        // remaining LOGO_PORTRAIT_SCALE comes off further down, folded
        // into the overshoot growth below instead, where a much bigger
        // simultaneous size change already masks it.
        const inkPressScale = isPortraitClick ? LOGO_PORTRAIT_SCALE : 1;
        logoInk.forEach((e) => { e.style.transform = `scale(${inkPressScale})`; });
        const restTransform = 'translate(-50%, -50%)';
        const press = el.animate(
          [
            { width: getComputedStyle(el).width, height: getComputedStyle(el).height },
            { width: BASE_WIDTHS[0] + 'px', height: BASE_HEIGHTS[0] + 'px' }
          ],
          { duration: PRESS_DURATION, easing: 'ease-out', fill: 'forwards' }
        );
        press.finished.then(() => {
          press.commitStyles();
          press.cancel();
          // was '#fff' - now transparent instead, so #rect2 (and whatever
          // else ends up sitting behind rect) actually shows through. Not
          // a visual regression on its own: the page's own background is
          // already solid white (see html,body), so everything drawn IN
          // FRONT of rect (brackets/text/header/video) looks identical
          // either way - this only changes what shows through the parts
          // of rect nothing else covers.
          el.style.background = 'transparent';
          logoInk.forEach((e) => { e.style.filter = 'none'; });

          // bakes the remaining portrait --logo-scale multiplier into
          // #rect/#rect2's own width/height/radius (and matches
          // buildStage's own first keyframe to it) instead of animating
          // the scale away in parallel with the growth below - see
          // bakePortraitPressScale's own comment for why. No-op in
          // landscape.
          const rect2El = document.getElementById('rect2');
          const { widths, heights, radii } = overshootValues();
          if (isPortraitClick) {
            bakePortraitPressScale(el, rect2El, restTransform, widths, heights, radii);
          } else {
            el.style.transform = restTransform;
          }
          document.getElementById('rect-hover-zone').style.transform = restTransform;
          // reaches its own final size at this same point in the timeline
          // (index 3, the overshoot) - see stage1Duration's other use
          // below - so the border grow/darken is timed to land on 2px
          // solid black exactly when the box is done growing, not sooner.
          // Stage starts at index 1, not 0: the AE export's own indices 0
          // and 1 are identical values (same rest size both times, a
          // deliberate hold in the original keyframes) - animating that
          // segment did nothing visible but still ate ~330ms sitting at
          // the pressed size before the actual growth kicked in, which
          // read as the button being stuck. Skipping straight to index 1
          // (numerically the same spot the button's already at, so no
          // jump) removes that dead time entirely instead of shortening it.
          const stage1Duration = DURATION * (OFFSETS[3] - OFFSETS[1]);
          runStage(buildStage(1, 3, widths, heights, radii));
          // bracket-left/right/logo-text's own remaining portrait scale
          // (still sitting at LOGO_PORTRAIT_SCALE from the press) comes
          // off inside syncLogoToRect's own live tick() loop below instead
          // of a separate WAAPI animation here - same reasoning as #rect/
          // #rect2 above: tick() already recomputes every frame off the
          // rect's LIVE width, so folding the de-scale into its existing
          // per-frame math (see BRACKET_REST_SCALE/textPortraitScale
          // there) tracks it perfectly with no separate animation to fall
          // out of sync.
          // #rect2 grows through this exact same 1->3 stage as rect
          // itself, same keyframes/easing/speed (built via the same
          // buildStage, just reparametrized onto rect2's own start/target
          // range - see remapToRect2 below) rather than a plain linear
          // tween, so the two visually move as one instead of rect2
          // drifting in and out of step mid-growth even though both start
          // and end together. Ends 3% smaller than the square rect is
          // about to reach, radius concentrically inset (not scaled - see
          // the "calle"/gap-width comment this was worked out from).
          const rect2 = document.getElementById('rect2');
          const RECT2_SCALE = 0.97;
          const rect2StartWidth = parseFloat(rect2.style.width);
          const rect2StartHeight = parseFloat(rect2.style.height);
          const rect2StartRadius = parseFloat(rect2.style.borderRadius);
          // one shared margin (off widths[3] - the narrower axis outside
          // portrait, same value as heights[3] anyway) applied to BOTH
          // width and height, rather than each axis keeping its own 3%
          // - that made the "calle" gap noticeably wider on whichever
          // axis was bigger (heights[3], once portrait stopped keeping
          // width===height) instead of the same width all the way around
          const rect2Margin = (widths[3] * (1 - RECT2_SCALE)) / 2;
          const rect2TargetWidth = widths[3] - rect2Margin * 2;
          const rect2TargetHeight = heights[3] - rect2Margin * 2;
          const rect2TargetRadius = Math.max(0, radii[3] - rect2Margin);
          // maps rect's own keyframe VALUES (baseArr) onto rect2's
          // start/target range, point for point - baseArr[i]'s own
          // fractional progress between baseArr[1] (this stage's own
          // start index, see above) and baseArr[3] becomes that same
          // fraction of the way from newStart to newTarget, so feeding
          // the result through buildStage's own per-segment easing
          // reproduces rect's exact relative motion curve
          function remapToRect2(baseArr, newStart, newTarget) {
            const range = baseArr[3] - baseArr[1];
            return baseArr.map((v) => newStart + (newTarget - newStart) * (range === 0 ? 0 : (v - baseArr[1]) / range));
          }
          const rect2Widths = remapToRect2(widths, rect2StartWidth, rect2TargetWidth);
          const rect2Heights = remapToRect2(heights, rect2StartHeight, rect2TargetHeight);
          const rect2Radii = remapToRect2(radii, rect2StartRadius, rect2TargetRadius);
          const rect2Stage = buildStage(1, 3, rect2Widths, rect2Heights, rect2Radii);
          const rect2Anims = rect2Stage.keyframes.map((kf) => rect2.animate(kf, rect2Stage.opts));
          Promise.allSettled(rect2Anims.map((a) => a.finished)).then(() => {
            rect2Anims.forEach((a) => { a.commitStyles(); a.cancel(); });
          });
          // border-width can't actually animate smoothly while width/
          // height/border-radius are ALSO animating on this same
          // border-box element - confirmed directly: Blink freezes it at
          // its start value for the entire run and only snaps to the end
          // value once everything commits, and a CSS `transition` on
          // border-width has the exact same freeze, so this isn't a
          // WAAPI-specific issue. An inset box-shadow doesn't participate
          // in layout at all, so it isn't affected, and it already
          // follows the box's own (also animating) border-radius live -
          // stands in for the real border, hidden by making the real
          // border transparent for now.
          //
          // Handing back off to the real border still isn't perfectly
          // seamless - box-shadow and border don't quite render their
          // rounded corner identically, enough to read as a tiny "pop".
          // Doing that handoff at the very end (once the rect is sitting
          // still) put that pop right when the eye has nothing else to
          // look at. BORDER_GROW_SWAP_FRACTION moves it earlier instead,
          // to partway through the still-growing box, where the same pop
          // gets lost in everything else that's already moving - the
          // box-shadow only carries the width/color growth up to that
          // point, and a second, ordinary border-color animation (color
          // alone animates fine mid-layout-animation, it's only width
          // that freezes) carries the color the rest of the way to #000,
          // still landing exactly on stage1Duration. Has to stay below
          // ~0.647 (OFFSETS[2]/OFFSETS[3], i.e. (0.5-0)/(0.7727-0)) - past
          // that the rect itself has already stopped growing and is just
          // holding at the overshoot for the remainder of stage1Duration,
          // which is exactly the "sitting still" moment this is trying to
          // avoid landing the swap on.
          const BORDER_GROW_SWAP_FRACTION = 0.4;
          const swapWidth = 1.5 + BORDER_GROW_SWAP_FRACTION * (2 - 1.5);
          const idleGray = 0x33; // IDLE_BLACK's own #333
          const swapGray = Math.round(idleGray * (1 - BORDER_GROW_SWAP_FRACTION));
          const swapColor = `rgb(${swapGray}, ${swapGray}, ${swapGray})`;
          const phase1Duration = stage1Duration * BORDER_GROW_SWAP_FRACTION;
          const phase2Duration = stage1Duration - phase1Duration;

          el.style.borderColor = 'transparent';
          const borderGrow = el.animate([
            { boxShadow: `0 0 0 1.5px ${IDLE_BLACK} inset` },
            { boxShadow: `0 0 0 ${swapWidth}px ${swapColor} inset` }
          ], { duration: phase1Duration, easing: 'ease', fill: 'forwards' });
          borderGrow.finished.then(() => {
            borderGrow.commitStyles();
            borderGrow.cancel();
            el.style.boxShadow = '';
            el.style.borderWidth = (isPortraitViewport() ? RECT_BORDER_WIDTH_PORTRAIT : 2) + 'px';
            el.style.borderColor = swapColor;
            const borderDarken = el.animate([{ borderColor: swapColor }, { borderColor: '#000' }], { duration: phase2Duration, easing: 'ease', fill: 'forwards' });
            borderDarken.finished.then(() => {
              borderDarken.commitStyles();
              borderDarken.cancel();
            });
          });
          // bg-video/onda-video both track their own mask's live size and
          // rounded corners automatically (width:100%/height:100%/
          // object-fit:cover in their own CSS, clipped by their mask's
          // overflow:hidden - #bg-video-mask kept in sync to #rect by
          // syncRectMasks, onda-video's own #rect2 tracks itself) -
          // nothing to size here anymore.
          // scheduled directly off the stage's own duration instead of
          // chaining off its promise (which only resolves after the full
          // hold tail too) - fires TAGLINE_EARLY_MS sooner than that,
          // i.e. close to when the box is actually done growing
          taglineTimeoutId = setTimeout(playCenterTagline, Math.max(0, stage1Duration - TAGLINE_EARLY_MS + TAGLINE_DELAY));
          syncLogoToRect(widths[2], heights[2]);
        });
        step = 1;
      } else if (step === 1) {
        // no-op: the big rect/its own hover-zone used to advance from
        // here too, but the second click's hit target is now just the
        // blink square + a few px (see advanceFromOvershoot, wired to
        // #blink-square-hover-zone instead)
        return;
      } else {
        // no-op for now, same reasoning as step===1 above: step 2 is now
        // a rich, clickable area of its own (globe video, "botonera
        // videos") that spans most of the rect, so a stray click on it
        // must not bounce all the way back to the logo/step 0 - only the
        // back-triangle (#blink-square-hover-zone, wired to
        // reverseFromWidened) navigates away from here. goHome() is still
        // there for whenever going back to the logo from this point is
        // actually designed - just not reachable yet.
        return;
      }
    }

    // shared "home" reset - un-presses the button (big, black fill, white
    // logo) and clears every stage built on top of it, without touching
    // passwordUnlocked/the password gate: once unlocked, this is the
    // furthest back any in-app control goes. Used both by clicking the
    // rect once step 2 is reached, and by the back-triangle button (see
    // #blink-square-hover-zone's click handler below).
    function goHome() {
      const el = document.getElementById('rect');
      el.style.width = (BASE_WIDTHS[0] * PRESS_SCALE) + 'px';
      el.style.height = (BASE_HEIGHTS[0] * PRESS_SCALE) + 'px';
      el.style.borderRadius = BASE_RADII[0] + 'px';
      el.style.background = IDLE_BLACK;
      el.style.borderColor = ''; // clear back to the CSS default (transparent, hover-only reveal) - not '#fff', which would override the hover behavior outright
      el.style.borderWidth = ''; // clear back to the CSS default 1.5px - the 2px set on press only applies once pressed
      el.style.boxShadow = ''; // clear the box-shadow stand-in used only during the grow-to-overshoot border animation - see press.finished
      [document.getElementById('bracket-left'), document.getElementById('bracket-right'), document.getElementById('logo-text')]
        .forEach((e) => { e.style.filter = ''; e.style.transform = ''; });
      resetLogoDesarme();
      resetCenterTagline();
      hideBgVideo();
      step = 0;
    }

    // the actual second-click action (was inline in onRectClick's
    // step===1 branch) - now triggered only by #blink-square-hover-zone,
    // not the big rect/its own hover-zone, so the only clickable area
    // once the rect is holding at its overshoot is the blink square
    // itself plus BLINK_HIT_PADDING
    function advanceFromOvershoot() {
      if (rectAnimating || step !== 1) return;
      const el = document.getElementById('rect');
      // continue from wherever stop 1 actually left the element (not a
      // recomputed value), so a resize between clicks can't cause a jump
      // at the start of this stage
      const widths = BASE_WIDTHS.slice();
      const heights = BASE_HEIGHTS.slice();
      const radii = BASE_RADII.slice();
      widths[3] = parseFloat(el.style.width);
      heights[3] = parseFloat(el.style.height);
      radii[3] = parseFloat(el.style.borderRadius);
      // widen to 16:9 instead of the AE export's own (shrinking) index-4
      // values: height holds at whatever the overshoot already settled
      // on, width grows to match a 16:9 ratio. Center stays the anchor
      // (el's own left/top + translate(-50%,-50%) never change), so the
      // extra width spreads out evenly left/right. Radius untouched for
      // now - other elements to follow.
      // portrait ("vertical version"): rect/rect2 stay exactly the size
      // the overshoot already left them at - no 16:9 widen, that's a
      // landscape-only move (rect is already tall there, not a square
      // needing to spread out). Leaving widths[4]/heights[4] equal to
      // widths[3]/heights[3] turns every dx below (blink square, "Diego
      // Tavella", header line/fill width, rect2 width, runStage's own
      // resize) into a harmless no-op, so this single override is enough
      // to keep rect1 and its derivatives untouched without duplicating
      // the rest of this function.
      const isPortrait = isPortraitViewport();
      heights[4] = heights[3];
      widths[4] = isPortrait ? widths[3] : heights[3] * 16 / 9;
      radii[4] = radii[3];

      // blink-square + its hover-zone stay pinned to the rect's
      // bottom-right corner (same offset they already had at the
      // overshoot) while the rect widens, and the square turns flat
      // (in-plane rotate(), counterclockwise - see #blink-square.triangle.
      // back) from pointing right to pointing left in lockstep with that
      // same displacement - both run as their own WAAPI animations (not a
      // rAF loop reading live styles, and not the element's own CSS
      // `transition: transform`, which would otherwise fight per-frame
      // updates) sharing this exact duration/easing with the rect's own
      // width stage below, so all three start together and land together,
      // the instant the rect finishes widening.
      const sq = document.getElementById('blink-square');
      const hz = document.getElementById('blink-square-hover-zone');
      // "Contact" only belongs to the square hold - hides for the
      // widened layout, restored by reverseFromWidened once back
      document.getElementById('contact-button').classList.remove('visible');
      sq.classList.add('triangle'); // guaranteed even if this fires without a prior hover (e.g. touch)
      const sqStartLeft = parseFloat(sq.style.left);
      const hzStartLeft = parseFloat(hz.style.left);
      const dxFinal = (widths[4] - widths[3]) / 2; // center-anchored growth: right edge moves out by half the width increase
      const stageDuration = DURATION * (OFFSETS[4] - OFFSETS[3]);
      const followOpts = { duration: stageDuration, easing: wEase[3], fill: 'forwards' };

      const sqAnim = sq.animate([
        { left: sqStartLeft + 'px', transform: 'scale(1.5) rotate(0deg)' },
        { left: (sqStartLeft + dxFinal) + 'px', transform: 'scale(1.5) rotate(-180deg)' }
      ], followOpts);
      const hzAnim = hz.animate([
        { left: hzStartLeft + 'px' },
        { left: (hzStartLeft + dxFinal) + 'px' }
      ], followOpts);
      Promise.allSettled([sqAnim.finished, hzAnim.finished]).then(() => {
        [sqAnim, hzAnim].forEach((a) => { a.commitStyles(); a.cancel(); });
        sq.style.transform = ''; // hand off to #blink-square.triangle.back - same final value
        sq.classList.add('back');
      });

      // "Diego Tavella" (the wordmark only - not bracket-left, which stays
      // put) tracks rect's top-left corner the same way - that corner
      // moves the opposite direction from the bottom-right one
      // blink-square tracks (center-anchored growth pushes the left edge
      // further left by the same magnitude dxFinal pushes the right edge
      // further right), so this element's own dx is simply dxFinal's
      // negative
      const txt = document.getElementById('logo-text');
      const txtStartLeft = parseFloat(txt.style.left);
      const dxLeft = -dxFinal;
      const txtAnim = txt.animate([
        { left: txtStartLeft + 'px' },
        { left: (txtStartLeft + dxLeft) + 'px' }
      ], followOpts);
      txtAnim.finished.then(() => {
        txtAnim.commitStyles();
        txtAnim.cancel();
      });

      // header divider + fill both sit INSET by rect's own stroke width on
      // every side they share with it (left/right/top), so that stroke
      // stays fully visible framing the header, same as it already frames
      // the rest of rect - neither one ever paints over it. widthInset is
      // the resulting width (rect's own width minus the two side insets);
      // centered the same way rect is, so it's automatically inset evenly
      // on both sides with no separate left-tracking needed.
      const line = document.getElementById('header-line');
      const fill = document.getElementById('header-fill');
      const rectTop = RECT_CENTER_Y - heights[3] / 2;
      const textTop = rectTop + EDGE_MARGIN_Y;
      // txt's actual (already portrait-grown, if applicable) height -
      // still needed below for revealFollow's own clip-path math, which
      // has to match the REAL rendered text span regardless of how big
      // that is. Only lineEndTopBase avoids this one, using the
      // landscape-equivalent height instead - see its own comment.
      const textHeight = parseFloat(txt.style.height);
      const lineStartTop = rectTop + RECT_BORDER_WIDTH;
      // portrait ("vertical version"): header grows taller (see
      // computePortraitLineEndTop) - rect2's own target top edge below
      // reads lineEndTop directly (rect2TargetTopEdgeY), so routing it
      // through there is enough to push rect2/the botonera row down with
      // it too, no separate adjustment needed. lineEndTopBase uses the
      // LANDSCAPE-equivalent text bottom (TEXT_BASE_HEIGHT*TEXT_END_SCALE),
      // not txt's actual current height - txt is already grown to its
      // portrait-final size by this point (syncLogoToRect, first click),
      // and feeding that bigger height back into this formula would
      // compound the very growth it's supposed to be a reference point
      // for. computePortraitLineEndTop is the same function
      // syncLogoToRect calls with this same lineEndTopBase, so both
      // always land on the same header height.
      const lineEndTopBase = (textTop + TEXT_BASE_HEIGHT * TEXT_END_SCALE) + EDGE_MARGIN_Y;
      const lineEndTop = isPortrait
        ? computePortraitLineEndTop(lineStartTop, lineEndTopBase)
        : lineEndTopBase;
      const widthInsetStart = widths[3] - RECT_BORDER_WIDTH * 2;
      const widthInsetEnd = widths[4] - RECT_BORDER_WIDTH * 2;
      // an inset rect nested BORDER_WIDTH inside a radius-R corner reads
      // correctly as concentric with a radius of (R - BORDER_WIDTH)
      const fillRadius = Math.max(0, radii[3] - RECT_BORDER_WIDTH);

      // "Diego Tavella" is already sized for this taller header by now -
      // syncLogoToRect (first click) grows it straight to the size this
      // stage's own lineEndTop needs, using the exact same formula this
      // used to repeat here as a second, separate grow - so there's
      // nothing left to resize on this element in this stage.
      // header readout's own geometry depends on both the triangle's and
      // "Diego Tavella"'s FINAL rects (see positionHeaderVideoInfo) -
      // reading them here, gated on all three of this stage's own
      // animations, not from multiplyPlusIntoBars (which runs on
      // collapseCenterTagline's separate, shorter timeline and was
      // finishing well before this stage's own widen/slide was actually
      // done, reading the triangle mid-flight and landing the number way
      // short of its true edge)
      Promise.allSettled([sqAnim.finished, hzAnim.finished, txtAnim.finished]).then(() => {
        positionHeaderVideoInfo();
      });

      line.style.top = lineStartTop + 'px';
      line.style.width = widthInsetStart + 'px';
      line.classList.add('visible');
      const lineAnim = line.animate([
        { top: lineStartTop + 'px', width: widthInsetStart + 'px' },
        { top: lineEndTop + 'px', width: widthInsetEnd + 'px' }
      ], followOpts);
      lineAnim.finished.then(() => {
        lineAnim.commitStyles();
        lineAnim.cancel();
      });

      // header fill: gray backing growing downward from just inside rect's
      // top stroke, its own bottom edge always exactly where #header-line
      // currently is (0 height at the start, full header height once the
      // line settles) - rounded on its top two corners to nest inside
      // rect's own rounded corners instead of squaring them off
      fill.style.top = (rectTop + RECT_BORDER_WIDTH) + 'px';
      fill.style.height = '0px';
      fill.style.width = widthInsetStart + 'px';
      fill.style.borderRadius = fillRadius + 'px ' + fillRadius + 'px 0 0';
      fill.classList.add('visible');
      const fillAnim = fill.animate([
        { height: '0px', width: widthInsetStart + 'px' },
        { height: (lineEndTop - rectTop - RECT_BORDER_WIDTH) + 'px', width: widthInsetEnd + 'px' }
      ], followOpts);
      fillAnim.finished.then(() => {
        fillAnim.commitStyles();
        fillAnim.cancel();
      });

      // #rect2 keeps the exact same "calle" gap around the outline it
      // already had in the square instance, but from here on the header
      // eats into its own top: as header-line/header-fill grow downward,
      // rect2's own top edge follows right along - gap below the header's
      // own (also moving) bottom edge instead of gap below rect's own top
      // stroke - and its top two corners square off to match header-fill's
      // own square bottom corners. The bottom two corners, untouched by
      // the header, stay rounded exactly as before. Bottom edge itself
      // never moves (rect's own height/bottom don't move this stage
      // either), so growing downward from a fixed bottom is just: shrink
      // height, and recenter `top` (this element's own vertical anchor,
      // via translate(-50%,-50%)) so that fixed bottom edge stays put.
      const rect2 = document.getElementById('rect2');
      const rect2StartWidth = parseFloat(rect2.style.width);
      const rect2StartHeight = parseFloat(rect2.style.height);
      const rect2StartRadius = parseFloat(rect2.style.borderRadius);
      // rect2's `top` has only ever come from the #rect2 CSS rule
      // (539.5px, the shared center) - never written inline before this
      // point - so reading it via .style.top would be an empty string
      // (NaN once parsed). getComputedStyle resolves it either way.
      const rect2StartTop = parseFloat(getComputedStyle(rect2).top);
      const rect2Gap = (widths[3] - rect2StartWidth) / 2; // the calle established in the square instance - widths[3]===heights[3] there, so this is also the top/bottom gap
      const rect2TargetWidth = rect2StartWidth + (widths[4] - widths[3]);
      const rect2BottomY = rect2StartTop + rect2StartHeight / 2;
      const rect2TargetTopEdgeY = lineEndTop + rect2Gap; // same gap, now measured from the header's own finished bottom edge
      const rect2TargetHeight = rect2BottomY - rect2TargetTopEdgeY;
      const rect2TargetTop = rect2BottomY - rect2TargetHeight / 2;

      // "caja body"'s own vertical center (rect2's target top edge down to
      // the globe's north pole, halved) is what the botonera row (bars +
      // brackets, formed below via collapseCenterTagline ->
      // multiplyPlusIntoBars) centers itself on - computed here,
      // analytically, off this stage's own TARGET values rather than a
      // live measurement, since collapseCenterTagline fires synchronously
      // on its own (shorter) timeline and would otherwise read rect2/
      // rect mid-animation (the same mistake positionHeaderVideoInfo's own
      // comment describes for the triangle). heights[3] is rect's own
      // height for this whole stage (heights[4]===heights[3] - only width
      // grows), so rectTop+heights[3] is already its true final bottom.
      const globeNorthPoleY = rectTop + GLOBE_NORTH_POLE_FRACTION * heights[3];
      const bodyBoxCenterY = (rect2TargetTopEdgeY + globeNorthPoleY) / 2;

      // runs on its own timeline (center tagline, unrelated to rect's own
      // widen geometry) - see collapseCenterTagline. Portrait skips this
      // for now - the tagline hiding into the botonera's row of bars is
      // its own separate step, still being built for the vertical layout
      // (see multiplyPlusIntoBars) - so the tagline just stays put here.
      if (!isPortrait) collapseCenterTagline(bodyBoxCenterY);

      const rect2Anim = rect2.animate([
        { top: rect2StartTop + 'px', width: rect2StartWidth + 'px', height: rect2StartHeight + 'px', borderRadius: `${rect2StartRadius}px ${rect2StartRadius}px ${rect2StartRadius}px ${rect2StartRadius}px` },
        { top: rect2TargetTop + 'px', width: rect2TargetWidth + 'px', height: rect2TargetHeight + 'px', borderRadius: `0px 0px ${rect2StartRadius}px ${rect2StartRadius}px` }
      ], followOpts);
      rect2Anim.finished.then(() => {
        rect2Anim.commitStyles();
        rect2Anim.cancel();
      });

      // white "Diego Tavella" stand-in: same left-tracking as the real
      // wordmark (see txtAnim above), revealed top-down via clip-path as
      // #header-line's own live position sweeps down past the text's
      // vertical span - a rAF read of the line's actual computed top
      // (not a derived/precomputed timing) because the line's own motion
      // is independently eased (wEase[3], a cubic-bezier), so the wall-
      // clock instant it crosses textTop/textBottom isn't a fixed
      // fraction of this stage's duration
      const txtWhite = document.getElementById('logo-text-white');
      txtWhite.style.top = txt.style.top;
      txtWhite.style.width = txt.style.width;
      txtWhite.style.height = txt.style.height;
      txtWhite.style.clipPath = 'inset(0 0 100% 0)';
      txtWhite.classList.add('visible');
      const txtWhiteAnim = txtWhite.animate([
        { left: txtStartLeft + 'px' },
        { left: (txtStartLeft + dxLeft) + 'px' }
      ], followOpts);
      let revealRafId;
      function revealFollow() {
        const lineY = parseFloat(getComputedStyle(line).top);
        const revealedHeight = Math.min(textHeight, Math.max(0, lineY - textTop));
        const bottomInset = textHeight - revealedHeight;
        txtWhite.style.clipPath = `inset(0 0 ${bottomInset}px 0)`;
        revealRafId = requestAnimationFrame(revealFollow);
      }
      revealFollow();
      txtWhiteAnim.finished.then(() => {
        cancelAnimationFrame(revealRafId);
        txtWhiteAnim.commitStyles();
        txtWhiteAnim.cancel();
        txtWhite.style.clipPath = 'inset(0 0 0 0)'; // fully revealed - the line's ended up past textBottom by then
      });

      // globe video: #bg-video-mask (width/height:100%, object-fit:
      // cover - see its own CSS) is kept in sync to rect's own live box
      // by syncRectMasks, so it already tracks rect's widening width
      // automatically, with zero extra code here, clipped to rect's own
      // rounded corners via #bg-video-mask's own overflow:hidden. All
      // that's left to
      // animate by hand is the deliberate reveal: sliding down by 50% of
      // its own height (=rect's height, unchanged throughout this stage)
      // so its natural center ends up level with rect's own bottom edge
      // instead of its middle - what's left visible (rect's own clip does
      // the rest) is just the globe's upper hemisphere and half its
      // satellite's orbit.
      // portrait nudges a bit further down on top of that same 50% base
      // (own real vh, not the 1920x1080 canvas-local space everything
      // else here is measured in - divided by canvasScaleNow to convert,
      // same conversion spreadPx uses in multiplyPlusIntoBars) - a flat
      // 75% tried first pushed the whole sphere below the visible crop
      // entirely (rect1's own height is taller here - own comment above -
      // so the SAME percentage-of-own-height moves it a lot further in
      // real screen px than it does in landscape), so this is a small
      // fixed EXTRA on top of the original amount instead of a bigger
      // percentage.
      const video = document.getElementById('bg-video');
      const GLOBE_REVEAL_EXTRA_VH = 10;
      const canvasScaleNow = stageBox().scale;
      const globeExtraPx = (stageBox().realH * (GLOBE_REVEAL_EXTRA_VH / 100)) / canvasScaleNow;
      const globeRevealEnd = isPortrait ? `calc(50% + ${globeExtraPx}px)` : '50%';
      // same duration as everything else in this stage (so it still lands
      // exactly when the rest does), but its own ease-out curve instead of
      // followOpts' shared easing - starts fast and settles into place
      // rather than tracking the linear-ish pace the rest of the stage uses
      const videoRevealOpts = { duration: stageDuration, easing: 'ease-out', fill: 'forwards' };
      // portrait ("vertical version"): no rotation at all on #bg-video (see
      // showBgVideo's own comment) - this trailing rotate(30deg) term is
      // landscape-only, same reasoning as globeRevealEnd's own isPortrait
      // branch just above
      const globeRotate = isPortrait ? '' : ' rotate(30deg)';
      const videoAnim = video.animate([
        { transform: `scale(1) translateY(0%)${globeRotate}` },
        { transform: `scale(1) translateY(${globeRevealEnd})${globeRotate}` }
      ], videoRevealOpts);
      videoAnim.finished.then(() => {
        commitAndCancel(video, videoAnim);
      });

      runStage(buildStage(3, 4, widths, heights, radii));
      step = 2;
    }

    // the back-triangle's own action: undoes just the widen (step 2 ->
    // step 1), landing back on the square overshoot with the center
    // tagline exactly as it already was (untouched by advanceFromOvershoot,
    // so nothing to reverse) - only rect's own size, the blink square/
    // hover-zone's tracked position, and bg-video's/onda-video's own
    // widen-time shift+crop get undone here, mirroring advanceFromOvershoot
    // itself but in reverse. Deliberately NOT goHome(): that un-presses
    // the button back to step 0 and tears down the video/tagline too,
    // which is a lot further back than this button is for.
    function reverseFromWidened() {
      if (rectAnimating || step !== 2) return;
      // runs on its own timeline (center tagline, unrelated to rect's own
      // shrink geometry) - see restoreCenterTagline
      restoreCenterTagline();
      const el = document.getElementById('rect');
      const sq = document.getElementById('blink-square');
      const hz = document.getElementById('blink-square-hover-zone');

      const startWidth = parseFloat(el.style.width);
      const startHeight = parseFloat(el.style.height);
      const startRadius = parseFloat(el.style.borderRadius);
      // the square it widened from had this same side length - height was
      // never touched by the widen stage (see advanceFromOvershoot), so
      // it's still exactly the overshoot's own height
      const targetSide = startHeight;

      const duration = DURATION * (OFFSETS[4] - OFFSETS[3]); // same span the widen itself used
      const opts = { duration, easing: wEase[3], fill: 'forwards' };
      rectAnimating = true;
      const anim = el.animate([
        { width: startWidth + 'px', height: startHeight + 'px', borderRadius: startRadius + 'px' },
        { width: targetSide + 'px', height: targetSide + 'px', borderRadius: startRadius + 'px' }
      ], opts);

      // mirrors advanceFromOvershoot's own approach: position and the
      // turn back to pointing right both run as WAAPI animations sharing
      // this same duration/easing with the rect's own shrink above, so
      // the square is never left mid-turn or out of position relative to
      // whatever the rect is actually doing that frame. Retraces the same
      // -180deg -> 0deg path the forward turn used, i.e. clockwise -
      // undoing the counterclockwise turn, not repeating it.
      const sqStartLeft = parseFloat(sq.style.left);
      const hzStartLeft = parseFloat(hz.style.left);
      const dxFinal = (targetSide - startWidth) / 2; // shrinking now, so dxFinal is negative - tracks the right edge back inward
      sq.classList.remove('back');
      const sqAnim = sq.animate([
        { left: sqStartLeft + 'px', transform: 'scale(1.5) rotate(-180deg)' },
        { left: (sqStartLeft + dxFinal) + 'px', transform: 'scale(1.5) rotate(0deg)' }
      ], opts);
      const hzAnim = hz.animate([
        { left: hzStartLeft + 'px' },
        { left: (hzStartLeft + dxFinal) + 'px' }
      ], opts);

      // "Diego Tavella" (the wordmark only - bracket-left stays put)
      // tracks back inward with the left edge, same as
      // advanceFromOvershoot but mirrored
      const txt = document.getElementById('logo-text');
      const txtStartLeft = parseFloat(txt.style.left);
      const dxLeft = -dxFinal;
      const txtAnim = txt.animate([
        { left: txtStartLeft + 'px' },
        { left: (txtStartLeft + dxLeft) + 'px' }
      ], opts);

      // header divider retreats back up to just inside rect's own top
      // stroke (mirrors advanceFromOvershoot's same inset) and hides once
      // it gets there
      const line = document.getElementById('header-line');
      const fill = document.getElementById('header-fill');
      const rectTop = RECT_CENTER_Y - targetSide / 2; // square height throughout this stage too
      const textTop = rectTop + EDGE_MARGIN_Y;
      const textHeight = parseFloat(txt.style.height);
      const textBottom = textTop + textHeight;
      const lineCurrentTop = textBottom + EDGE_MARGIN_Y;
      const lineTargetTop = rectTop + RECT_BORDER_WIDTH;
      const widthInsetStart = startWidth - RECT_BORDER_WIDTH * 2;
      const widthInsetEnd = targetSide - RECT_BORDER_WIDTH * 2;
      const lineAnim = line.animate([
        { top: lineCurrentTop + 'px', width: widthInsetStart + 'px' },
        { top: lineTargetTop + 'px', width: widthInsetEnd + 'px' }
      ], opts);

      // header fill shrinks back to nothing, its bottom edge following
      // #header-line back up the same way it followed it down
      const fillAnim = fill.animate([
        { height: (lineCurrentTop - rectTop - RECT_BORDER_WIDTH) + 'px', width: widthInsetStart + 'px' },
        { height: '0px', width: widthInsetEnd + 'px' }
      ], opts);

      // #rect2 mirrors advanceFromOvershoot's own treatment: the header
      // shrinks back away and rect2's top edge (plus its un-rounded top
      // corners) follow it back up, ending square and fully rounded again
      // at the same gap it always had - the bottom two corners never
      // changed either direction, so bottomRadius here is just whatever
      // they already are
      const rect2 = document.getElementById('rect2');
      const rect2StartWidth = parseFloat(rect2.style.width);
      const rect2StartHeight = parseFloat(rect2.style.height);
      const rect2StartTop = parseFloat(getComputedStyle(rect2).top);
      const rect2Radius = parseFloat(getComputedStyle(rect2).borderBottomLeftRadius);
      const rect2Gap = (startWidth - rect2StartWidth) / 2;
      const rect2TargetWidth = rect2StartWidth + (targetSide - startWidth);
      const rect2BottomY = rect2StartTop + rect2StartHeight / 2;
      const rect2TargetTopEdgeY = rectTop + rect2Gap; // back to gap-below-rect's-own-top-stroke, the header having fully retracted by then
      const rect2TargetHeight = rect2BottomY - rect2TargetTopEdgeY;
      const rect2TargetTop = rect2BottomY - rect2TargetHeight / 2;
      const rect2Anim = rect2.animate([
        { top: rect2StartTop + 'px', width: rect2StartWidth + 'px', height: rect2StartHeight + 'px', borderRadius: `0px 0px ${rect2Radius}px ${rect2Radius}px` },
        { top: rect2TargetTop + 'px', width: rect2TargetWidth + 'px', height: rect2TargetHeight + 'px', borderRadius: `${rect2Radius}px ${rect2Radius}px ${rect2Radius}px ${rect2Radius}px` }
      ], opts);

      // white "Diego Tavella" un-reveals bottom-up as the line retreats
      // back past it - same live rAF read of the line's actual position
      // advanceFromOvershoot uses, for the same reason (independently
      // eased motion)
      const txtWhite = document.getElementById('logo-text-white');
      const txtWhiteAnim = txtWhite.animate([
        { left: txtStartLeft + 'px' },
        { left: (txtStartLeft + dxLeft) + 'px' }
      ], opts);
      let revealRafId;
      function revealFollow() {
        const lineY = parseFloat(getComputedStyle(line).top);
        const revealedHeight = Math.min(textHeight, Math.max(0, lineY - textTop));
        const bottomInset = textHeight - revealedHeight;
        txtWhite.style.clipPath = `inset(0 0 ${bottomInset}px 0)`;
        revealRafId = requestAnimationFrame(revealFollow);
      }
      revealFollow();

      // globe video slides back up to centered, mirroring
      // advanceFromOvershoot - width/rounding still track rect
      // automatically (see its own CSS), only the reveal shift reverses.
      // portrait ("vertical version"): no rotation at all on #bg-video
      // (see showBgVideo's own comment) - mirrors advanceFromOvershoot's
      // own globeRotate branch.
      const video = document.getElementById('bg-video');
      const globeRotate = isPortraitViewport() ? '' : ' rotate(30deg)';
      const videoAnim = video.animate([
        { transform: `scale(1) translateY(50%)${globeRotate}` },
        { transform: `scale(1) translateY(0%)${globeRotate}` }
      ], opts);

      Promise.allSettled([anim.finished, sqAnim.finished, hzAnim.finished, txtAnim.finished, lineAnim.finished, fillAnim.finished, txtWhiteAnim.finished, videoAnim.finished, rect2Anim.finished]).then(() => {
        cancelAnimationFrame(revealRafId);
        [anim, sqAnim, hzAnim, txtAnim, lineAnim, fillAnim, txtWhiteAnim, rect2Anim].forEach((a) => { a.commitStyles(); a.cancel(); });
        // #bg-video shares a `transform 0.75s ease` transition with its own
        // .visible class toggle (see #bg-video) for an unrelated, earlier
        // reveal - commitAndCancel keeps that transition from spuriously
        // replaying over this animation's own final value
        commitAndCancel(video, videoAnim);
        sq.style.transform = ''; // hand off to plain .triangle (pointing right) - same final value
        line.classList.remove('visible');
        fill.classList.remove('visible');
        txtWhite.classList.remove('visible');
        txtWhite.style.clipPath = 'inset(0 0 100% 0)'; // fully hidden again - the line's ended up back at rectTop by then
        // "Contact" reappears - txt/sq's left/top have already landed back
        // on the exact values contactBtn's own (stale since advanceFromOvershoot
        // hid it) left/top were computed from, so no repositioning is needed
        document.getElementById('contact-button').classList.add('visible');
        rectAnimating = false;
        step = 1;
      });
    }
    document.getElementById('blink-square-hover-zone').addEventListener('click', () => {
      if (step === 1) advanceFromOvershoot();
      else if (step === 2) reverseFromWidened();
    });
    // hovering the second-click hit zone morphs the red square into a
    // right-pointing triangle 50% bigger - see #blink-square.triangle.
    // Step-gated: once step 2's back button (.back) is showing, hovering
    // must not touch its classes or it'd un-rotate back to the plain
    // right-pointing preview. The hover-zone itself is only display:block
    // (and thus only able to receive these events at all) while the blink
    // square is actually shown, so no separate visibility check is needed.
    document.getElementById('blink-square-hover-zone').addEventListener('mouseenter', () => {
      if (step !== 1) return;
      document.getElementById('blink-square').classList.add('triangle');
      const ondaVideo = document.getElementById('onda-video');
      ondaVideo.currentTime = 0;
      ondaVideo.play();
      ondaVideo.classList.add('visible');

    document.getElementById('blink-square-hover-zone').addEventListener('mouseleave', () => {

    // only) - a swipe up does the same job instead, navigating straight
    // to menu-portrait.html. No in-page "+"-to-bars build animation to
    // write here (that's multiplyPlusIntoBars' job for landscape, step
    // 1->2 in place) - the cross-document View Transition API handles
    // visual continuity across the navigation on its own (a PUSH here,
    // not the plain single-frame swap the Contact/Home flow uses - see
    // the html.push-up-transition-scoped CSS above).
    const SWIPE_UP_THRESHOLD_PX = 60;

    // just sourced from mousedown/mouseup's clientY instead of a Touch
    // object's.
    let mouseSwipeStartY = null;

    document.getElementById('rect').addEventListener('click', onRectClick);

    // pressed look - fill white, stroke black, logo black - reverting if
    // the mouse leaves without a click. Driven from JS rather than CSS
    // :hover since it has to touch the logo sprites too, not just #rect.
    function setButtonHover(hovering) {
      if (!passwordUnlocked || !rectInteractionReady || step !== 0) return;
      const rectEl = document.getElementById('rect');
      const logoInk = [document.getElementById('bracket-left'), document.getElementById('bracket-right'), document.getElementById('logo-text')];
      const rect2 = document.getElementById('rect2');
      if (hovering) {
        // was '#fff' - now transparent too (same reasoning as
        // press.finished's own switch), so #rect2 shows through the
        // hover preview's own interior too, not just its 4px overhang
        rectEl.style.background = 'transparent';
        rectEl.style.borderColor = IDLE_BLACK; // 80% black here too - stays this way until an actual click starts the borderDarken animation (see press.finished)
        logoInk.forEach((e) => { e.style.filter = 'none'; });

        // button) edges on every side. Fixed from this point on: nothing
        // later resizes it, so as rect presses down and then grows all the
        // way to the overshoot square, rect's own size overtakes rect2's
        // fixed one along the way, flipping it from sticking out around
        // rect to sitting inset within it. Radius grows by a smaller,
        // separate amount (not the same 8px as the width/height overhang) -
        // a true concentric +8 makes the corner balloon from 3px to 11px,
        // way rounder than the logo's own tight corner and reading as a
        // different shape rather than a frame around it. +4 keeps the
        // curve close to the logo's own, at the cost of the gap being a
        // little narrower on the curves than along the straight sides.
        const RECT2_HOVER_OVERHANG = 8;
        const RECT2_HOVER_RADIUS_OVERHANG = 4;
        const rectW = parseFloat(getComputedStyle(rectEl).width);
        const rectH = parseFloat(getComputedStyle(rectEl).height);
        const rectRadius = parseFloat(getComputedStyle(rectEl).borderRadius);
        rect2.style.width = (rectW + RECT2_HOVER_OVERHANG * 2) + 'px';
        rect2.style.height = (rectH + RECT2_HOVER_OVERHANG * 2) + 'px';

        rect2.classList.add('visible');

    // rather than duplicating the button's own logic on this element too

    // top-left, both unscaled (confirmed off the real 25-frame render,
