    // three fixed size instances instead of a pure vh/vw scale that grew
    // (or shrank/cropped) without any limit - standard, "universal"
    // breakpoints (768/1024, same ones Bootstrap/Tailwind use for
    // mobile/tablet/desktop) rather than anything specific to this site:
    //   - computer (>1024px wide): capped well below "fills a 4K
    //     monitor" territory
    //   - tablet horizontal (768-1024px wide): a modest, fixed-feeling
    //     size in between
    //   - vertical (<768px wide - phones, and tablets held upright):
    //     width-driven instead of height-driven, since a narrow viewport
    //     runs out of WIDTH long before it runs out of height - the old
    //     height-first formula kept demanding a wide player and only
    //     caught the overflow after the fact, which is what read as
    //     "se cropea"
    // Each tier is still a min/max BOX (maxW x maxH), not one single
    // hardcoded pixel size - openVideo below still fits the video's own
    // aspect ratio inside whichever box applies, so it isn't a step
    // function at the exact breakpoint edges within a tier's own range.
    function playerBounds() {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      if (vw < 768) {
        return { maxW: vw * 0.92, maxH: vh * 0.8 };
      }
      if (vw <= 1024) {
        return { maxW: Math.min(vw * 0.9, 900), maxH: Math.min(vh * 0.85, 640) };
      }
      return { maxW: Math.min(vw * 0.95, 1400), maxH: Math.min(vh * 0.9, 900) };
    }

    // sizes .player to fit within playerBounds() (fit-by-height first,
    // capped by width, same shape as marco.html's own expand step) -
    // cropped to frameH for videos with baked-in letterboxing. .video-
    // overlay is already a fixed, viewport-filling flexbox that centers
    // .player on its own, so there's no gridBounds/left/top math to redo
    // here, just width/height
    function openVideo(index, sourceEl) {
      const entry = BOTONERA_VIDEOS[index];
      if (!entry) return;
      const aspect = entry.aspect === 'square' ? 1 : 16 / 9;
      const bounds = playerBounds();
      let videoH = bounds.maxH;
      let w = videoH * aspect;
      if (w > bounds.maxW) {
        w = bounds.maxW;
        videoH = w / aspect;
      }
      const frameFraction = entry.frameH || 1;
      const cropTop = entry.cropTop || 0;
      const cropBottom = entry.cropBottom || 0;
      const frameH = videoH * frameFraction - cropTop - cropBottom;
      videoPlayer.style.width = w + 'px';
      videoPlayer.style.height = frameH + 'px';
      if (frameFraction !== 1) {
        botoneraVideo.style.position = 'absolute';
        botoneraVideo.style.left = '0';
        botoneraVideo.style.height = videoH + 'px';
        botoneraVideo.style.top = ((frameH - videoH) / 2) + 'px';
        botoneraVideo.style.objectFit = '';
      } else {
        botoneraVideo.style.position = '';
        botoneraVideo.style.left = '';
        botoneraVideo.style.height = '100%';
        botoneraVideo.style.top = '';
        // frame's own top/bottom edges moved in by cropTop/cropBottom
        // (anchored on center, same as the frameFraction branch above)
        // while the video keeps its normal box - object-fit:cover just
        // fills that now-shorter box instead of letterboxing it, which
        // is what turns the height cut into a crop with no black bars
        botoneraVideo.style.objectFit = (cropTop || cropBottom) ? 'cover' : '';
      }
      if (botoneraVideo.getAttribute('src') !== entry.src) botoneraVideo.setAttribute('src', entry.src);
      botoneraVideo.currentTime = entry.startAt || 0;
      botoneraVideo.muted = false;
      vcSeeking = false;
      vcSeek.value = 0;
      vcVolume.value = botoneraVideo.volume;

      // "grows" out of the clicked botonera chip instead of just fading in
      // centered - a FLIP: the overlay/player are already in the layout
      // at this point (opacity:0, not display:none), so their real final
      // rect can be read right now, before .visible even gets added.
      // Animate a transform that starts by exactly overlapping the
      // chip's own on-screen box down to identity, so the player visibly
      // expands from wherever it was clicked rather than from its own
      // center. Own WAAPI animation, not the CSS `transition: transform`
      // below (that one's still what handles the CLOSE shrink-back) -
      // switched off for the duration of this animation so the two don't
      // fight over the same property.
      const startRect = sourceEl ? sourceEl.getBoundingClientRect() : null;
      videoPlayer.style.transition = 'none';
      videoOverlay.classList.add('visible');
      document.querySelector('.viewport').classList.toggle('receded', !!entry.recede);
      if (startRect && startRect.width && startRect.height) {
        const endRect = videoPlayer.getBoundingClientRect();
        const scaleX = startRect.width / endRect.width;
        const scaleY = startRect.height / endRect.height;
        const dx = (startRect.left + startRect.width / 2) - (endRect.left + endRect.width / 2);
        const dy = (startRect.top + startRect.height / 2) - (endRect.top + endRect.height / 2);
        const flipAnim = videoPlayer.animate([
          { transform: `translate(${dx}px, ${dy}px) scale(${scaleX}, ${scaleY})`, opacity: 0.5 },
          { transform: 'translate(0, 0) scale(1)', opacity: 1 }
        ], { duration: 380, easing: 'cubic-bezier(.2,.8,.2,1)' });
        flipAnim.finished.then(() => flipAnim.cancel(), () => {}).then(() => {
          videoPlayer.style.transition = '';
        });
      } else {
        videoPlayer.style.transition = '';
      }

      botoneraVideo.play().catch(() => {});
      wakeVideoControls();
    }

    function closeVideo() {
      videoOverlay.classList.remove('visible');
      document.querySelector('.viewport').classList.remove('receded');
      botoneraVideo.pause();
      clearTimeout(vcIdleTimer);
      videoControls.classList.remove('idle');

    videoOverlay.addEventListener('click', closeVideo);

    // "Contact"/"Home" transition: clicking "Contact" doesn't just link
    // out - #rect2 (celeste) slides down and out while #rect2-black
    // (identically sized/positioned, see its own CSS comment) slides down
    // into its place from just above; at the same time bg-video (the
    // globe) slides right until it disappears behind #rect's own edge
    // (already clipped there by #bg-video-mask's own overflow:hidden -
    // this only has to move it, not mask it), and #logo-text ("Diego
    // Tavella") slides
    // out the same way, fading as it goes, clipped to #rect's own live
    // box by #logo-text-mask (see its own CSS comment) the same way
    // #rect2-mask clips #rect2/#rect2-black below - it's a sibling of
    // #rect, not a child, so nothing clips it on its own otherwise. By
    // the time all four finish, the page is
    // already sitting on exactly contact.html's own look (black #rect2,
    // no globe, no wordmark, same blink square/"Contact"->"Home" label)
    // - so the actual navigation lands on what looks like the same frame,
    // no visible cut. contact.html's "Home" link then reverses this: it
    // lands back here (skipping the password gate - see enterFromContact)
    // already showing that same black-#rect2/no-globe/no-wordmark look,
    // then immediately plays this exact transition backwards to arrive
    // at the page's actual resting state.
    const CONTACT_TRANSITION_MS = 690; // 600 * 1.15 - 15% slower
    let contactTransitioning = false;

    function playContactTransition(reverse) {
      const rect2 = document.getElementById('rect2');
      const rect2Black = document.getElementById('rect2-black');
      const video = document.getElementById('bg-video');
      const txt = document.getElementById('logo-text');
      const opts = { duration: CONTACT_TRANSITION_MS, easing: 'ease-in', fill: 'forwards' };

      // masks #rect2/#rect2-black to #rect's own current box for the
      // duration of this transition (see #rect2-mask's own CSS comment) -
      // both slide by a full rect2-height (well past #rect's own edge,
      // see slideDistance below), which without this would fly them
      // several screen-heights past #rect and get cut off raggedly by the
      // browser window's own edge instead of disappearing cleanly right
      // at #rect's - the same "vanishes exactly at rect's edge" look
      // #bg-video-mask's own overflow:hidden already gives bg-video for
      // free (kept in sync to #rect's own box continuously - see
      // syncRectMasks - so this transition doesn't need to touch it)
      const rectEl = document.getElementById('rect');
      const rectCs = getComputedStyle(rectEl);
      const rectW = parseFloat(rectCs.width);
      const rectH = parseFloat(rectCs.height);
      const rectRadius = parseFloat(rectCs.borderRadius);
      const rectLeftPx = RECT_CENTER_X - rectW / 2;
      const rectTopPx = RECT_CENTER_Y - rectH / 2;
      const rectClipPath = `inset(${rectTopPx}px ${1920 - rectLeftPx - rectW}px ${1080 - rectTopPx - rectH}px ${rectLeftPx}px round ${rectRadius}px)`;
      const rect2Mask = document.getElementById('rect2-mask');
      const logoTextMask = document.getElementById('logo-text-mask');
      rect2Mask.style.clipPath = rectClipPath;
      logoTextMask.style.clipPath = rectClipPath;

      // "reverse" plays each element's own forward array backwards (time-
      // reversal), not a fresh animation with the two elements' roles
      // swapped - #rect2 (celeste) always retraces its own down-and-out
      // path (so reverse has it re-entering from BELOW, sliding up), and
      // #rect2-black always retraces its own down-into-place path (so
      // reverse has it exiting back UPWARD, the way it arrived)
      const shownEl = reverse ? rect2 : rect2Black;
      const hiddenEl = reverse ? rect2Black : rect2;
      const cs = getComputedStyle(hiddenEl);
      shownEl.style.width = cs.width;
      shownEl.style.height = cs.height;
      shownEl.style.borderRadius = cs.borderRadius;
      // #rect-frame's own hole stays put at rect2's resting box the whole
      // time - it's meant to keep masking whatever's outside it even
      // while rect2/rect2-black slide past each other underneath, not
      // grow to let them travel unmasked (see syncRectMasks, which
      // keeps applying this same box every frame, transition or not -
      // only `transform` is animated below, so this box never actually
      // changes mid-slide)
      const rect2Side = parseFloat(cs.height); // ===cs.width - square at this step
      // the same "calle" gap #rect2/#rect2-black already keep around their
      // own outline in the square instance (rectW/rect2Side both centered
      // on the same point, so half the difference is the uniform margin
      // all around) - since both elements always move by the exact same
      // translateY at the exact same instant, traveling rect2Side+calle
      // instead of just rect2Side keeps this same gap between them for the
      // WHOLE slide instead of landing them flush/overlapping
      const calle = (rectW - rect2Side) / 2;
      const slideDistance = rect2Side + calle;
      shownEl.classList.add('visible');

      const rect2Forward = [
        { transform: 'translate(-50%, -50%) translateY(0px)' },
        { transform: `translate(-50%, -50%) translateY(${slideDistance}px)` }
      ];
      const rect2BlackForward = [
        { transform: `translate(-50%, -50%) translateY(${-slideDistance}px)` },
        { transform: 'translate(-50%, -50%) translateY(0px)' }
      ];
      const rect2Anim = rect2.animate(reverse ? rect2Forward.slice().reverse() : rect2Forward, opts);
      const rect2BlackAnim = rect2Black.animate(reverse ? rect2BlackForward.slice().reverse() : rect2BlackForward, opts);

      // portrait ("vertical version"): no rotation at all on #bg-video
      // (see showBgVideo's own comment) - mirrors advanceFromOvershoot's
      // own globeRotate branch.
      const globeRotate = isPortraitViewport() ? '' : ' rotate(30deg)';
      const videoForward = [
        { transform: `scale(1) translateX(0%)${globeRotate}` },
        { transform: `scale(1) translateX(120%)${globeRotate}` }
      ];
      if (reverse) showBgVideo(); // (re)starts playback - the animation below drives its actual transform
      const videoAnim = video.animate(reverse ? videoForward.slice().reverse() : videoForward, opts);

      const txtForward = [
        { transform: 'scale(1) translateX(0px)', opacity: GRAY_OPACITY },
        { transform: 'scale(1) translateX(-400px)', opacity: 0 }
      ];
      const txtAnim = txt.animate(reverse ? txtForward.slice().reverse() : txtForward, opts);

      return Promise.allSettled([rect2Anim.finished, rect2BlackAnim.finished, videoAnim.finished, txtAnim.finished]).then(() => {
        [rect2Anim, rect2BlackAnim].forEach((a) => { a.commitStyles(); a.cancel(); });
        // video/txt (unlike rect2/rect2-black) share a CSS `transition` on
        // this same `transform` property with other code elsewhere (bg-
        // video's own .visible toggle, #logo-text's own hover/press
        // treatment) - commitAndCancel avoids the Firefox stutter a plain
        // commitStyles+cancel can trigger there (see its own comment)
        commitAndCancel(video, videoAnim);
        commitAndCancel(txt, txtAnim);
        rect2Mask.style.clipPath = '';
        logoTextMask.style.clipPath = '';
        // rectFrame's box-shadow stays ON - it's meant to be a permanent
        // occlusion now, kept in sync continuously by syncRectMasks
        // (see below), not something this one transition turns off again
        (reverse ? rect2Black : rect2).classList.remove('visible');
        if (!reverse) {
          // "Video Editor"/"motion graphics"/"+" disappear POR CORTE now
          // that rect2-black has fully covered them - contact.html has no
          // center tagline of its own, so nothing should still read
          // on-screen in the moment before the actual navigation
          const plus = document.getElementById('tagline-plus');
          const prevPlusTransition = plus.style.transition;
          plus.style.transition = 'none';
          plus.classList.remove('visible');
          document.getElementById('tagline-left').classList.remove('visible');
          document.getElementById('tagline-right').classList.remove('visible');
          void plus.offsetHeight;
          plus.style.transition = prevPlusTransition;
        }
      });
    }

    // globe + "Diego Tavella" entrance on arrival from contact.html - the
    // exact reverse of their own exit in playContactTransition's txtForward/
    // videoForward, just split out on its own since #rect2 (celeste) and
    // the tagline no longer need any animating here (see enterFromContact -
    // #rect2 arrives already settled from contact.html's own swap, and the
    // tagline lands POR CORTE via playCenterTagline(true)).
    function playArrivalReveal() {
      const video = document.getElementById('bg-video');
      const txt = document.getElementById('logo-text');
      const opts = { duration: CONTACT_TRANSITION_MS, easing: 'ease-in', fill: 'forwards' };

      // "Diego Tavella" starts at translateX(-400px) - well past #rect's
      // own left edge - so it needs the same #logo-text-mask treatment
      // playContactTransition gives it on the way out, or it'd cross the
      // white background in plain view instead of only appearing once it
      // reaches #rect's own silhouette. bg-video doesn't need this - it's
      // already clipped for free by #bg-video-mask's own overflow:hidden.
      const rectEl = document.getElementById('rect');
      const rectCs = getComputedStyle(rectEl);
      const rectW = parseFloat(rectCs.width);
      const rectH = parseFloat(rectCs.height);
      const rectRadius = parseFloat(rectCs.borderRadius);
      const rectLeftPx = RECT_CENTER_X - rectW / 2;
      const rectTopPx = RECT_CENTER_Y - rectH / 2;
      const logoTextMask = document.getElementById('logo-text-mask');
      logoTextMask.style.clipPath = `inset(${rectTopPx}px ${1920 - rectLeftPx - rectW}px ${1080 - rectTopPx - rectH}px ${rectLeftPx}px round ${rectRadius}px)`;

      const txtAnim = txt.animate([
        { transform: 'scale(1) translateX(-400px)', opacity: 0 },
        { transform: 'scale(1) translateX(0px)', opacity: GRAY_OPACITY }
      ], opts);
      txtAnim.finished.then(() => {
        // same reasoning as playContactTransition's own commitAndCancel use
        // - shares a CSS transition on this same `transform` property
        commitAndCancel(txt, txtAnim);
        logoTextMask.style.clipPath = '';
      });

      // #bg-video's own reveal (and the loadHeavyVideos() fetch/decode it
      // needs first - see that function's own comment) waits for the
      // `pagereveal` event instead of starting here alongside the text:
      // it's already sitting at its own collapsed scale(0) look (set
      // synchronously in enterFromContact, inline - beats
      // #bg-video.visible's own CSS transition outright, so there's
      // nothing to animate while it waits), so this defer is invisible on
      // its own. pagereveal fires for every navigation, so this still
      // runs immediately wherever there's no cross-document view
      // transition to wait for (plain loads, or browsers without one at
      // all).
      let videoRevealed = false; // guards against pagereveal AND the safety-net timeout below both firing
      function revealVideo() {
        if (videoRevealed) return;
        videoRevealed = true;
        loadHeavyVideos();
        // portrait ("vertical version"): showBgVideo() above already lands
        // #bg-video at its correct final look (POR CORTE, scale(1), no
        // rotation - see that function) - no separate WAAPI animation on
        // top of it here, unlike landscape below, which still needs its
        // own scale(0)->scale(1) rotate(30deg) grow (showBgVideo()'s own
        // instant .visible swap would otherwise pop straight to the end
        // state instead of animating).
        if (isPortraitViewport()) {
          showBgVideo();
          return;
        }
        showBgVideo(); // (re)starts playback - the animation below drives its actual transform
        // born from its own center, scale(0) -> scale(1), no translateX -
        // unlike playContactTransition's own exit slide (leaving index for
        // contact), which this doesn't touch
        const videoAnim = video.animate([
          { transform: 'scale(0) rotate(30deg)' },
          { transform: 'scale(1) rotate(30deg)' }
        ], opts);
        videoAnim.finished.then(() => commitAndCancel(video, videoAnim));
      }
      if ('onpagereveal' in window) {
        window.addEventListener('pagereveal', (e) => {
          if (e.viewTransition) e.viewTransition.ready.then(revealVideo, revealVideo);
          else revealVideo();
        }, { once: true });
        // safety net: if pagereveal never fires for some reason, don't
        // leave the globe hidden forever
        setTimeout(revealVideo, 1500);
      } else {
        revealVideo();
      }
    }

    document.getElementById('contact-button').addEventListener('click', (e) => {
      e.preventDefault();
      if (contactTransitioning || step !== 1) return;
      contactTransitioning = true;
      playContactTransition(false).then(() => {
        // #rect2-black is the one actually left visible now, matching
        // contact.html's own (always-black) #rect2 - #rect2 (celeste) may
        // still be holding this name from a previous arrival (see
        // enterFromContact/playHomeTransition), and two elements can't
        // carry the same view-transition-name at once
        document.getElementById('rect2').style.viewTransitionName = 'none';
        document.getElementById('rect2-black').style.viewTransitionName = 'byn-rect2';
        window.location.href = 'contact.html';
      });
    });

    // arriving via contact.html's "Home" link: jumps straight to this same
    // square-instance hold - skipping the password gate and the whole
    // press/grow intro entirely, NOT resetting to it - and lands DIRECTLY
    // on the page's actual resting state (celeste #rect2, the globe,
    // "Diego Tavella"), no animation at all. The black->celeste swap
    // itself now plays out on contact.html's own "Home" click (see
    // playHomeTransition there) while that page is already fully loaded/
    // interactive, instead of replaying it here on this page's very
    // first paint - which is what used to make #rect2-black's own exit
    // look wrong (a WAAPI animation started that early doesn't reliably
    // run to completion). By the time this function runs, contact.html
    // has already done the only animating there is to do.
    // portrait shows bracket-left/right-tall (fixed at scale(1), fully
    // opaque) instead of the plain originals (kept invisible, opacity:0) -
    // the same swap syncLogoToRect's own crossfade settles into by the
    // end of its growth in the forward flow, just set directly here
    // since this is an arrival, not something that needs to animate.
    // Landscape never touches the tall pair at all - they default to
    // opacity:0 in their own CSS. Called from enterFromContact.
    function resetArrivalBrackets(isPortrait, bracketEndX0, brLeft, bl, br) {
      if (isPortrait) {
        bl.style.opacity = '0';
        br.style.opacity = '0';
        const blTall = document.getElementById('bracket-left-tall');
        const brTall = document.getElementById('bracket-right-tall');
        blTall.style.left = (bracketEndX0 - 4) + 'px';
        brTall.style.left = brLeft + 'px';
        blTall.style.transform = 'scale(1)';
        brTall.style.transform = 'scale(1)';
        blTall.style.opacity = '1';
        brTall.style.opacity = '1';
        blTall.style.filter = 'none';
        brTall.style.filter = 'none';
      } else {
        bl.style.left = (bracketEndX0 - 4) + 'px';
        br.style.left = brLeft + 'px';
        bl.style.transform = 'scale(1)';
        br.style.transform = 'scale(1)';
        bl.style.filter = 'none';
        br.style.filter = 'none';
      }
    }

    function enterFromContact() {
      passwordUnlocked = true;
      rectInteractionReady = true;
      passwordInput.blur();
      passwordInput.disabled = true;
      document.getElementById('password-gate').style.display = 'none';
      document.getElementById('text-diego-half').style.display = 'none';
      document.getElementById('text-tavella-half').style.display = 'none';
      // portrait ("vertical version") only: --logo-scale starts at
      // LOGO_PORTRAIT_SCALE (2.5, set in the early <script> before <body>)
      // and normally only ever comes back down to 1 as a side effect of
      // the real click-driven growth path (onRectClick's press.finished ->
      // bakePortraitPressScale bakes the multiplier into #rect/#rect2's
      // own width/height directly, then hands #rect a plain scale-less
      // literal transform - see that function). This arrival skips that
      // whole path entirely, so without resetting it here too, every
      // element below still styled via CSS's own `scale(var(--logo-scale))`
      // (#rect/#rect2/#rect-hover-zone/#rect-frame/the brackets/logo-text -
      // see the stylesheet) renders 2.5x too big, growing around its own
      // center - the width/height set explicitly just below are already
      // the correct FINAL size on their own, so this second multiplier is
      // pure double-counting. Confirmed on-device: #rect ballooned to
      // ~2.5x real size, its border pushed off past the actual viewport
      // edges while the fill (no size dependency) still read as plain
      // celeste with no visible outline - exactly what "no tiene el
      // outline" turned out to be. Landscape's own --logo-scale is
      // already 1 always, so this was always a latent gap here - nothing
      // ever exercised enterFromContact() in portrait until the
      // swipe-down flow (see menu-portrait.html) started reaching it.
      if (isPortraitViewport()) {
        document.documentElement.style.setProperty('--logo-scale', '1');
        document.documentElement.style.setProperty('--password-scale', '1');
      }

      const { widths, heights, radii } = overshootValues();
      const width = widths[3];
      const height = heights[3]; // ===width outside portrait - see overshootValues()
      const rectEl = document.getElementById('rect');
      // .rect's own CSS declares `transition: background-color 0.2s ease,
      // border-color 0.2s ease` (for the ordinary hover/press interactions
      // once the page is actually running) - without disabling it here,
      // this arrival's border-color jump from whatever the cold-start
      // default is to #000 plays THAT transition instead of landing
      // instantly, fading the border in over 0.2s exactly when contact.html
      // was already showing it solid - this is what read as the outline
      // "fundiendo"/cutting oddly right at the navigation seam. Disabled
      // for just this synchronous batch of instant assignments, then
      // restored (via a forced reflow in between) so the CSS transition
      // is back for any later real interaction on this same element.
      rectEl.style.transition = 'none';
      rectEl.style.width = width + 'px';
      rectEl.style.height = height + 'px';
      rectEl.style.borderRadius = radii[3] + 'px';
      rectEl.style.background = 'transparent';
      rectEl.style.borderColor = '#000';
      rectEl.style.borderWidth = (isPortraitViewport() ? RECT_BORDER_WIDTH_PORTRAIT : 2) + 'px';
      rectEl.offsetHeight; // force the above to paint with transitions off before re-enabling them below
      rectEl.style.transition = '';

      const overshootLeft = RECT_CENTER_X - width / 2;
      const overshootTop = RECT_CENTER_Y - height / 2;
      const rectBottom = RECT_CENTER_Y + height / 2;
      const bracketEndX0 = overshootLeft + EDGE_MARGIN_X;
      const brLeft = 1920 - bracketEndX0 - BRACKET_RIGHT_WIDTH;

      const bl = document.getElementById('bracket-left');
      const br = document.getElementById('bracket-right');
      bl.classList.remove('bracket-offstage');
      br.classList.remove('bracket-offstage');
      // tall pair only in portrait - see syncLogoToRect's own comment on
      // why it never replaces the originals in landscape.
      const isPortrait = isPortraitViewport();
      resetArrivalBrackets(isPortrait, bracketEndX0, brLeft, bl, br);

      // "Diego Tavella" starts at its exit look (see txtForward's own end
      // keyframe in playContactTransition) - playArrivalReveal below
      // animates it in from here, same as it always used to slide out
      // going the other way
      const txt = document.getElementById('logo-text');
      txt.classList.add('revealed');
      txt.style.left = bracketEndX0 + 'px';
      txt.style.top = (overshootTop + EDGE_MARGIN_Y - 4) + 'px';
      txt.style.width = (TEXT_BASE_WIDTH * TEXT_END_SCALE) + 'px';
      txt.style.height = (TEXT_BASE_HEIGHT * TEXT_END_SCALE) + 'px';
      txt.style.filter = 'none';
      txt.style.transform = 'scale(1) translateX(-400px)';
      txt.style.opacity = '0';

      // #rect2 (celeste) at its own resting size/position - #rect2-black
      // is left untouched (default, not .visible): the swap that used to
      // happen here on arrival now happens on contact.html instead, so
      // this page only ever needs to show the already-settled celeste look.
      // byn-rect2 is now #rect2's own CSS default (not #rect2-black's) for
      // exactly this reason - relying on this assignment running early
      // enough to beat index.html's first paint used to be the cause of a
      // black flash on arrival (the browser would briefly try to continue
      // INTO #rect2-black - hidden, no box - instead of the celeste rect
      // actually on screen). These two lines are now just a redundant
      // safety net matching what the CSS already guarantees.
      const rect2 = document.getElementById('rect2');
      document.getElementById('rect2-black').style.viewTransitionName = 'none';
      rect2.style.viewTransitionName = 'byn-rect2';
      const RECT2_SCALE = 0.97; // matches press.finished's own value
      // one shared margin applied to both axes, not each keeping its own
      // 3% - see press.finished's own matching comment for why
      const rect2Margin = (width * (1 - RECT2_SCALE)) / 2;
      const rect2Width = width - rect2Margin * 2;
      const rect2Height = height - rect2Margin * 2;
      const rect2Radius = Math.max(0, radii[3] - rect2Margin);
      rect2.style.width = rect2Width + 'px';
      rect2.style.height = rect2Height + 'px';
      rect2.style.borderRadius = rect2Radius + 'px';
      rect2.style.transform = 'translate(-50%, -50%) translateY(0px)';
      rect2.classList.add('visible');
      // seeded synchronously here too (see playContactTransition's own
      // comment on why) - syncRectMasks takes over from the next
      // animation frame on
      const rectFrame = document.getElementById('rect-frame');
      rectFrame.style.width = rect2Width + 'px';
      rectFrame.style.height = rect2Height + 'px';
      rectFrame.style.borderRadius = rect2Radius + 'px';
      rectFrame.style.boxShadow = '0 0 0 3000px #fff';

      const sqTop = rectBottom - EDGE_MARGIN_Y - BRACKET_WIDTH;
      const sq = document.getElementById('blink-square');
      const hz = document.getElementById('blink-square-hover-zone');
      sq.classList.remove('triangle', 'back');
      sq.style.width = BRACKET_WIDTH + 'px';
      sq.style.height = BRACKET_WIDTH + 'px';
      sq.style.left = brLeft + 'px';
      sq.style.top = sqTop + 'px';
      sq.classList.add('visible');
      hz.style.width = (BRACKET_WIDTH + BLINK_HIT_PADDING * 2) + 'px';
      hz.style.height = (BRACKET_WIDTH + BLINK_HIT_PADDING * 2) + 'px';
      hz.style.left = (brLeft - BLINK_HIT_PADDING) + 'px';
      hz.style.top = (sqTop - BLINK_HIT_PADDING) + 'px';
      hz.classList.add('visible');

      const contactBtn = document.getElementById('contact-button');
      contactBtn.style.left = bracketEndX0 + 'px';
      contactBtn.style.top = (sqTop + BRACKET_WIDTH / 2) + 'px';
      contactBtn.classList.add('visible');

      // globe starts collapsed at its own center - born from there via
      // playArrivalReveal below (scale(0) -> scale(1), called once
      // everything else here is set), not sliding in from off-screen
      const video = document.getElementById('bg-video');
      video.classList.add('visible');
      video.style.transform = 'scale(0) rotate(30deg)';

      // "Video Editor"/"motion graphics" land at their own resting look
      // POR CORTE (see playCenterTagline's own instant-mode comment) -
      // #rect2 is already settled too (see above), so only the globe and
      // "Diego Tavella" actually have anything left to animate in
      playCenterTagline(true);
      playArrivalReveal();

      step = 1;
    }

    // #from-menu-portrait: menu-portrait.html's own swipe-down "back" -
    // lands on the exact same settled step-1 state #from-contact does
    // (enterFromContact already does everything this needs: skip the
    // password gate/intro, arrive built - "no vuelve al logo"), just via
    // a different visual transition (push down instead of Contact's
    // plain continuous-element swap - see the html.push-down-transition
    // CSS above and the early <script>'s own comment on why the class
    // for it gets set before this point ever runs).
    if (location.hash === '#from-contact' || location.hash === '#from-menu-portrait') {
      history.replaceState(null, '', location.pathname + location.search);
      enterFromContact();
    }

    // keeps #rect-frame's own "paint white everywhere outside this box"
    // occlusion (see its own CSS comment) matched to whichever of #rect2/
    // #rect2-black is actually visible right now, on every single frame -
    // not just at the handful of spots (playContactTransition,
    // enterFromContact) that already seed it synchronously for the exact
    // instant a document boundary is crossed. rect2's own box changes in
    // plenty of OTHER places too (hover preview, the grow-to-overshoot
    // animation, the widened/later-step instance) and this is what keeps
    // the white "calle" around it honest in all of those too, instead of
    // only right at the two navigation seams. ALSO keeps #bg-video-mask
    // matched to #rect's own live box, for the same reason - bg-video
    // used to get this for free as #rect's own child (see #bg-video-
    // mask's own CSS comment for why it isn't anymore) - #rect's box
    // changes constantly across the intro's WAAPI-driven grow animation,
    // hover preview, widen/reverse, so a few fixed checkpoints wouldn't
    // be enough here the way they mostly are for rect2. Runs forever once
    // started; a getComputedStyle + a few style writes per frame is
    // cheap enough not to matter.
    function syncRectMasks() {
      const rectEl = document.getElementById('rect');
      const rectCs = getComputedStyle(rectEl);
      const bgVideoMask = document.getElementById('bg-video-mask');
      // #bg-video-mask always matches #rect's own full box, both
      // orientations alike - it's just the outer clip boundary (nothing
      // ever visually spills past #rect's own silhouette), not what
      // shapes the globe itself. An earlier portrait-only attempt made
      // this a small square window instead (trying to get object-fit:
      // cover to crop sensibly) - that just moved the problem: cover's
      // own crop math is driven by the CONTAINER's shape, so a tall
      // #bg-video-mask still forced a brutal zoom (see git history/
      // readme.txt point 8 if this needs revisiting), and a square one
      // clipped the globe against ITS OWN edges at any real zoom level
      // (top/bottom cropped well before reaching #rect's actual top/
      // bottom edge). See #bg-video's own portrait sizing below instead -
      // that's the box object-fit:cover actually operates against now,
      // sized independently of this mask entirely.
      bgVideoMask.style.width = rectCs.width;
      bgVideoMask.style.height = rectCs.height;
      bgVideoMask.style.borderRadius = rectCs.borderRadius;
      const isPortrait = isPortraitViewport();
      const video = document.getElementById('bg-video');
      if (isPortrait) {
        // portrait ("vertical version") only: #bg-video gets its OWN
        // square box (GLOBE_PORTRAIT_SCALE * #rect's own live width),
        // absolutely positioned/centered on the same canvas point (960,
        // 539.5) the tagline sits on - independent of #bg-video-mask's
        // own (now tall) shape, so object-fit:cover's crop math is
        // always driven by this fixed square aspect, never by the tall
        // container. #bg-video-mask's overflow:hidden only ever actually
        // clips this box once it's zoomed past #rect's own real edges
        // (top/bottom AND left/right), not before - see
        // GLOBE_PORTRAIT_SCALE's own comment.
        const rectWidthPx = parseFloat(rectCs.width);
        const boxPx = rectWidthPx * GLOBE_PORTRAIT_SCALE;
        video.style.left = '50%';
        video.style.top = '50%';
        video.style.right = 'auto';
        video.style.bottom = 'auto';
        video.style.width = boxPx + 'px';
        video.style.height = boxPx + 'px';
        video.style.transform = `translate(calc(-50% + ${GLOBE_PORTRAIT_OFFSET_X}px), -50%) rotate(${GLOBE_PORTRAIT_ROTATE}deg)`;
      } else {
        // landscape - clear any leftover portrait inline overrides (in
        // case a resize ever crossed the orientation boundary), back to
        // the CSS defaults (inset:0, width/height:100%). Deliberately
        // NOT touching `transform` here - landscape's own reveal
        // (showBgVideo's .visible class, and the several .animate()
        // calls elsewhere) already owns that property, and this function
        // runs every single frame, so overwriting it here would fight
        // all of them constantly.
        video.style.left = '';
        video.style.top = '';
        video.style.right = '';
        video.style.bottom = '';
        video.style.width = '';
        video.style.height = '';
      }
      const rect2El = document.getElementById('rect2');
      const rect2BlackEl = document.getElementById('rect2-black');
      const active = rect2BlackEl.classList.contains('visible') ? rect2BlackEl
        : (rect2El.classList.contains('visible') ? rect2El : null);
      const frame = document.getElementById('rect-frame');
      if (active) {
        const cs = getComputedStyle(active);
        frame.style.top = cs.top;
        frame.style.width = cs.width;
        frame.style.height = cs.height;
        frame.style.borderRadius = cs.borderRadius;
        frame.style.boxShadow = '0 0 0 3000px #fff';
      } else {
        frame.style.boxShadow = 'none';
      }
      requestAnimationFrame(syncRectMasks);
    }
    requestAnimationFrame(syncRectMasks);

    // TEMP/provisional - see the HTML comment above #ruler-top. Real
    // viewport px (clientX/clientY), not canvas space - these are for
    // eyeballing on-screen alignment, same as a Photoshop guide dragged
    // off the ruler, not for measuring canvas-coordinate layout.
    (function setupRulerGuides() {
      const guidesLayer = document.getElementById('ruler-guides');
      const rulerTop = document.getElementById('ruler-top');
      const rulerLeft = document.getElementById('ruler-left');
      let dragEl = null;
      let dragAxis = null;
      let label = null;

      function showLabel(axis, pos) {
        if (!label) {
          label = document.createElement('div');
          label.className = 'ruler-guide-label';
          document.body.appendChild(label);
        }
        label.textContent = (axis === 'y' ? 'y: ' : 'x: ') + Math.round(pos) + 'px';
        if (axis === 'y') {
          label.style.top = (pos - 18) + 'px';
          label.style.left = '20px';
        } else {
          label.style.left = (pos + 6) + 'px';
          label.style.top = '20px';
        }
      }
      function hideLabel() {
        if (label) { label.remove(); label = null; }
      }
      function setGuidePos(g, axis, pos) {
        if (axis === 'y') g.style.top = pos + 'px';
        else g.style.left = pos + 'px';
      }
      function startDrag(g, axis) {
        dragEl = g;
        dragAxis = axis;
        document.body.style.cursor = axis === 'y' ? 'ns-resize' : 'ew-resize';
      }
      function createGuide(axis, pos) {
        const g = document.createElement('div');
        g.className = 'ruler-guide ' + (axis === 'y' ? 'horizontal' : 'vertical');
        setGuidePos(g, axis, pos);
        g.addEventListener('mousedown', (e) => { e.preventDefault(); startDrag(g, axis); });
        g.addEventListener('dblclick', () => g.remove());
        guidesLayer.appendChild(g);
        return g;
      }

      window.addEventListener('mousemove', (e) => {
        if (!dragEl) return;
        const pos = dragAxis === 'y' ? e.clientY : e.clientX;
        setGuidePos(dragEl, dragAxis, pos);
        showLabel(dragAxis, pos);
      });
      window.addEventListener('mouseup', () => {
        if (!dragEl) return;
        dragEl = null;
        dragAxis = null;
        document.body.style.cursor = '';
        hideLabel();
      });
      rulerTop.addEventListener('mousedown', (e) => {
        e.preventDefault();
        startDrag(createGuide('y', e.clientY), 'y');
        showLabel('y', e.clientY);
      });
      rulerLeft.addEventListener('mousedown', (e) => {
        e.preventDefault();
        startDrag(createGuide('x', e.clientX), 'x');
        showLabel('x', e.clientX);
      });
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') guidesLayer.querySelectorAll('.ruler-guide').forEach((g) => g.remove());
      });
    })();

  </script>
</body>
</html>
