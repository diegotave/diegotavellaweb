      const fillRadius = Math.max(0, radii[3] - RECT_BORDER_WIDTH);

      // runs on its own timeline (center tagline, unrelated to rect's own
      // widen geometry) - see collapseCenterTagline
      collapseCenterTagline();

      line.style.top = lineStartTop + 'px';
      line.style.width = widthInsetStart + 'px';
      line.classList.add('visible');
      const lineAnim = line.animate([
        { top: lineStartTop + 'px', width: widthInsetStart + 'px' },
        { top: lineEndTop + 'px', width: widthInsetEnd + 'px' }
      ], followOpts);
      lineAnim.finished.then(() => {
        lineAnim.commitStyles();
        lineAnim.cancel();
      });

      // header fill: gray backing growing downward from just inside rect's
      // top stroke, its own bottom edge always exactly where #header-line
      // currently is (0 height at the start, full header height once the
      // line settles) - rounded on its top two corners to nest inside
      // rect's own rounded corners instead of squaring them off
      fill.style.top = (rectTop + RECT_BORDER_WIDTH) + 'px';
      fill.style.height = '0px';
      fill.style.width = widthInsetStart + 'px';
      fill.style.borderRadius = fillRadius + 'px ' + fillRadius + 'px 0 0';
      fill.classList.add('visible');
      const fillAnim = fill.animate([
        { height: '0px', width: widthInsetStart + 'px' },
        { height: (lineEndTop - rectTop - RECT_BORDER_WIDTH) + 'px', width: widthInsetEnd + 'px' }
      ], followOpts);
      fillAnim.finished.then(() => {
        fillAnim.commitStyles();
        fillAnim.cancel();
      });

      // #rect2 keeps the exact same "calle" gap around the outline it
      // already had in the square instance, but from here on the header
      // eats into its own top: as header-line/header-fill grow downward,
      // rect2's own top edge follows right along - gap below the header's
      // own (also moving) bottom edge instead of gap below rect's own top
      // stroke - and its top two corners square off to match header-fill's
      // own square bottom corners. The bottom two corners, untouched by
      // the header, stay rounded exactly as before. Bottom edge itself
      // never moves (rect's own height/bottom don't move this stage
      // either), so growing downward from a fixed bottom is just: shrink
      // height, and recenter `top` (this element's own vertical anchor,
      // via translate(-50%,-50%)) so that fixed bottom edge stays put.
      const rect2 = document.getElementById('rect2');
      const rect2StartWidth = parseFloat(rect2.style.width);
      const rect2StartHeight = parseFloat(rect2.style.height);
      const rect2StartRadius = parseFloat(rect2.style.borderRadius);
      // rect2's `top` has only ever come from the #rect2 CSS rule
      // (539.5px, the shared center) - never written inline before this
      // point - so reading it via .style.top would be an empty string
      // (NaN once parsed). getComputedStyle resolves it either way.
      const rect2StartTop = parseFloat(getComputedStyle(rect2).top);
      const rect2Gap = (widths[3] - rect2StartWidth) / 2; // the calle established in the square instance - widths[3]===heights[3] there, so this is also the top/bottom gap
      const rect2TargetWidth = rect2StartWidth + (widths[4] - widths[3]);
      const rect2BottomY = rect2StartTop + rect2StartHeight / 2;
      const rect2TargetTopEdgeY = lineEndTop + rect2Gap; // same gap, now measured from the header's own finished bottom edge
      const rect2TargetHeight = rect2BottomY - rect2TargetTopEdgeY;
      const rect2TargetTop = rect2BottomY - rect2TargetHeight / 2;
      const rect2Anim = rect2.animate([
        { top: rect2StartTop + 'px', width: rect2StartWidth + 'px', height: rect2StartHeight + 'px', borderRadius: `${rect2StartRadius}px ${rect2StartRadius}px ${rect2StartRadius}px ${rect2StartRadius}px` },
        { top: rect2TargetTop + 'px', width: rect2TargetWidth + 'px', height: rect2TargetHeight + 'px', borderRadius: `0px 0px ${rect2StartRadius}px ${rect2StartRadius}px` }
      ], followOpts);
      rect2Anim.finished.then(() => {
        rect2Anim.commitStyles();
        rect2Anim.cancel();
      });

      // white "Diego Tavella" stand-in: same left-tracking as the real
      // wordmark (see txtAnim above), revealed top-down via clip-path as
      // #header-line's own live position sweeps down past the text's
      // vertical span - a rAF read of the line's actual computed top
      // (not a derived/precomputed timing) because the line's own motion
      // is independently eased (wEase[3], a cubic-bezier), so the wall-
      // clock instant it crosses textTop/textBottom isn't a fixed
      // fraction of this stage's duration
      const txtWhite = document.getElementById('logo-text-white');
      txtWhite.style.top = txt.style.top;
      txtWhite.style.width = txt.style.width;
      txtWhite.style.height = txt.style.height;
      txtWhite.style.clipPath = 'inset(0 0 100% 0)';
      txtWhite.classList.add('visible');
      const txtWhiteAnim = txtWhite.animate([
        { left: txtStartLeft + 'px' },
        { left: (txtStartLeft + dxLeft) + 'px' }
      ], followOpts);
      let revealRafId;
      function revealFollow() {
        const lineY = parseFloat(getComputedStyle(line).top);
        const revealedHeight = Math.min(textHeight, Math.max(0, lineY - textTop));
        const bottomInset = textHeight - revealedHeight;
        txtWhite.style.clipPath = `inset(0 0 ${bottomInset}px 0)`;
        revealRafId = requestAnimationFrame(revealFollow);
      }
      revealFollow();
      txtWhiteAnim.finished.then(() => {
        cancelAnimationFrame(revealRafId);
        txtWhiteAnim.commitStyles();
        txtWhiteAnim.cancel();
        txtWhite.style.clipPath = 'inset(0 0 0 0)'; // fully revealed - the line's ended up past textBottom by then
      });

      // globe video: now a child of #rect (width/height:100%, object-fit:
      // cover - see its own CSS), so it already tracks rect's widening
      // width automatically, with zero extra code, clipped to rect's own
      // rounded corners via its overflow:hidden. All that's left to
      // animate by hand is the deliberate reveal: sliding down by 50% of
      // its own height (=rect's height, unchanged throughout this stage)
      // so its natural center ends up level with rect's own bottom edge
      // instead of its middle - what's left visible (rect's own clip does
      // the rest) is just the globe's upper hemisphere and half its
      // satellite's orbit.
      const video = document.getElementById('bg-video');
      // same duration as everything else in this stage (so it still lands
      // exactly when the rest does), but its own ease-out curve instead of
      // followOpts' shared easing - starts fast and settles into place
      // rather than tracking the linear-ish pace the rest of the stage uses
      const videoRevealOpts = { duration: stageDuration, easing: 'ease-out', fill: 'forwards' };
      const videoAnim = video.animate([
        { transform: 'scale(1) translateY(0%)' },
        { transform: 'scale(1) translateY(50%)' }
      ], videoRevealOpts);
      videoAnim.finished.then(() => {
        commitAndCancel(video, videoAnim);
      });

      runStage(buildStage(3, 4, widths, heights, radii));
      step = 2;
    }

    // the back-triangle's own action: undoes just the widen (step 2 ->
    // step 1), landing back on the square overshoot with the center
    // tagline exactly as it already was (untouched by advanceFromOvershoot,
    // so nothing to reverse) - only rect's own size, the blink square/
    // hover-zone's tracked position, and bg-video's/onda-video's own
    // widen-time shift+crop get undone here, mirroring advanceFromOvershoot
    // itself but in reverse. Deliberately NOT goHome(): that un-presses
    // the button back to step 0 and tears down the video/tagline too,
    // which is a lot further back than this button is for.
    function reverseFromWidened() {
      if (rectAnimating || step !== 2) return;
      // runs on its own timeline (center tagline, unrelated to rect's own
      // shrink geometry) - see restoreCenterTagline
      restoreCenterTagline();
      const el = document.getElementById('rect');
      const sq = document.getElementById('blink-square');
      const hz = document.getElementById('blink-square-hover-zone');

      const startWidth = parseFloat(el.style.width);
      const startHeight = parseFloat(el.style.height);
      const startRadius = parseFloat(el.style.borderRadius);
      // the square it widened from had this same side length - height was
      // never touched by the widen stage (see advanceFromOvershoot), so
      // it's still exactly the overshoot's own height
      const targetSide = startHeight;

      const duration = DURATION * (OFFSETS[4] - OFFSETS[3]); // same span the widen itself used
      const opts = { duration, easing: wEase[3], fill: 'forwards' };
      rectAnimating = true;
      const anim = el.animate([
        { width: startWidth + 'px', height: startHeight + 'px', borderRadius: startRadius + 'px' },
        { width: targetSide + 'px', height: targetSide + 'px', borderRadius: startRadius + 'px' }
      ], opts);

      // mirrors advanceFromOvershoot's own approach: position and the
      // turn back to pointing right both run as WAAPI animations sharing
      // this same duration/easing with the rect's own shrink above, so
      // the square is never left mid-turn or out of position relative to
      // whatever the rect is actually doing that frame. Retraces the same
      // -180deg -> 0deg path the forward turn used, i.e. clockwise -
      // undoing the counterclockwise turn, not repeating it.
      const sqStartLeft = parseFloat(sq.style.left);
      const hzStartLeft = parseFloat(hz.style.left);
      const dxFinal = (targetSide - startWidth) / 2; // shrinking now, so dxFinal is negative - tracks the right edge back inward
      sq.classList.remove('back');
      const sqAnim = sq.animate([
        { left: sqStartLeft + 'px', transform: 'scale(1.5) rotate(-180deg)' },
        { left: (sqStartLeft + dxFinal) + 'px', transform: 'scale(1.5) rotate(0deg)' }
      ], opts);
      const hzAnim = hz.animate([
        { left: hzStartLeft + 'px' },
        { left: (hzStartLeft + dxFinal) + 'px' }
      ], opts);

      // "Diego Tavella" (the wordmark only - bracket-left stays put)
      // tracks back inward with the left edge, same as
      // advanceFromOvershoot but mirrored
      const txt = document.getElementById('logo-text');
      const txtStartLeft = parseFloat(txt.style.left);
      const dxLeft = -dxFinal;
      const txtAnim = txt.animate([
        { left: txtStartLeft + 'px' },
        { left: (txtStartLeft + dxLeft) + 'px' }
      ], opts);

      // header divider retreats back up to just inside rect's own top
      // stroke (mirrors advanceFromOvershoot's same inset) and hides once
      // it gets there
      const line = document.getElementById('header-line');
      const fill = document.getElementById('header-fill');
      const rectTop = RECT_CENTER_Y - targetSide / 2; // square height throughout this stage too
      const textTop = rectTop + EDGE_MARGIN_Y;
      const textHeight = parseFloat(txt.style.height);
      const textBottom = textTop + textHeight;
      const lineCurrentTop = textBottom + EDGE_MARGIN_Y;
      const lineTargetTop = rectTop + RECT_BORDER_WIDTH;
      const widthInsetStart = startWidth - RECT_BORDER_WIDTH * 2;
      const widthInsetEnd = targetSide - RECT_BORDER_WIDTH * 2;
      const lineAnim = line.animate([
        { top: lineCurrentTop + 'px', width: widthInsetStart + 'px' },
        { top: lineTargetTop + 'px', width: widthInsetEnd + 'px' }
      ], opts);

      // header fill shrinks back to nothing, its bottom edge following
      // #header-line back up the same way it followed it down
      const fillAnim = fill.animate([
        { height: (lineCurrentTop - rectTop - RECT_BORDER_WIDTH) + 'px', width: widthInsetStart + 'px' },
        { height: '0px', width: widthInsetEnd + 'px' }
      ], opts);

      // #rect2 mirrors advanceFromOvershoot's own treatment: the header
      // shrinks back away and rect2's top edge (plus its un-rounded top
      // corners) follow it back up, ending square and fully rounded again
      // at the same gap it always had - the bottom two corners never
      // changed either direction, so bottomRadius here is just whatever
      // they already are
      const rect2 = document.getElementById('rect2');
      const rect2StartWidth = parseFloat(rect2.style.width);
      const rect2StartHeight = parseFloat(rect2.style.height);
      const rect2StartTop = parseFloat(getComputedStyle(rect2).top);
      const rect2Radius = parseFloat(getComputedStyle(rect2).borderBottomLeftRadius);
      const rect2Gap = (startWidth - rect2StartWidth) / 2;
      const rect2TargetWidth = rect2StartWidth + (targetSide - startWidth);
      const rect2BottomY = rect2StartTop + rect2StartHeight / 2;
      const rect2TargetTopEdgeY = rectTop + rect2Gap; // back to gap-below-rect's-own-top-stroke, the header having fully retracted by then
      const rect2TargetHeight = rect2BottomY - rect2TargetTopEdgeY;
      const rect2TargetTop = rect2BottomY - rect2TargetHeight / 2;
      const rect2Anim = rect2.animate([
        { top: rect2StartTop + 'px', width: rect2StartWidth + 'px', height: rect2StartHeight + 'px', borderRadius: `0px 0px ${rect2Radius}px ${rect2Radius}px` },
        { top: rect2TargetTop + 'px', width: rect2TargetWidth + 'px', height: rect2TargetHeight + 'px', borderRadius: `${rect2Radius}px ${rect2Radius}px ${rect2Radius}px ${rect2Radius}px` }
      ], opts);

      // white "Diego Tavella" un-reveals bottom-up as the line retreats
      // back past it - same live rAF read of the line's actual position
      // advanceFromOvershoot uses, for the same reason (independently
      // eased motion)
      const txtWhite = document.getElementById('logo-text-white');
      const txtWhiteAnim = txtWhite.animate([
        { left: txtStartLeft + 'px' },
        { left: (txtStartLeft + dxLeft) + 'px' }
      ], opts);
      let revealRafId;
      function revealFollow() {
        const lineY = parseFloat(getComputedStyle(line).top);
        const revealedHeight = Math.min(textHeight, Math.max(0, lineY - textTop));
        const bottomInset = textHeight - revealedHeight;
        txtWhite.style.clipPath = `inset(0 0 ${bottomInset}px 0)`;
        revealRafId = requestAnimationFrame(revealFollow);
      }
      revealFollow();

      // globe video slides back up to centered, mirroring
      // advanceFromOvershoot - width/rounding still track rect
      // automatically (see its own CSS), only the reveal shift reverses
      const video = document.getElementById('bg-video');
      const videoAnim = video.animate([
        { transform: 'scale(1) translateY(50%)' },
        { transform: 'scale(1) translateY(0%)' }
      ], opts);

      Promise.allSettled([anim.finished, sqAnim.finished, hzAnim.finished, txtAnim.finished, lineAnim.finished, fillAnim.finished, txtWhiteAnim.finished, videoAnim.finished, rect2Anim.finished]).then(() => {
        cancelAnimationFrame(revealRafId);
        [anim, sqAnim, hzAnim, txtAnim, lineAnim, fillAnim, txtWhiteAnim, rect2Anim].forEach((a) => { a.commitStyles(); a.cancel(); });
        // #bg-video shares a `transform 0.75s ease` transition with its own
        // .visible class toggle (see #bg-video) for an unrelated, earlier
        // reveal - commitAndCancel keeps that transition from spuriously
        // replaying over this animation's own final value
        commitAndCancel(video, videoAnim);
        sq.style.transform = ''; // hand off to plain .triangle (pointing right) - same final value
        line.classList.remove('visible');
        fill.classList.remove('visible');
        txtWhite.classList.remove('visible');
        txtWhite.style.clipPath = 'inset(0 0 100% 0)'; // fully hidden again - the line's ended up back at rectTop by then
        rectAnimating = false;
        step = 1;
      });
    }
    document.getElementById('blink-square-hover-zone').addEventListener('click', () => {
      if (step === 1) advanceFromOvershoot();
      else if (step === 2) reverseFromWidened();
    });
    // hovering the second-click hit zone morphs the red square into a
    // right-pointing triangle 50% bigger - see #blink-square.triangle.
    // Step-gated: once step 2's back button (.back) is showing, hovering
    // must not touch its classes or it'd un-rotate back to the plain
    // right-pointing preview. The hover-zone itself is only display:block
    // (and thus only able to receive these events at all) while the blink
    // square is actually shown, so no separate visibility check is needed.
    document.getElementById('blink-square-hover-zone').addEventListener('mouseenter', () => {
      if (step !== 1) return;
      document.getElementById('blink-square').classList.add('triangle');
      const ondaVideo = document.getElementById('onda-video');
      ondaVideo.currentTime = 0;
      ondaVideo.play();
      ondaVideo.classList.add('visible');
    });
    document.getElementById('blink-square-hover-zone').addEventListener('mouseleave', () => {
      if (step !== 1) return;
      document.getElementById('blink-square').classList.remove('triangle');
      const ondaVideo = document.getElementById('onda-video');
      ondaVideo.classList.remove('visible');
      ondaVideo.pause();
    });

    document.getElementById('rect').addEventListener('click', onRectClick);

    // hover (button only, before the first click) previews the full
    // pressed look - fill white, stroke black, logo black - reverting if
    // the mouse leaves without a click. Driven from JS rather than CSS
    // :hover since it has to touch the logo sprites too, not just #rect.
    function setButtonHover(hovering) {
      if (!passwordUnlocked || !rectInteractionReady || step !== 0) return;
      const rectEl = document.getElementById('rect');
      const logoInk = [document.getElementById('bracket-left'), document.getElementById('bracket-right'), document.getElementById('logo-text')];
      const rect2 = document.getElementById('rect2');
      if (hovering) {
        // was '#fff' - now transparent too (same reasoning as
        // press.finished's own switch), so #rect2 shows through the
        // hover preview's own interior too, not just its 4px overhang
        rectEl.style.background = 'transparent';
        rectEl.style.borderColor = IDLE_BLACK; // 80% black here too - stays this way until an actual click starts the borderDarken animation (see press.finished)
        logoInk.forEach((e) => { e.style.filter = 'none'; });
        // #rect2 is "born" here, sized 8px past rect's own current (idle
        // button) edges on every side. Fixed from this point on: nothing
        // later resizes it, so as rect presses down and then grows all the
        // way to the overshoot square, rect's own size overtakes rect2's
        // fixed one along the way, flipping it from sticking out around
        // rect to sitting inset within it. Radius grows by a smaller,
        // separate amount (not the same 8px as the width/height overhang) -
        // a true concentric +8 makes the corner balloon from 3px to 11px,
        // way rounder than the logo's own tight corner and reading as a
        // different shape rather than a frame around it. +4 keeps the
        // curve close to the logo's own, at the cost of the gap being a
        // little narrower on the curves than along the straight sides.
        const RECT2_HOVER_OVERHANG = 8;
        const RECT2_HOVER_RADIUS_OVERHANG = 4;
        const rectW = parseFloat(getComputedStyle(rectEl).width);
        const rectH = parseFloat(getComputedStyle(rectEl).height);
        const rectRadius = parseFloat(getComputedStyle(rectEl).borderRadius);
        rect2.style.width = (rectW + RECT2_HOVER_OVERHANG * 2) + 'px';
        rect2.style.height = (rectH + RECT2_HOVER_OVERHANG * 2) + 'px';
        rect2.style.borderRadius = (rectRadius + RECT2_HOVER_RADIUS_OVERHANG) + 'px';
        rect2.style.opacity = '1';
        rect2.classList.add('visible');
      } else {
        rectEl.style.background = IDLE_BLACK;
        rectEl.style.borderColor = '';
        logoInk.forEach((e) => { e.style.filter = ''; });
        rect2.classList.remove('visible');
      }
    }
    document.getElementById('rect').addEventListener('mouseenter', () => setButtonHover(true));
    document.getElementById('rect').addEventListener('mouseleave', () => setButtonHover(false));

    // forwards the extended hit-area's hover/click to the button itself,
    // rather than duplicating the button's own logic on this element too
    const rectHoverZone = document.getElementById('rect-hover-zone');
    rectHoverZone.addEventListener('mouseenter', () => setButtonHover(true));
    rectHoverZone.addEventListener('mouseleave', () => setButtonHover(false));
    rectHoverZone.addEventListener('click', onRectClick);

    // "logo desarme": brackets slide apart, wordmark slides from center to
    // top-left, both unscaled (confirmed off the real 25-frame render,
    // logodesarme_1_100.png..124.png). Rather than run on its own timeline,
    // it's driven directly off the rect's own live width/height every
    // animation frame - the rect and the logo pieces share one progress
    // value (how far the rect has grown from its resting size toward this
    // click's overshoot target), so the logo can never outrun or lag the
    // box it's supposed to stay inside of, regardless of the rect's own
    // (multi-segment, non-linear) easing.
    const BRACKET_START_X0 = 876;
    const BRACKET_WIDTH = 19;
    // right bracket's own ink is 1px narrower than the left one in the
    // source render (1044-1026=18 vs 895-876=19) - using the left
    // bracket's width for both used to put the right bracket 1px off its
    // real rest position, causing a visible jump at the very start of
    // the click animation
    const BRACKET_RIGHT_WIDTH = 18;

    // right bracket mirrors the left exactly around the canvas's own
    // center (876+1044=1920, confirmed off every frame)
    const bracketRightLeft = (x0) => 1920 - x0 - BRACKET_RIGHT_WIDTH;

    const TEXT_START = { left: 895, top: 508 };

    // experiment: grow the wordmark 20% over the same translate, anchored
    // on the D's own top-left corner - since txt.style.left/top already
    // track that corner every frame, growing width/height while leaving
    // them alone makes the sprite expand down-and-right from exactly that
    // point, so the corner itself still lands at textEnd (unchanged)
    const TEXT_BASE_WIDTH = 131;
    const TEXT_BASE_HEIGHT = 72;
    const TEXT_END_SCALE = 1.4; // 20% + another 20 points on top, not compounded

    // end targets sit a fixed margin inside the rect's overshoot edge
    // rather than at a fixed canvas position, so they land in the same
    // relative spot regardless of viewport (overshoot size itself varies
    // with viewport via overshootValues()). Diego Tavella's top-left
    // corner and the blink square's bottom-right corner are the two
    // opposite corners of "the block" - an invisible frame centered on
    // the "+", with the brackets sitting on its vertical sides.
    //
    // X and Y now share the same value on purpose: Diego Tavella's own
    // top margin (D's top-left vertex to the rect's top edge) used to be
    // 67.3, wider than its 59.7 side margin (to the rect's left edge) -
    // moved up to match, and the blink square's bottom margin (its own
    // bottom-right vertex to the rect's bottom edge) moved down to match
    // its 59.7 right margin too, for the same reason. Since both
    // margins were already driven by one constant each (X for the
    // brackets/left/right, Y for top/bottom), equalizing them was just
    // setting one to the other's value - not a new formula.
    const EDGE_MARGIN_X = 59.7;
    const EDGE_MARGIN_Y = 59.7;

    // sprite crops (assets/images/logo-desarme/*.png) are padded 4px on
    // every free edge, but 0px on whichever edge touches its neighbor at
    // frame 100 (brackets and text are flush there, no gap to pad into) -
    // so only bracket-left's left edge and the text block's top/bottom
    // need the -4px correction; bracket-right's and the text's left/right
    // sit exactly on the measured ink position
    let logoRafId = null;

    // appears once the rect is nearly done growing (last 10% of its
    // approach to the overshoot target)
    const BLINK_SQUARE_THRESHOLD = 0.9;

    // second-click hit zone (#blink-square-hover-zone): the blink square
    // plus this much on every side, and nothing else on the rect - see
    // advanceFromOvershoot
    const BLINK_HIT_PADDING = 5;

    function syncLogoToRect(overshootWidth, overshootHeight) {
      const rectEl = document.getElementById('rect');
      const bl = document.getElementById('bracket-left');
      const br = document.getElementById('bracket-right');
      const txt = document.getElementById('logo-text');
      const sq = document.getElementById('blink-square');
      const hz = document.getElementById('blink-square-hover-zone');
      sq.style.width = BRACKET_WIDTH + 'px';
      sq.style.height = BRACKET_WIDTH + 'px';
      hz.style.width = (BRACKET_WIDTH + BLINK_HIT_PADDING * 2) + 'px';
      hz.style.height = (BRACKET_WIDTH + BLINK_HIT_PADDING * 2) + 'px';

      const startW = BASE_WIDTHS[0];
      const startH = BASE_HEIGHTS[0];
      const overshootLeft = RECT_CENTER_X - overshootWidth / 2;
      const overshootTop = RECT_CENTER_Y - overshootHeight / 2;

      const bracketEndX0 = overshootLeft + EDGE_MARGIN_X;
      const textEnd = {
        // left edge shares bracket-left's own column, instead of the
        // text's own independent margin (which used to land noticeably
        // right of it)
        left: bracketEndX0,
        top: overshootTop + EDGE_MARGIN_Y
      };

      if (logoRafId) cancelAnimationFrame(logoRafId);

      function tick() {
        const w = parseFloat(getComputedStyle(rectEl).width);
        const h = parseFloat(getComputedStyle(rectEl).height);
        // worst-case of the two axes, so the logo never gets ahead of
        // whichever dimension the rect is growing slower on
        const p = Math.min(1, Math.max(0,
          Math.min((w - startW) / (overshootWidth - startW), (h - startH) / (overshootHeight - startH))
        ));

        const lerp = (a, b) => a + p * (b - a);

        bl.style.left = (lerp(BRACKET_START_X0, bracketEndX0) - 4) + 'px';
        const brLeft = lerp(bracketRightLeft(BRACKET_START_X0), bracketRightLeft(bracketEndX0));
        br.style.left = brLeft + 'px';
        txt.style.left = lerp(TEXT_START.left, textEnd.left) + 'px';
        txt.style.top = (lerp(TEXT_START.top, textEnd.top) - 4) + 'px';
        const textScale = lerp(1, TEXT_END_SCALE);
        txt.style.width = (TEXT_BASE_WIDTH * textScale) + 'px';
        txt.style.height = (TEXT_BASE_HEIGHT * textScale) + 'px';
        // black ink on a transparent sprite, so opacity is what "lightens"
        // it - fading to 0.8 reads as 80% black against the white canvas
        txt.style.opacity = lerp(1, 0.6);

        // right-aligned with the right bracket's own current right edge,
        // sitting EDGE_MARGIN_Y above the rect's own current bottom edge -
        // both read live off the rect/bracket so it stays correctly
        // pinned whenever it's visible, not just at p=1
        const rectBottom = RECT_CENTER_Y + h / 2;
        // square is exactly BRACKET_WIDTH wide too, so its left edge
        // equals the bracket's right edge minus its own width, which is
        // just the bracket's own left edge (brLeft) - written out for clarity
        sq.style.left = brLeft + 'px';
        const sqTop = rectBottom - EDGE_MARGIN_Y - BRACKET_WIDTH;
        sq.style.top = sqTop + 'px';
        const squareVisible = p >= BLINK_SQUARE_THRESHOLD;
        sq.classList.toggle('visible', squareVisible);

        // second-click hit zone: the blink square's own box, padded
        // BLINK_HIT_PADDING on every side - tracks it live since both are
        // still moving together whenever the rect itself resizes further
        hz.style.left = (brLeft - BLINK_HIT_PADDING) + 'px';
        hz.style.top = (sqTop - BLINK_HIT_PADDING) + 'px';
        hz.classList.toggle('visible', squareVisible);

        // >= 0.999 rather than === 1: the rect's own computed style and
        // this function's independently-computed overshoot target can
        // differ by a hair of floating-point error, so waiting for exact
        // equality could in principle never resolve and leave the loop
        // running forever with the tagline never triggering
        if (p < 0.999) {
          logoRafId = requestAnimationFrame(tick);
        } else {
          logoRafId = null;
        }
      }
      tick();
    }

    // center tagline: "+" fades in at screen center, "Video Editor" and
    // "motion graphics" fade+slide out from it - scheduled off the rect's
    // own animation-finished promise (see onRectClick's step 0 branch),
    // not off the logo's rAF sync loop, since that loop's progress value
    // is only reliable enough for smooth positioning, not for detecting
    // "done" (it's polled once per frame off getComputedStyle and can
    // plateau a hair under its target). Never overlaps the brackets since
    // its slide distance (260px) is a fixed, modest fraction of the much
    // larger gap the brackets end up sitting at.
    const TAGLINE_DELAY = 300 * MOTION_SCALE; // ms, "un poco despues" of the rect settling
    const TAGLINE_EARLY_MS = 1000 * MOTION_SCALE; // ms - fires this much sooner than that, so it isn't waiting on the rect's own hold tail
    let taglineTimeoutId = null;
    let plusSpinTimeoutId = null;
    let plusLoopIntervalId = null;
    let plusSpinTurns = 0;
    let leftSwapAnim = null;
    let rightSwapAnim = null;
    // where "Video Editor"/"motion graphics" swap in FROM (see
    // leftSwapAnim/rightSwapAnim below) - collapseCenterTagline sends them
    // back there to hide, so it needs these after playCenterTagline's own
    // locals have gone out of scope
    let taglineLeftFinalX = null;
    let taglineRightFinalX = null;
    // brackets' own left before multiplyPlusIntoBars spread them apart -
    // restoreCenterTagline reads these back to undo exactly that spread,
    // rather than assuming the viewport hasn't changed since and
    // recomputing the same 5vh shift fresh
    let bracketLeftPreSpread = null;
    let bracketRightPreSpread = null;
    // brackets'/the center bar's own top before multiplyPlusIntoBars
    // dropped the whole block down 10vh (both brackets share the same
    // value, see #bracket-left/#bracket-right's own CSS) -
    // restoreCenterTagline reverses this the same way it does the spread
    // above
    let bracketTopPreDescend = null;
    let plusTopPreDescend = null;
    // armV's own width before multiplyPlusIntoBars thinned it down to
    // THIN_BAR_WIDTH - restoreCenterTagline reverses this the same way it
    // does the spread above
    let armVWidthPreThin = null;

    function playCenterTagline() {
      const plus = document.getElementById('tagline-plus');
      const left = document.getElementById('tagline-left');
      const right = document.getElementById('tagline-right');

      // "Video Editor" at 10% under the base 89.25px; "motion graphics"
      // another 15% under that on top - bold + letter-spacing on "Video
      // Editor" (see its CSS) plus this extra shrink on "motion graphics"
      // is what's bringing the two blocks to a similar rendered width,
      // since "motion graphics" is the longer string
      // 37.3 = the old 24 bumped up so, combined with the smaller "+"
      // below, both blocks land 10% further from center than they used to
      // sit (the "+" shrinking to 0.65x means less of the old gap comes
      // from "+"-width, so PLUS_GAP has to make up that difference on top
      // of the 10%)
      const PLUS_GAP = 37.3; // same for both blocks - primary anchor
      const baseSize = 89.25 * 0.9;
      left.style.fontSize = baseSize + 'px';
      right.style.fontSize = (baseSize * 0.85) + 'px';

      // "+" is two plain divs (see .plus-arm), sized here rather than
      // via font-size. #tagline-plus needs an explicit width/height too:
      // with only absolutely-positioned children it would report 0 for
      // offsetWidth, which plusHalfWidth below depends on. Scaled to
      // 0.65x the original 48px arm span, so it starts noticeably smaller
      // than the wordmark blocks instead of matching their old size.
      // Stroke bumped from 3 to 11 (pre-scale) so the "+"/bar reads as
      // bold, matching "Video Editor"'s own bold weight instead of
      // looking thin/light next to it.
      const PLUS_SCALE = 0.65;
      const armSpan = 48 * PLUS_SCALE;
      const armThickness = 11 * PLUS_SCALE;
      plus.style.width = armSpan + 'px';
      plus.style.height = armSpan + 'px';
      const armH = plus.querySelector('.plus-arm-h');
      const armV = plus.querySelector('.plus-arm-v');
      armH.style.width = armSpan + 'px';
      armH.style.height = armThickness + 'px';
      armH.style.marginLeft = (-armSpan / 2) + 'px';
      armH.style.marginTop = (-armThickness / 2) + 'px';
      armV.style.width = armThickness + 'px';
      armV.style.height = armSpan + 'px';
      armV.style.marginLeft = (-armThickness / 2) + 'px';
      armV.style.marginTop = (-armSpan / 2) + 'px';

      // both blocks anchor off the "+" by the same gap, so the visible
      // distance from the plus is identical on both sides. Bracket
      // clearance is a soft cap, not a second anchor: a block only
      // shrinks (font-size, not tracking) if it would otherwise sit
      // closer than BRACKET_GAP to its bracket. Checked against a frozen
      // reference position (168.7/148.3 margin, the values in place when
      // this tagline was last tuned), not the brackets' live position -
      // without the check the tagline overlapped them outright once the
      // brackets moved 10vh further out; reading it live would instead
      // silently resize the tagline on every future bracket-only tweak,
      // which is exactly what wasn't wanted here.
      const FROZEN_BRACKET_LEFT_INNER_X = 528.715;
      const FROZEN_BRACKET_RIGHT_INNER_X = 1392.285;
      const BRACKET_GAP = 90;

      const plusHalfWidth = plus.offsetWidth / 2;

      const leftAvailable = (960 - plusHalfWidth - PLUS_GAP) - (FROZEN_BRACKET_LEFT_INNER_X + BRACKET_GAP);
      if (left.offsetWidth > leftAvailable) {
        left.style.fontSize = (baseSize * (leftAvailable / left.offsetWidth)) + 'px';
      }

      // anchored on the "V" now, not the "+" side: measure the width at
      // the CSS-default 3px tracking first (this fixes where the V ends
      // up), then tighten the tracking a touch - the block shrinks
      // toward the bracket it's already pinned to, so only its "+"-side
      // edge recedes further from the plus, rather than the whole block
      // sliding as one piece
      const targetRightEdge = 960 - plusHalfWidth - PLUS_GAP;
      const widthBeforeTightening = left.offsetWidth;
      const vAnchorX = targetRightEdge - widthBeforeTightening;
      left.style.letterSpacing = '1.5px';
      const recedeDelta = widthBeforeTightening - left.offsetWidth; // offsetWidth is a pure width measurement, unaffected by position, so this doesn't need left.style.left set yet

      const rightAvailable = (FROZEN_BRACKET_RIGHT_INNER_X - BRACKET_GAP) - (960 + plusHalfWidth + PLUS_GAP);
      if (right.offsetWidth > rightAvailable) {
        right.style.fontSize = (baseSize * 0.85 * (rightAvailable / right.offsetWidth)) + 'px';
      }
      // "motion graphics" moves away from the plus by the same distance
      // "Video Editor" just receded, to keep both blocks' distance from
      // the "+" matched
      const rightTargetLeft = 960 + plusHalfWidth + PLUS_GAP + recedeDelta;

      // final pass: grow both blocks 15%, each around its own center (not
      // the "+" or the bracket) - applied last so it doesn't disturb the
      // V/plus-gap anchoring above, just scales each block in place. Takes
      // and returns a plain left value rather than reading/writing
      // el.style.left directly - see the swap-slide comment below for why
      // that write has to wait until everything is computed.
      function growAroundOwnCenter(el, factor, currentLeft) {
        const oldWidth = el.offsetWidth;
        const centerX = currentLeft + oldWidth / 2;
        const newSize = parseFloat(getComputedStyle(el).fontSize) * factor;
        el.style.fontSize = newSize + 'px';
        return centerX - el.offsetWidth / 2;
      }
      const GROW_FACTOR = 1.3;
      let leftFinalLeft = growAroundOwnCenter(left, GROW_FACTOR, vAnchorX);
      let rightFinalLeft = growAroundOwnCenter(right, GROW_FACTOR, rightTargetLeft);

      // shrink both text blocks 15%, anchored on the "+"'s own center
      // (960, its `left` in the CSS) rather than each block's own center
      // like growAroundOwnCenter above - scaling around an external point
      // both shrinks the block AND pulls it toward that point, unlike
      // growAroundOwnCenter which only changes size in place. Brackets are
      // untouched - this only resizes/repositions the tagline text.
      const PLUS_ANCHOR_X = 960;
      const TEXT_SHRINK_FACTOR = 0.85;
      function scaleTowardAnchor(el, factor, anchorX, currentLeft) {
        const newSize = parseFloat(getComputedStyle(el).fontSize) * factor;
        el.style.fontSize = newSize + 'px';
        return anchorX + (currentLeft - anchorX) * factor;
      }
      leftFinalLeft = scaleTowardAnchor(left, TEXT_SHRINK_FACTOR, PLUS_ANCHOR_X, leftFinalLeft);
      rightFinalLeft = scaleTowardAnchor(right, TEXT_SHRINK_FACTOR, PLUS_ANCHOR_X, rightFinalLeft);

      // equalize the left/right bracket gaps: growing each block around its
      // OWN center (above) keeps each one balanced in isolation, but "Video
      // Editor" and "motion graphics" don't have the same width or the same
      // distance from the "+" to begin with, so the two gaps to their
      // brackets land at different sizes on their own. Reads the brackets'
      // real rendered position (not the FROZEN_BRACKET_*_INNER_X constants
      // above, which are deliberately stale - see their own comment) since
      // an equal-gap result has to track wherever the brackets actually
      // are, same reasoning as trackWindow()'s live read elsewhere in this
      // file. Only shifts each block (translate, not a re-grow), split the
      // difference so neither side eats the whole correction.
      const canvasScaleNow = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      const canvasLeftPx = canvas.getBoundingClientRect().left;
      const bracketLeftInnerX = (document.getElementById('bracket-left').getBoundingClientRect().right - canvasLeftPx) / canvasScaleNow;
      const bracketRightInnerX = (document.getElementById('bracket-right').getBoundingClientRect().left - canvasLeftPx) / canvasScaleNow;
      const leftGap = leftFinalLeft - bracketLeftInnerX;
      const rightGap = bracketRightInnerX - (rightFinalLeft + right.offsetWidth);
      // moves a third of the (now-equal) bracket gap over to the "+" side
      // instead: each block shifts outward, toward its own bracket, by a
      // proportional fraction of whatever gap it actually has - not a
      // fixed px amount - so this keeps working regardless of actual
      // rendered text width (font metrics/hinting can measure noticeably
      // different across browsers).
      const BRACKET_GAP_KEEP_FRACTION = 2 / 3;
      const targetGap = ((leftGap + rightGap) / 2) * BRACKET_GAP_KEEP_FRACTION;
      leftFinalLeft = bracketLeftInnerX + targetGap;
      rightFinalLeft = bracketRightInnerX - targetGap - right.offsetWidth;
      taglineLeftFinalX = leftFinalLeft;
      taglineRightFinalX = rightFinalLeft;

      // "Video Editor"/"motion graphics" swap-slide: each word is clipped
      // by a #tagline-*-window fixed at its OWN final spot (see the
      // stylesheet), so starting it at the OTHER word's final position
      // leaves it invisible - wrong window's reach - until it slides back
      // across to its own true position and comes into that window's
      // view. Driven as an explicit two-keyframe Web Animations API call
      // (matching runStage's own use of el.animate elsewhere in this
      // file) rather than toggling el.style.left and leaning on the CSS
      // `transition` to infer a from/to - a from-state that's only implied
      // by "whatever the style was a moment ago" is exactly what silently
      // broke here: forcing a synchronous reflow between the swapped and
      // final writes reliably got ONE of the two elements' swap to stick
      // as the transition's start, but the other's kept getting coalesced
      // away regardless (right into a straight 984->1008.8 with no visible
      // detour through the swap at all) - a real browser inconsistency,
      // not a timing fluke, and it's what "no funciona motion graphics"
      // turned out to be. Explicit keyframes have no such ambiguity: frame
      // 0 is the swap value no matter what either element's style already
      // says, so this animates identically for both.
      left.style.right = 'auto'; // '' would fall back to the stylesheet's own right:984px, not clear it - with both left and right set the browser forces the box width to span between them instead of sizing to content
      const swapAnimOpts = { duration: TAGLINE_SWAP_MS, easing: 'ease', fill: 'forwards' };
      leftSwapAnim = left.animate([{ left: rightFinalLeft + 'px' }, { left: leftFinalLeft + 'px' }], swapAnimOpts);
      // "Video Editor" moves right-to-left into a mask open on its right
      // side, so its own left edge (where "V" sits) is what's closest to
      // that mask and crosses in first - already a left-to-right reveal,
      // no extra help needed. "motion graphics" is the mirror case: moving
      // left-to-right into a mask open on its LEFT side means its own
      // RIGHT edge ("s" in graphics) is what's closest and crosses in
      // first - reading end-to-start, backwards. A fixed window can't fix
      // that (it's just clipping absolute screen position, blind to which
      // characters are there), so this adds its own clip-path, animated
      // left-to-right in lockstep with the slide, to force the correct
      // reading order regardless of which edge the window itself reveals.
      // -20px on the bottom inset (instead of 0) is deliberate: this
      // clip-path is the first thing to ever clip this element at all, so
      // a plain 0 clips flush against the box's own bottom edge - which
      // cuts off "graphics"' g-descender, since line-height:1 already lets
      // descenders spill well below the box with nothing previously there
      // to clip them (a smaller -3px still left it visibly flat-cropped,
      // confirmed by screenshot - Helvetica Neue Light's descender at this
      // font-size reaches further than that). The negative inset pushes
      // that edge down past where the descender actually ends.
      rightSwapAnim = right.animate([
        { left: leftFinalLeft + 'px', clipPath: 'inset(0 100% -20px 0)' },
        { left: rightFinalLeft + 'px', clipPath: 'inset(0 0% -20px 0)' }
      ], swapAnimOpts);
      Promise.allSettled([leftSwapAnim.finished, rightSwapAnim.finished]).then(() => {
        // resetCenterTagline may have already canceled+nulled these (a
        // reset mid-slide) - commitStyles on an already-canceled
        // animation throws, so skip anything that's not still running.
        // commitAndCancel (not a plain commitStyles+cancel) since both
        // elements share a `left`/`right` transition (see .tagline-left/
        // -right) with a later, separately-triggered swap - see its own
        // comment for why that combination needs the extra step here.
        if (leftSwapAnim && leftSwapAnim.playState !== 'idle') commitAndCancel(left, leftSwapAnim);
        if (rightSwapAnim && rightSwapAnim.playState !== 'idle') commitAndCancel(right, rightSwapAnim);
        leftSwapAnim = null;
        rightSwapAnim = null;
      });
      left.classList.add('visible');
      right.classList.add('visible');
      plus.classList.add('visible');
      // video appears right as the phrases start sliding back into their
      // own windows, not later at the "+"-to-"/" spin
      showBgVideo();

      // once the fade-in settles (its own 0.8s opacity transition), start
      // the endless "+"<->bar flourish loop - see startSpinLoop
      startSpinLoop();
    }

    // spins the "+" into a bar - see #tagline-plus.spin for the shape
    // change - then keeps flipping back and forth every 6s, indefinitely.
    // Each step adds two more full clockwise turns to the inline rotation
    // (never toggles it back to a smaller angle), so the spin always
    // reads as forward motion in both directions instead of unwinding.
    // Top-level (not nested in playCenterTagline) so restoreCenterTagline
    // can also resume this same loop once the back button un-multiplies
    // the bars back into a single "+".
    const SPIN_TURN_DEG = 720;
    function advanceSpin() {
      const plus = document.getElementById('tagline-plus');
      plusSpinTurns += 1;
      plus.style.transform = `translate(-50%, -50%) rotate(${plusSpinTurns * SPIN_TURN_DEG}deg)`;
      plus.classList.toggle('spin');
    }
    function startSpinLoop() {
      plusSpinTimeoutId = setTimeout(() => {
        advanceSpin();
        plusLoopIntervalId = setInterval(advanceSpin, 6000);
      }, 800);
    }

    // second half of this stage's own sequence (see advanceFromOvershoot,
    // which calls this once the rect starts widening to 16:9): one single
    // movement, not staged batches - "Video Editor"/"motion graphics"
    // slide back to the swapped spot they originally slid in FROM
    // (mirrors playCenterTagline's own leftSwapAnim/rightSwapAnim exactly,
    // just with start/end swapped), the "+" settles into a single "|"
    // (the same shape #tagline-plus.spin already defines, just held once
    // rather than looped), and that bar "multiplies" into 7 (see
    // multiplyPlusIntoBars) - all three starting together, right now.
    function collapseCenterTagline() {
      // stop the endless "+"<->bar flourish first - it'd otherwise keep
      // firing underneath (and fighting) this one-way sequence
      if (plusSpinTimeoutId) { clearTimeout(plusSpinTimeoutId); plusSpinTimeoutId = null; }
      if (plusLoopIntervalId) { clearInterval(plusLoopIntervalId); plusLoopIntervalId = null; }

      const left = document.getElementById('tagline-left');
      const right = document.getElementById('tagline-right');
      const plus = document.getElementById('tagline-plus');
      if (taglineLeftFinalX === null || taglineRightFinalX === null) return; // tagline never actually played

      // same 3vh drop multiplyPlusIntoBars gives the rest of "botonera
      // videos" in this same move - without it, the text stays at its old
      // height while everything below it drops, so it reads as stuck/
      // cropped up top instead of leaving together with the block
      const canvasScaleNow = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      const descendPx = (window.innerHeight * 0.03) / canvasScaleNow;
      const taglineTopStart = parseFloat(getComputedStyle(left).top);
      const taglineTopEnd = taglineTopStart + descendPx;

      const hideOpts = { duration: TAGLINE_SWAP_MS, easing: 'ease', fill: 'forwards' };
      const leftHideAnim = lightAnimate(left, [
        { left: taglineLeftFinalX + 'px', top: taglineTopStart + 'px' },
        { left: taglineRightFinalX + 'px', top: taglineTopEnd + 'px' }
      ], hideOpts);
      // "motion graphics" needs longer to actually read as sliding away -
      // moving left INTO its own window's far edge (rather than out into
      // open canvas, like "Video Editor" does) means it hits that window's
      // own hard boundary partway through; at HIDE_MS's pace that boundary
      // cut arrives almost immediately, reading as a hard cut instead of a
      // slide. Slower gives the eye time to actually see it travel before
      // that cut, even though the cut itself is still there.
      const RIGHT_HIDE_MS = 1300 * MOTION_SCALE;
      const rightHideOpts = { duration: RIGHT_HIDE_MS, easing: 'ease', fill: 'forwards' };
      // same forced clip-path reveal-order fix as rightSwapAnim, run
      // backwards - see playCenterTagline's own comment on why this can't
      // just be a plain CSS transition
      const rightHideAnim = lightAnimate(right, [
        { left: taglineRightFinalX + 'px', top: taglineTopStart + 'px', clipPath: 'inset(0 0% -20px 0)' },
        { left: taglineLeftFinalX + 'px', top: taglineTopEnd + 'px', clipPath: 'inset(0 100% -20px 0)' }
      ], rightHideOpts);
      Promise.allSettled([leftHideAnim.finished, rightHideAnim.finished]).then(() => {
        commitAndCancel(left, leftHideAnim);
        commitAndCancel(right, rightHideAnim);
        left.classList.remove('visible');
        right.classList.remove('visible');
      });

      // "+" settles into a plain "|" right away, same beat as the text
      // hiding above - no extra rotation, the spin flourish stopped above
      // is a separate, unrelated effect. Animated explicitly via WAAPI
      // (not classList.toggle('spin') + the CSS transition, which runs on
      // its own fixed 1.4s regardless of what else is happening) so the
      // arms actually finish shortening/growing in BOTONERA_FORM_MS - the
      // same span multiplyPlusIntoBars takes for the bars/brackets, so
      // the whole thing reads as one synchronized move instead of the
      // arms visibly settling later than everything around them. Reads
      // its own current shape live (rather than assuming "+") since the
      // endless flourish loop stopped just above uses classList.toggle,
      // so .spin can already be on by the time this runs.
      const armH = plus.querySelector('.plus-arm-h');
      const armV = plus.querySelector('.plus-arm-v');
      const armsAlreadyBar = plus.classList.contains('spin');
      const armOpts = { duration: BOTONERA_FORM_MS, easing: 'ease', fill: 'forwards' };
      const armHAnim = armH.animate([
        { transform: armsAlreadyBar ? 'scaleX(0)' : 'scaleX(1)' },
        { transform: 'scaleX(0)' }
      ], armOpts);
      const armVAnim = armV.animate([
        { transform: armsAlreadyBar ? 'scaleY(1.5)' : 'scaleY(1)' },
        { transform: 'scaleY(1.5)' }
      ], armOpts);
      plus.classList.add('spin'); // hands off to this class's own matching CSS values once the WAAPI anims below finish
      [[armHAnim, armH], [armVAnim, armV]].forEach(([a, el]) => {
        a.finished.then(() => {
          a.cancel(); // no commitStyles - clearing straight to '' hands off to .spin's own matching value, same result
          el.style.transform = '';
        });
      });

      // the bars/bracket-spread fire in this same instant too, so text
      // exit, "+"->"|", and the bars entering all read as one motion
      // rather than one waiting on the last
      multiplyPlusIntoBars();
    }

    // the settled "|" multiplies into a row of 7: 3 new bars to its left,
    // 3 to its right, the whole row landing equally spaced across the
    // full span between the brackets' own inner (vertical stroke) edges -
    // same live-read technique playCenterTagline uses for that span, so
    // it still lands correctly regardless of viewport size. 7 bars make 8
    // equal gaps (2 to the brackets themselves, 6 between neighboring
    // bars) - the center "|" already sits at gap*4 by construction, since
    // the brackets are symmetric around x=960. The brackets themselves
    // spread 5vh further out on each side in this same motion, and the
    // bars target their POST-spread positions (not today's), so
    // everything fans out and settles together in one move instead of the
    // bars landing first and the brackets catching up around them after.
    function multiplyPlusIntoBars() {
      const plus = document.getElementById('tagline-plus');
      const armV = plus.querySelector('.plus-arm-v');
      // getComputedStyle's own height is armV's un-transformed box size -
      // the visible "|" is 1.5x taller than that (see #tagline-plus.spin
      // .plus-arm-v's scaleY(1.5)), so the clones need that same factor to
      // actually match it
      const barHeight = parseFloat(getComputedStyle(armV).height) * 1.5;
      // the 6 new bars are just born at this width (see THIN_BAR_WIDTH,
      // matching rect's/the brackets' own 2px) - only the center "|"
      // itself (armV, below) actually animates its own width down to
      // match, since it starts at its own bold thickness
      const barWidth = THIN_BAR_WIDTH;

      const bracketLeft = document.getElementById('bracket-left');
      const bracketRight = document.getElementById('bracket-right');
      const canvasScaleNow = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      const canvasLeftPx = canvas.getBoundingClientRect().left;
      const bracketLeftInnerX = (bracketLeft.getBoundingClientRect().right - canvasLeftPx) / canvasScaleNow;
      const bracketRightInnerX = (bracketRight.getBoundingClientRect().left - canvasLeftPx) / canvasScaleNow;

      // 8vh each side (60% less than the original 20vh) - real
      // viewport-relative units, converted through the canvas's own
      // current scale like everything else in this file that's measured
      // off the actual screen rather than the 1920x1080 comp space
      const spreadPx = (window.innerHeight * 0.08) / canvasScaleNow;
      const bracketLeftStart = parseFloat(bracketLeft.style.left);
      const bracketRightStart = parseFloat(bracketRight.style.left);
      bracketLeftPreSpread = bracketLeftStart;
      bracketRightPreSpread = bracketRightStart;
      const bracketLeftEnd = bracketLeftStart - spreadPx;
      const bracketRightEnd = bracketRightStart + spreadPx;
      const gap = ((bracketRightInnerX + spreadPx) - (bracketLeftInnerX - spreadPx)) / 8;

      // whole block (brackets, center bar, the 6 new bars) drops 3vh in
      // this same move - a plain uniform shift applied to every element's
      // own current top, so whatever relative alignment they already have
      // (brackets anchored by their top edge, bars/plus centered via
      // translate(-50%,-50%)) is preserved exactly, just moved down
      const descendPx = (window.innerHeight * 0.03) / canvasScaleNow;
      const bracketTopStart = parseFloat(getComputedStyle(bracketLeft).top);
      const bracketTopEnd = bracketTopStart + descendPx;
      bracketTopPreDescend = bracketTopStart;
      const plusTopStart = parseFloat(getComputedStyle(plus).top);
      const plusTopEnd = plusTopStart + descendPx;
      plusTopPreDescend = plusTopStart;
      // .plus-multiply-bar's own CSS default (539.5px, same as
      // RECT_CENTER_Y) - read as a constant rather than off an instance,
      // since none exist yet at this point (created further below)
      const barTopStart = RECT_CENTER_Y;
      const barTopEnd = barTopStart + descendPx;

      const opts = { duration: BOTONERA_FORM_MS, easing: 'ease', fill: 'forwards' };
      // "botonera videos" (brackets + center bar + the 6 multiplied ones)
      // grays out over this same move - see GRAY_OPACITY

      // brackets crossfade to their thin-stroke stand-ins (see
      // #bracket-left-thin/#bracket-right-thin) in this same move - bold
      // fades out to nothing while thin fades in already at the target
      // gray, rather than an instant src swap (which would read as a
      // glitch/cut). The thin one starts from wherever the bold one
      // currently is (it's never been positioned before this) and tracks
      // the identical left keyframes, so the two stay perfectly stacked
      // throughout.
      const bracketLeftThin = document.getElementById('bracket-left-thin');
      const bracketRightThin = document.getElementById('bracket-right-thin');
      bracketLeftThin.style.left = bracketLeftStart + 'px';
      bracketRightThin.style.left = bracketRightStart + 'px';
      bracketLeftThin.style.top = bracketTopStart + 'px';
      bracketRightThin.style.top = bracketTopStart + 'px';

      const bracketLeftAnim = lightAnimate(bracketLeft, [
        { left: bracketLeftStart + 'px', top: bracketTopStart + 'px', opacity: 1 },
        { left: bracketLeftEnd + 'px', top: bracketTopEnd + 'px', opacity: 0 }
      ], opts);
      const bracketRightAnim = lightAnimate(bracketRight, [
        { left: bracketRightStart + 'px', top: bracketTopStart + 'px', opacity: 1 },
        { left: bracketRightEnd + 'px', top: bracketTopEnd + 'px', opacity: 0 }
      ], opts);
      const bracketLeftThinAnim = lightAnimate(bracketLeftThin, [
        { left: bracketLeftStart + 'px', top: bracketTopStart + 'px', opacity: 0 },
        { left: bracketLeftEnd + 'px', top: bracketTopEnd + 'px', opacity: GRAY_OPACITY }
      ], opts);
      const bracketRightThinAnim = lightAnimate(bracketRightThin, [
        { left: bracketRightStart + 'px', top: bracketTopStart + 'px', opacity: 0 },
        { left: bracketRightEnd + 'px', top: bracketTopEnd + 'px', opacity: GRAY_OPACITY }
      ], opts);
      const plusMoveAnim = lightAnimate(plus, [
        { top: plusTopStart + 'px', opacity: 1 },
        { top: plusTopEnd + 'px', opacity: GRAY_OPACITY }
      ], opts);
      // the center "|" itself thins down to match the new bars (which are
      // simply born at THIN_BAR_WIDTH, no animation needed) - margin-left
      // has to shrink in lockstep with width (it's what keeps armV
      // centered on #tagline-plus's own 50% left, a plain px margin
      // rather than a recalculated percentage) or it'd drift off-center
      const armVStartWidth = parseFloat(getComputedStyle(armV).width);
      armVWidthPreThin = armVStartWidth;
      const armVAnim = lightAnimate(armV, [
        { width: armVStartWidth + 'px', marginLeft: (-armVStartWidth / 2) + 'px' },
        { width: THIN_BAR_WIDTH + 'px', marginLeft: (-THIN_BAR_WIDTH / 2) + 'px' }
      ], opts);
      [bracketLeftAnim, bracketRightAnim, bracketLeftThinAnim, bracketRightThinAnim, plusMoveAnim, armVAnim].forEach((a) => {
        a.finished.then(() => { a.commitStyles(); a.cancel(); });
      });

      // bars enter from their own side's bracket (not from the center),
      // sliding inward to their final spot - following the same inward
      // direction "Video Editor"/"motion graphics" moved in when they
      // hid toward the center a moment earlier (see collapseCenterTagline)
      const barAnims = [];
      for (let i = 1; i <= 3; i++) {
        [-1, 1].forEach((side) => {
          const bar = document.createElement('div');
          bar.className = 'plus-multiply-bar';
          bar.style.width = barWidth + 'px';
          bar.style.height = barHeight + 'px';
          canvas.appendChild(bar);
          const startX = side < 0 ? bracketLeftInnerX : bracketRightInnerX;
          const targetX = 960 + side * gap * i;
          const anim = lightAnimate(bar, [
            { left: startX + 'px', top: barTopStart + 'px', transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
            { left: targetX + 'px', top: barTopEnd + 'px', transform: 'translate(-50%, -50%) scale(1)', opacity: GRAY_OPACITY }
          ], opts);
          barAnims.push(anim);
          anim.finished.then(() => {
            anim.commitStyles();
            anim.cancel();
          });
        });
      }

      // 8 index numbers ("01".."08"), one at the midpoint of each of the
      // 8 gaps this row now has - bracket-to-bar1, bar-to-bar (x6), and
      // bar7-to-bracket. The 9 points along the row sit at 960+k*gap for
      // k=-4..4 (bracketLeft, the 7 bars, bracketRight - center bar is
      // k=0 by construction), so gap N's own midpoint is at
      // 960+(k+0.5)*gap for k=N-5 - i.e. label i's x is 960+(i-4.5)*gap.
      // Only appear once the bars block is actually done forming (not in
      // the same move), sized/centered on the bars' own settled line. 25%
      // smaller than that own-height-minus-10% base size - shrinking via
      // font-size rather than an added transform:scale() still anchors on
      // the label's own center, since .botonera-index is already
      // positioned with translate(-50%,-50%), unaffected by font-size.
      const indexFontSize = barHeight * 0.9 * 0.75;
      const INDEX_FADE_MS = 300 * MOTION_SCALE;
      Promise.allSettled(barAnims.map((a) => a.finished)).then(() => {
        for (let i = 1; i <= 8; i++) {
          const label = document.createElement('div');
          label.className = 'botonera-index';
          label.textContent = String(i).padStart(2, '0');
          label.style.fontSize = indexFontSize + 'px';
          label.style.left = (960 + (i - 4.5) * gap) + 'px';
          label.style.top = barTopEnd + 'px';
          canvas.appendChild(label);
          // each button's own hit/hover area: 10% past the number's own
          // measured width on each side (offsetWidth here is still its
          // natural, shrink-to-fit size - width isn't set yet), height
          // pinned to the bars' own height rather than a similar 10% pad
          const numberWidth = label.offsetWidth;
          label.style.width = (numberWidth * 1.2) + 'px';
          label.style.height = barHeight + 'px';
          const anim = label.animate([{ opacity: 0 }, { opacity: GRAY_OPACITY }], { duration: INDEX_FADE_MS, easing: 'ease', fill: 'forwards' });
          anim.finished.then(() => {
            anim.commitStyles();
            anim.cancel();
          });
        }
      });
    }

    // the back-triangle's own undo of the whole collapse/multiply
    // sequence (see reverseFromWidened): unlike the forward sequence
    // (each stage deliberately gated on the last one finishing), this
    // fires everything at once - the extra bars get shoved out toward
    // their own bracket (read as the reforming text "pushing" them out of
    // the way) and vanish right at it, the brackets un-spread, the "|"
    // reforms into "+", and "Video Editor"/"motion graphics" slide back
    // in immediately, all in parallel.
    function restoreCenterTagline() {
      const plus = document.getElementById('tagline-plus');
      const armH = plus.querySelector('.plus-arm-h');
      const armV = plus.querySelector('.plus-arm-v');

      const canvasScaleNow = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      const canvasLeftPx = canvas.getBoundingClientRect().left;
      const bracketLeft = document.getElementById('bracket-left');
      const bracketRight = document.getElementById('bracket-right');
      const bracketLeftInnerX = (bracketLeft.getBoundingClientRect().right - canvasLeftPx) / canvasScaleNow;
      const bracketRightInnerX = (bracketRight.getBoundingClientRect().left - canvasLeftPx) / canvasScaleNow;

      const PUSH_MS = BOTONERA_UNFORM_MS;
      // each extra bar gets pushed out toward its own side's bracket -
      // that inner edge is the limit where it vanishes - fading out as it
      // gets there, rather than retreating back into the center
      document.querySelectorAll('.plus-multiply-bar').forEach((bar) => {
        const currentX = parseFloat(bar.style.left);
        const targetX = currentX < 960 ? bracketLeftInnerX : bracketRightInnerX;
        const anim = lightAnimate(bar, [
          { left: currentX + 'px', opacity: GRAY_OPACITY },
          { left: targetX + 'px', opacity: 0 }
        ], { duration: PUSH_MS, easing: 'ease', fill: 'forwards' });
        anim.finished.then(() => bar.remove());
      });

      // index numbers just fade out in place (nothing to push toward -
      // they don't belong to either side) and get removed
      document.querySelectorAll('.botonera-index').forEach((label) => {
        const anim = label.animate([{ opacity: GRAY_OPACITY }, { opacity: 0 }], { duration: PUSH_MS, easing: 'ease', fill: 'forwards' });
        anim.finished.then(() => label.remove());
      });

      // brackets un-spread and rise back up to before multiplyPlusIntoBars
      // moved them, crossfading back from the thin stand-ins (currently
      // at GRAY_OPACITY) to the bold originals (currently invisible) -
      // same beat as the bars vanishing
      if (bracketLeftPreSpread !== null && bracketRightPreSpread !== null && bracketTopPreDescend !== null) {
        const bracketOpts = { duration: PUSH_MS, easing: 'ease', fill: 'forwards' };
        const bracketLeftThin = document.getElementById('bracket-left-thin');
        const bracketRightThin = document.getElementById('bracket-right-thin');
        const blAnim = lightAnimate(bracketLeft, [
          { left: bracketLeft.style.left, top: bracketLeft.style.top, opacity: 0 },
          { left: bracketLeftPreSpread + 'px', top: bracketTopPreDescend + 'px', opacity: 1 }
        ], bracketOpts);
        const brAnim = lightAnimate(bracketRight, [
          { left: bracketRight.style.left, top: bracketRight.style.top, opacity: 0 },
          { left: bracketRightPreSpread + 'px', top: bracketTopPreDescend + 'px', opacity: 1 }
        ], bracketOpts);
        const blThinAnim = lightAnimate(bracketLeftThin, [
          { left: bracketLeftThin.style.left, top: bracketLeftThin.style.top, opacity: GRAY_OPACITY },
          { left: bracketLeftPreSpread + 'px', top: bracketTopPreDescend + 'px', opacity: 0 }
        ], bracketOpts);
        const brThinAnim = lightAnimate(bracketRightThin, [
          { left: bracketRightThin.style.left, top: bracketRightThin.style.top, opacity: GRAY_OPACITY },
          { left: bracketRightPreSpread + 'px', top: bracketTopPreDescend + 'px', opacity: 0 }
        ], bracketOpts);
        [blAnim, brAnim, blThinAnim, brThinAnim].forEach((a) => a.finished.then(() => { a.commitStyles(); a.cancel(); }));
        bracketLeftPreSpread = null;
        bracketRightPreSpread = null;
        bracketTopPreDescend = null;
      }

      // center bar/"+" back to solid black and its own resting height,
      // and back up from the 10vh drop - same beat
      const plusRestoreOpts = { duration: PUSH_MS, easing: 'ease', fill: 'forwards' };
      const plusColorAnim = lightAnimate(plus, [
        { top: plus.style.top, opacity: GRAY_OPACITY },
        { top: (plusTopPreDescend !== null ? plusTopPreDescend : parseFloat(plus.style.top)) + 'px', opacity: 1 }
      ], plusRestoreOpts);
      plusColorAnim.finished.then(() => { plusColorAnim.commitStyles(); plusColorAnim.cancel(); });
      plusTopPreDescend = null;
      // and back to its own resting thickness from THIN_BAR_WIDTH
      if (armVWidthPreThin !== null) {
        const armVRestoreAnim = lightAnimate(armV, [
          { width: armV.style.width, marginLeft: armV.style.marginLeft },
          { width: armVWidthPreThin + 'px', marginLeft: (-armVWidthPreThin / 2) + 'px' }
        ], plusRestoreOpts);
        armVRestoreAnim.finished.then(() => { armVRestoreAnim.commitStyles(); armVRestoreAnim.cancel(); });
        armVWidthPreThin = null;
      }

      // "|" reforms into "+" right away too, same WAAPI approach as
      // collapseCenterTagline (not classList.toggle + the CSS transition's
      // own fixed 1.4s) so the arms finish growing/shortening back in
      // BOTONERA_UNFORM_MS - the same span the bars/brackets take to
      // un-form. .spin is guaranteed "on" here (multiplyPlusIntoBars is
      // the only thing that ever adds it, and it always fully finishes
      // before the back button becomes clickable), so no live-shape check
      // is needed the way collapseCenterTagline's forward version has to.
      const armReformOpts = { duration: BOTONERA_UNFORM_MS, easing: 'ease', fill: 'forwards' };
      const armHReformAnim = armH.animate([{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], armReformOpts);
      const armVReformAnim = armV.animate([{ transform: 'scaleY(1.5)' }, { transform: 'scaleY(1)' }], armReformOpts);
      plus.classList.remove('spin'); // hands off to the base (unspun) rule's own matching value once these finish
      Promise.allSettled([armHReformAnim.finished, armVReformAnim.finished]).then(() => {
        [[armHReformAnim, armH], [armVReformAnim, armV]].forEach(([a, el]) => {
          a.cancel();
          el.style.transform = '';
        });
        startSpinLoop();
      });

      // "Video Editor"/"motion graphics" slide back in immediately too -
      // same swap-slide playCenterTagline's own reveal uses, just faster -
      // and rise back up from the 3vh drop collapseCenterTagline gave them
      const left = document.getElementById('tagline-left');
      const right = document.getElementById('tagline-right');
      const swapOpts = { duration: 500 * MOTION_SCALE, easing: 'ease', fill: 'forwards' };
      left.style.right = 'auto';
      const taglineDescendPx = (window.innerHeight * 0.03) / canvasScaleNow;
      const taglineTopDescended = parseFloat(getComputedStyle(left).top);
      const taglineTopRest = taglineTopDescended - taglineDescendPx;
      const leftAnim = lightAnimate(left, [
        { left: taglineRightFinalX + 'px', top: taglineTopDescended + 'px' },
        { left: taglineLeftFinalX + 'px', top: taglineTopRest + 'px' }
      ], swapOpts);
      const rightAnim = lightAnimate(right, [
        { left: taglineLeftFinalX + 'px', top: taglineTopDescended + 'px', clipPath: 'inset(0 100% -20px 0)' },
        { left: taglineRightFinalX + 'px', top: taglineTopRest + 'px', clipPath: 'inset(0 0% -20px 0)' }
      ], swapOpts);
      left.classList.add('visible');
      right.classList.add('visible');
      Promise.allSettled([leftAnim.finished, rightAnim.finished]).then(() => {
        commitAndCancel(left, leftAnim);
        commitAndCancel(right, rightAnim);
      });
    }

    // fdo_invloop.webm: fades in front of the rect (behind the brackets/
    // text/tagline - see its position in the DOM), called directly from
    // playCenterTagline right as "Video Editor"/"motion graphics" start
    // sliding out to their sides. Sized/positioned to the overshoot box
    // it's sitting in at that point (see step===0's press.finished
    // handler), not the smaller final rest size the rect settles into on
    // the second click. muted+loop on the element itself is what makes play()
    // reliable here without a fresh user gesture of its own. The webm
    // itself already carries a real alpha channel (VP9 alpha_mode, not a
    // chroma-key hack) - nothing here paints a background under it, so
    // that transparency composites naturally over the rect's white fill.
    function showBgVideo() {
      const video = document.getElementById('bg-video');
      video.currentTime = 0;
      video.play();
      video.classList.add('visible');
    }

    function hideBgVideo() {
      const video = document.getElementById('bg-video');
      video.classList.remove('visible');
      video.pause();
      video.currentTime = 0;
      // clears the reveal shift advanceFromOvershoot may have left in
      // place (reached via clicking the rect itself in step 2, bypassing
      // reverseFromWidened's own undo of that same transform) - falls
      // back to .visible's own scale(1) (or the base scale(0) once
      // .visible itself is removed above)
      video.style.transform = '';
    }

    function resetCenterTagline() {
      if (taglineTimeoutId) {
        clearTimeout(taglineTimeoutId);
        taglineTimeoutId = null;
      }
      if (plusSpinTimeoutId) {
        clearTimeout(plusSpinTimeoutId);
        plusSpinTimeoutId = null;
      }
      if (plusLoopIntervalId) {
        clearInterval(plusLoopIntervalId);
        plusLoopIntervalId = null;
      }
      plusSpinTurns = 0;
      taglineLeftFinalX = null;
      taglineRightFinalX = null;
      bracketLeftPreSpread = null;
      bracketRightPreSpread = null;
      bracketTopPreDescend = null;
      plusTopPreDescend = null;
      armVWidthPreThin = null;
      [leftSwapAnim, rightSwapAnim].forEach((a) => { if (a) a.cancel(); });
      leftSwapAnim = null;
      rightSwapAnim = null;
      // removes whatever multiplyPlusIntoBars generated, if the sequence
      // got that far before this reset, and clears the inline left/top it
      // may have left on the brackets (resetLogoDesarme, called right
      // before this in goHome, already clears left - redundant when both
      // run, but this is the one that matters if resetCenterTagline is
      // ever called on its own)
      document.querySelectorAll('.plus-multiply-bar').forEach((bar) => bar.remove());
      document.querySelectorAll('.botonera-index').forEach((label) => label.remove());
      [
        document.getElementById('bracket-left'), document.getElementById('bracket-right'),
        document.getElementById('bracket-left-thin'), document.getElementById('bracket-right-thin')
      ].forEach((el) => {
        el.style.left = '';
        el.style.top = '';
        // clears the 60% gray/crossfade multiplyPlusIntoBars may have
        // left mid-way on the brackets (the bars themselves don't need
        // this - they're removed above regardless of what state they
        // were in) - the thin stand-ins fall back to their own CSS
        // opacity:0 default, keeping them hidden until the next cycle
        el.style.opacity = '';
      });
      ['tagline-plus', 'tagline-left', 'tagline-right'].forEach((id) => {
        const el = document.getElementById(id);
        el.classList.remove('visible');
        el.classList.remove('spin');
        el.style.fontSize = '';
      });
      const tl = document.getElementById('tagline-left');
      tl.style.right = '';
      tl.style.left = '';
      tl.style.letterSpacing = '';
      const tr = document.getElementById('tagline-right');
      tr.style.left = '';
      tr.style.clipPath = '';
      const plusEl = document.getElementById('tagline-plus');
      plusEl.style.width = '';
      plusEl.style.height = '';
      plusEl.style.transform = '';
      plusEl.style.opacity = '';
      plusEl.style.top = '';
      [plusEl.querySelector('.plus-arm-h'), plusEl.querySelector('.plus-arm-v')].forEach((arm) => {
        arm.style.width = '';
        arm.style.height = '';
        arm.style.marginLeft = '';
        arm.style.marginTop = '';
        // clears whatever collapseCenterTagline/restoreCenterTagline's own
        // WAAPI shape animations may have left mid-flight
        arm.style.transform = '';
      });
    }

    // cancels any in-flight logo sync and drops the elements back to their
    // CSS-authored rest position (frame 100), so the next click on the
    // rect replays the disassemble from the start instead of from
    // wherever it happened to be interrupted
    function resetLogoDesarme() {
      if (logoRafId) {
        cancelAnimationFrame(logoRafId);
        logoRafId = null;
      }
      [document.getElementById('bracket-left'), document.getElementById('bracket-right'), document.getElementById('logo-text')]
        .forEach((el) => {
          el.style.left = '';
          el.style.top = '';
        });
      const txt = document.getElementById('logo-text');
      txt.style.width = '';
      txt.style.height = '';
      txt.style.opacity = '';
      const sq = document.getElementById('blink-square');
      sq.classList.remove('visible');
      sq.classList.remove('triangle');
      sq.classList.remove('back');
      sq.style.left = '';
      sq.style.top = '';
      const hz = document.getElementById('blink-square-hover-zone');
      hz.classList.remove('visible');
      hz.style.left = '';
      hz.style.top = '';
      const line = document.getElementById('header-line');
      line.classList.remove('visible');
      line.style.top = '';
      line.style.width = '';
      const fill = document.getElementById('header-fill');
      fill.classList.remove('visible');
      fill.style.top = '';
      fill.style.height = '';
      fill.style.width = '';
      fill.style.borderRadius = '';
      const txtWhite = document.getElementById('logo-text-white');
      txtWhite.classList.remove('visible');
      txtWhite.style.left = '';
      txtWhite.style.top = '';
      txtWhite.style.width = '';
      txtWhite.style.height = '';
      txtWhite.style.clipPath = '';
    }
  </script>
</body>
</html>
