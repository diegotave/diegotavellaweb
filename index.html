<!DOCTYPE html>
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Landing</title>
<style>
  /* opts this document into cross-document view transitions (Chromium
     only, as of this writing - Safari/Firefox just fall back to a plain
     navigation, no code needed for that). Paired with the matching
     view-transition-name declarations below on #rect/#rect2/#blink-square
     and the identical rule in contact.html - since both pages render that
     trio at the exact same size/position/color in this instance (see
     contact.html's own layout() math, copied from this page's overshoot
     geometry), the browser treats them as one continuous element crossing
     from this document to that one instead of cutting on navigation. */
  @view-transition {
    navigation: auto;
  }
  /* the browser's own DEFAULT for a cross-document transition crossfades
     the ENTIRE page (an implicit ::view-transition-*(root) pair) on top
     of whatever the named elements below are doing - that whole-page
     fade is what read as a flash on arrival at index.html even with
     #rect2's own position/size pixel-identical on both sides. Turned off
     here (mirrored in contact.html). */
  ::view-transition-image-pair(root) {
    isolation: auto;
  }
  ::view-transition-old(root),
  ::view-transition-new(root) {
    animation: none;
    mix-blend-mode: normal;
  }
  /* the named groups (byn-rect/byn-rect2/byn-rect-frame/byn-blink-square)
     default to their OWN 0.25s crossfade too, on top of whatever
     position/size interpolation they need (none here - old/new match
     exactly on both) - mix-blend-mode: plus-lighter is what the browser
     blends that crossfade with by default, and it's what read as a gray
     flicker over #rect2 (celeste): the old (contact.html) and new
     (index.html) captures are the same color but never bit-for-bit
     identical pixels (separate documents, separate rasterization passes
     at whatever the canvas's own non-integer scale() happens to be), and
     plus-lighter ADDS mismatched pixels together instead of just
     replacing them, washing the overlap out toward white/gray for the
     crossfade's duration. Turning the animation off swaps old->new in a
     single frame instead - correct here since nothing actually needs to
     interpolate. #rect went through two other states before landing
     here: named, then unnamed once naming exposed it to this exact same
     mismatch (with no color/opacity trick to mask it, it read as the
     border itself thickening for a frame instead of a gray wash) -
     folded into the generic root capture instead, which then turned out
     to have its OWN problem: root waits on the WHOLE new page's
     readiness, which is slower on index.html (video, images, far more
     content than contact.html), so #rect's border sat there unpainted
     for a beat right on arrival - worse than the thickening it was
     trying to avoid. Named again now that animation:none is applied
     directly to byn-rect below (the fix that was actually missing the
     first time it was named) - that's what stops the thickening,
     independent of whichever group #rect ends up folded into, so there's
     no more reason to hide it inside root and inherit root's own slower
     readiness. */
  ::view-transition-group(byn-rect),
  ::view-transition-group(byn-rect2),
  ::view-transition-group(byn-rect-frame),
  ::view-transition-group(byn-blink-square) {
    animation: none;
  }
  ::view-transition-old(byn-rect),
  ::view-transition-new(byn-rect),
  ::view-transition-old(byn-rect2),
  ::view-transition-new(byn-rect2),
  ::view-transition-old(byn-rect-frame),
  ::view-transition-new(byn-rect-frame),
  ::view-transition-old(byn-blink-square),
  ::view-transition-new(byn-blink-square) {
    animation: none;
    mix-blend-mode: normal;
  }
  /* portrait ("vertical version") only: swiping up from step 1 to
     menu-portrait.html PUSHES the whole screen up and off, instead of
     the plain single-frame swap above (that default stays exactly as it
     is - still what the Contact/Home flow uses, completely unaffected,
     since it never sets this class). Scoped to html.push-up-transition,
     added by the swipe-up handler right before navigating there
     specifically, so it can never bleed into any other navigation out of
     this page. menu-portrait.html deliberately doesn't reuse byn-rect/
     byn-rect2/byn-rect-frame/byn-blink-square at all (see its own CSS
     comment) - from THIS page's side, once there's no same-named partner
     in the new document, each becomes its own independent "exiting"
     image instead of morphing into a match. Pushing all four (root
     included) with the exact same duration/easing/keyframes is what
     reads as the whole rect/hueco/calle/blink-square sliding away as one
     block instead of four separately-timed layers. */
  html.push-up-transition ::view-transition-old(root),
  html.push-up-transition ::view-transition-old(byn-rect),
  html.push-up-transition ::view-transition-old(byn-rect2),
  html.push-up-transition ::view-transition-old(byn-rect-frame),
  html.push-up-transition ::view-transition-old(byn-blink-square) {
    animation: push-root-out 0.42s cubic-bezier(0.4, 0, 0.2, 1) both;
    mix-blend-mode: normal;
  }
  @keyframes push-root-out {
    to { transform: translateY(-100%); }
  }
  /* the reverse trip: menu-portrait.html's own swipe-down navigates back
     here with #from-menu-portrait, which the early <script> right after
     this stylesheet (before <body>) turns into this same
     html.push-down-transition class, set on THIS document before the
     browser ever needs to style the incoming half of the transition (see
     that script's own comment for why it has to be that early). #rect/
     #rect2/#rect-frame/#blink-square are all "entering-only" for this
     specific transition too, same reasoning as the up-push above but
     mirrored: menu-portrait.html doesn't carry byn-rect/byn-rect2/
     byn-rect-frame on its own elements (see its CSS), so there's no
     same-named partner in the OLD document for any of these four to
     match against - they just enter from above as root's own
     (arriving) block. */
  html.push-down-transition ::view-transition-new(root),
  html.push-down-transition ::view-transition-new(byn-rect),
  html.push-down-transition ::view-transition-new(byn-rect2),
  html.push-down-transition ::view-transition-new(byn-rect-frame),
  html.push-down-transition ::view-transition-new(byn-blink-square) {
    animation: push-root-in-down 0.42s cubic-bezier(0.4, 0, 0.2, 1) both;
    mix-blend-mode: normal;
  }
  @keyframes push-root-in-down {
    from { transform: translateY(-100%); }
  }

  /* multipliers for the password gate and the initial "logo desarme"
     mark (brackets + Diego Tavella wordmark) - stay at 1 (no-op) in
     landscape; set to LOGO_PORTRAIT_SCALE/PASSWORD_PORTRAIT_SCALE by
     fitCanvas() in portrait, so both read 150% bigger there. Only ever
     read by rules that are visible before the first click on #rect -
     onRectClick's own press hard-resets bracket-left/right/logo-text to
     a literal scale(1) inline style regardless of these vars, so nothing
     past that point is affected. */
  :root {
    --logo-scale: 1;
    --password-scale: 1;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    /* always white, all the way to the viewport's own edges - not just
       behind the rect, so the page never reads as a white card floating
       on some other background. Stays white through every state; only
       the rect's own fill/stroke and the logo's color flip (see .rect
       and the press handling in the script). */
    background: #fff;
  }

  /* full-screen viewport that centers a fixed 1920x1080 canvas - the
     canvas itself is scaled uniformly (via JS, transform: scale()) to
     fit whatever the real viewport is, so every element placed inside
     it can use the exact same px coordinates as the 1920x1080 After
     Effects comp this animation was exported from, with no per-element
     unit conversion needed */
  .viewport {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    /* recedes the whole scene behind the video overlay for videos
       whose own frame doesn't fill the screen (cropped/square aspect -
       see RECEDE on the relevant BOTONERA_VIDEOS entries), so there's
       nothing to peek through the backdrop around a small frame.
       transform+opacity only - both compositor-only, no layout cost
       regardless of device (same reasoning as MOTION_SCALE/
       lightAnimate above). Set on .viewport rather than .canvas since
       .canvas's own transform is already owned by fitCanvas()'s inline
       style and would fight a CSS one here. */
    transition: transform 0.4s ease, opacity 0.4s ease;
  }
  .viewport.receded {
    transform: scale(0.82);
    opacity: 0;
  }

  .canvas {
    position: relative;
    width: 1920px;
    height: 1080px;
    flex: none;
    /* the whole comp is almost always scaled DOWN by fitCanvas() below
       (1920x1080 rarely fits inside the real viewport as-is) - without
       will-change, both Chrome and Firefox can rasterize this subtree at
       its native 1x size first and then resample that bitmap down to fit
       the transform, which is what reads as jagged/soft edges on
       border-radius corners and thin/light text (worst on Firefox, but
       visible in Chrome too on fine detail). will-change promotes this to
       its own compositing layer, which both engines rasterize against the
       actual on-screen (post-scale) resolution instead. */
    will-change: transform;
  }

  /* plain, permanent, solid white backdrop - deliberately the FIRST thing
     in .canvas (behind literally everything) and carrying no view-
     transition-name, so it's never captured/swapped/faded as part of the
     cross-document transition at all: it's just always there, the exact
     same flat white on both documents, immune to whatever old/new
     timing hiccup causes #rect-frame's own white occlusion (or anything
     else) to blink out for a frame right as a transition settles (seen
     live on arrival at index.html - the gap read as black for an
     instant instead of white). In normal use this changes nothing (body
     is already white everywhere), it's purely a worst-case fallback
     layer for exactly that gap. */
  #canvas-backdrop {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    background: #fff;
    pointer-events: none;
  }

  /* wraps #rect2/#rect2-black - exactly the same 1920x1080 coordinate
     space as .canvas itself (so #rect2/#rect2-black's own left:960px/
     top:539.5px absolute positioning still resolves exactly as before,
     completely unaffected by this wrapper existing), no clip-path by
     default so every OTHER existing use of #rect2 (hover preview,
     press.finished's grow, advanceFromOvershoot/reverseFromWidened's
     widen/shrink) behaves identically to before this wrapper existed.
     Only playContactTransition ever sets a clip-path here, matching
     #rect's own live box (round-tripped through inset()'s own `round`
     argument for its corner radius) - the same "disappears exactly at
     rect's edge" treatment #bg-video-mask's own overflow:hidden already
     gives bg-video, applied here since #rect2/#rect2-black are siblings
     of #rect, not its children, so nothing clips them on its own.
     pointer-events:none since thkinteraction-wise goes
     through #rect-hover-zone), so this costs nothing and matches
     #logo-text-mask's own guard below (see its comment for why that one
     is load-bearing, not just precautionary). */
  #rect2-mask {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    pointer-events: none;
  }

  /* permanent white "calle" occlusion, kept in sync by syncRectMasks
     (see the script) - a plain box-shadow (non-inset ones only ever paint
     OUTSIDE their own border-radius curve, never inside it) with a huge,
     blur-free spread reads as "solid white everywhere outside this box's
     silhouette, a clean see-through hole exactly inside it", rounded
     corners included for free. Mirrors whichever of #rect2/#rect2-black
     is actually visible - width/height/borderRadius AND top, not just the
     first three (top defaults to 539.5px below, same as #rect's own fixed
     center, but the widened/later-step instance moves rect2's own top
     down as the header eats into it from above - missing that shift here
     is what used to read as "top gap gone, bottom gap doubled": both
     elements stayed centered on the old point while rect2 itself had
     already moved). rect2/rect2-black's own box is ALREADY correctly
     gapped on every side by design (see advanceFromOvershoot's own
     rect2Gap) - once the position is right, mirroring it verbatim is
     enough, no separate margin math needed. Sits right before #rect in
     the DOM (see the markup) - deliberately behind #rect, not in front
     of it: #rect's own border and its background both used to be fused
     with its bg-video child into one stacking/paint unit (no DOM position
     could sit "in front of the globe but behind #rect's own border"),
     which is exactly why bg-video got pulled out into its own #bg-video-
     mask sibling instead (see that element's own CSS comment) - with the
     globe no longer inside #rect, this box can sit behind #rect
     (protecting its border) while still sitting in front of #bg-video-
     mask (still able to occlude the globe). #header-fill/"Diego Tavella"
     were tried here too at one point (grouped in a wrapper to dodge the
     same fused-stacking problem) but #rect's own background is OPAQUE in
     several states (the idle button, at least) - not just its bg-video
     child - so anything moved to sit behind #rect for masking purposes
     goes invisible in those states instead. They're back to their
     original spot, after #rect, and can still paint over this box-shadow
     wherever they extend past rect2/rect2-black's own edge - a real but
     much smaller-scoped case than the globe/border one this box exists
     for. transparent fill (not white) so #rect's own live box still
     shows through unaffected where this box doesn't apply to it anyway.
     pointer-events:none for the same reason #logo-text-mask needs it -
     see that comment. */
  #rect-frame {
    position: absolute;
    left: 960px;
    top: 539.5px;
    /* var(--logo-scale) here too - syncRectMasks (script) mirrors this
       box's width/height off rect2's getComputedStyle().width, which is
       the pre-transform LAYOUT width, not rect2's actual bigger rendered
       size in portrait. Without matching that same scale here, this
       box's own box-shadow "hole" (0 0 0 3000px #fff, painting solid
       white everywhere outside it - see the stylesheet comment above
       #rect2-mask) renders at the unscaled size, whitewashing most of
       the visually-2.5x rect2 and leaving only a small, wrongly-centered
       patch of celeste showing through - reset alongside #rect/#rect2/
       #rect-hover-zone in onRectClick since syncRectMasks itself never
       touches this transform, only width/height/top/borderRadius/
       boxShadow. */
    transform: translate(-50%, -50%) scale(var(--logo-scale));
    background: transparent;
    pointer-events: none;
    view-transition-name: byn-rect-frame;
  }

  /* #rect2: experimental second rect, solid cyan-ish fill (#80dfff), no
     stroke - sits BEHIND #rect (first in the DOM, before even
     #rect-hover-zone). Shows through rect's own now-transparent fill
     (see press.finished). #onda-video is a child of THIS element (see
     below) - onda-video's own bounds/crop/rounding track rect2's live
     box, not rect's, so overflow:hidden here does for it what #bg-video-
     mask's own overflow:hidden does for bg-video. "Born" on the very
     first hover over the
     un-pressed button (see setButtonHover) sized a fixed few px past
     rect's own (tiny, idle) edges at that moment, sticking out all
     around it - then held at that exact size while rect grows all the
     way to its square overshoot, so rect's own size overtakes it partway
     through, ending up inset within rect instead of sticking out past
     it. Test-only per the prompt this was built from - not yet wired
     into any of the later steps/reversals. */
  #rect2 {
    position: absolute;
    left: 960px;
    top: 539.5px;
    /* var(--logo-scale) here too - #rect2 is "born" on hover, before the
       first click, sized off #rect's own live (unscaled) computed width
       (see setButtonHover) - without matching that hover-preview would
       render at the normal small size while the button under it is
       already 2.5x in portrait. Reset alongside #rect/#rect-hover-zone
       in onRectClick (JS never otherwise touches this transform in the
       idle->grow path - only enterFromContact does, a separate flow). */
    transform: translate(-50%, -50%) scale(var(--logo-scale));
    background: #80dfff; /* lighter, more blue/less green than plain cyan */
    overflow: hidden;
    contain: layout paint;
    display: none;
    /* default holder of byn-rect2 - see #rect2-black's own comment on why
       this moved here: enterFromContact's own reassignment can't be
       trusted to beat index.html's first paint, so the arrival-correct
       state (celeste visible) now has to be the CSS default already,
       not something JS has to fix up in time */
    view-transition-name: byn-rect2;
  }
  #rect2.visible {
    display: block;
  }
  /* #rect2's own black stand-in - see playContactTransition in the
     script. Clicking "Contact" slides #rect2 (celeste) down and out while
     this identically-sized/positioned element slides down INTO its spot
     from just above, landing exactly where #rect2 was - a "push" swap,
     not a color animation on one element. The arrival direction (from
     contact.html's "Home" link) is handled differently now - see
     enterFromContact/playHomeTransition (contact.html) - #rect2-black
     plays no part in it at all, #rect2 (celeste) arrives already settled.
     No view-transition-name by default (see #rect2's own comment on why
     that moved there) - the contact-button click handler below moves
     byn-rect2 over to THIS element only at the moment of the forward
     departure, right before navigating away, which is early enough to
     be safe (it's on the OLD page, well before unload) unlike trying to
     do the reverse assignment on arrival here. */
  #rect2-black {
    position: absolute;
    left: 960px;
    top: 539.5px;
    transform: translate(-50%, -50%);
    background: #000;
    display: none;
  }
  #rect2-black.visible {
    display: block;
  }
  /* botonera hover preview: a random mid-video 5s clip (see
     playBotoneraPreview), keyed through assets/images/crt-texture.svg as
     an alpha matte (mask-image defaults to an image source's own alpha
     channel, not luminance, so the texture's black-on-transparent tile
     works directly as a matte - no separate luminance step needed) so it
     reads as footage glimpsed through a scanned CRT screen rather than a
     plain video rectangle. Hidden (opacity 0) whenever nothing's hovered,
     so the celeste rect stays clean the rest of the time - see
     playBotoneraPreview/stopBotoneraPreview. 40% opacity even while
     showing, so it's a hint rather than a full video takeover. Same
     width/height:100% + rect2's own overflow:hidden tracking as
     onda-video/bg-video off their own parents. */
  #botonera-preview-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    pointer-events: none;
    filter: grayscale(1);
    -webkit-mask-image: url('assets/images/crt-texture.svg');
    mask-image: url('assets/images/crt-texture.svg');
    -webkit-mask-repeat: repeat;
    mask-repeat: repeat;
    -webkit-mask-size: 64px 64px;
    mask-size: 64px 64px;
    transition: opacity 0.2s ease;
  }
  #botonera-preview-video.visible {
    opacity: 0.2;
  }

  /* bg-video's own wrapper - used to live directly inside .rect and rely
     on its overflow:hidden/border-radius for clipping "for free", but
     that fused #rect's own border with its child's paint into one
     stacking unit, with no DOM position able to sit "in front of the
     globe but behind #rect's own border" once #rect-frame also needed to
     mask the globe without covering that border (see #rect-frame's own
     CSS comment for the full reasoning). Pulling bg-video out into this
     plain sibling - positioned identically to #rect, with the same
     overflow:hidden clipping - lets #rect-frame sit between the two:
     behind #rect (protecting its border) but in front of this mask
     (able to occlude the globe same as everything else). Kept in sync to
     #rect's own live box every frame by syncRectMasks (renamed from
     its rect2-only origins - see the script), since #rect's box changes
     across WAAPI animations (the intro grow, hover preview, widen/
     reverse) that can't be caught at a few fixed checkpoints the way
     rect2's own simpler lifecycle could. */
  #bg-video-mask {
    position: absolute;
    left: 960px;
    top: 539.5px;
    transform: translate(-50%, -50%);
    overflow: hidden;
    pointer-events: none;
    contain: layout paint;
  }

  /* Rectangulo Central: AE shape layer "RECTANGULO CENTRAL STROKE 2" -
     2px stroke, fill disabled (empty interior), layer Position fixed,
     Scale/Position never animated - only the rect's own Size and
     Roundness are keyframed, so it's placed here anchored on its own
     center via translate(-50%,-50%) and grown/shrunk via
     width/height/border-radius (not transform:scale, so the 2px stroke
     stays a constant 2px instead of scaling with the box, same as in AE).
     Center is (960, 539.5) - the bracket mark's own true center (bracket
     bbox is 876-1044 x 487-592) - so the rest-state box gives it an
     equal 19.075px margin on all four sides. See RECT_CENTER_Y below,
     which the logo sync math reuses to stay consistent with wherever
     this box is actually centered. */
  .rect {
    position: absolute;
    left: 960px;
    top: 539.5px;
    /* grows in lockstep with --logo-scale (see #bracket-left etc.) so
       the black idle backdrop stays exactly under the bigger portrait
       logo mark instead of the ink spilling past it onto the white page
       - reset to a scale-less translate the instant the first press
       starts (see onRectClick), same moment bracket-left/right/logo-text
       snap back to scale(1). */
    transform: translate(-50%, -50%) scale(var(--logo-scale));
    /* view-transition-name: byn-rect - see the @view-transition CSS
       block's own comment up top for the back-and-forth on this: named,
       then unnamed (folded into root, which then turned out to wait on
       root's OWN readiness - the actual bug), now named again since that
       readiness gap didn't depend on this being unnamed after all. */
    view-transition-name: byn-rect;
    /* starts as a solid "button": 80%-black fill (#333, not pure #000 -
       see IDLE_BLACK below, shared with the two JS spots that restore
       this same idle look), 10% bigger than the 206.15x143.15 it settles
       to once pressed (see PRESS_SCALE in the script) - first click
       presses it down to that size and, once pressed, swaps fill to
       white and stroke to black (the page itself stays white always -
       only the rect/logo colors flip), right before the existing
       grow-to-overshoot animation takes over. Stroke is transparent by
       default before that first click - it only reveals white on hover
       (see #rect-hover-zone below), not shown outright. Stroke width is
       1.5px here (0.5px thinner than the 2px it becomes once pressed -
       see press.finished in the script) - only the pre-click button
       (idle or hovered) is this thin. */
    background: #333;
    border: 1.5px solid transparent;
    width: 226.765px;
    height: 157.465px;
    border-radius: 3px;
    cursor: pointer;
    transition: background-color 0.2s ease, border-color 0.2s ease;
    /* no children anymore - bg-video moved out to its own #bg-video-mask
       sibling (see its own CSS comment for why) - overflow:hidden kept
       here anyway in case anything else ever needs clipping to this box */
    overflow: hidden;
    /* this box's own width/height/border-radius are keyframed every
       frame for most of the intro (see buildStage in the script) while
       clipping two playing videos - layout containment stops that from
       forcing the browser to re-check layout of anything outside this
       box (it's absolutely positioned with a fixed left/top, so nothing
       outside legitimately depends on its size anyway), and paint
       containment scopes repaint to this box's own bounds instead of
       the full 1920x1080 .canvas layer it sits inside. Both are free -
       overflow:hidden already clips the same way contain:paint would. */
    contain: layout paint;
  }
  /* invisible hit-area, 10% bigger than the button in both dimensions
     and centered the same way, so hovering just outside the visible
     button edge still previews the pressed look - forwards its
     hover/click to #rect in the script (see setButtonHover), rather than
     duplicating the button logic here */
  #rect-hover-zone {
    position: absolute;
    left: 960px;
    top: 539.5px;
    transform: translate(-50%, -50%) scale(var(--logo-scale));
    width: 249.4415px;
    height: 173.2115px;
    cursor: pointer;
  }

  /* password gate: sits where the compact logo mark normally shows,
     replacing it until the password is entered - see the input handler
     in the script. #bracket-left/#bracket-right have nothing to do with
     this box any more (see their own .bracket-offstage comment) - they
     used to shrink down and frame the typed value directly, but that
     coupling is gone now: this is a plain, provisional password box on
     its own, and the brackets slide in from outside the rect afterward
     as a separate step. #password-gate itself is just a grouping div
     (not positioned) so unlockPassword can hide both children in one
     shot.
     "ENTER PASSWORD" sits OUTSIDE the button, above it (black text, on
     the white page - not white-on-black like the rest of this gate,
     since it's no longer over the black rect), width-matched to the
     rect's own 226.765px via letter-spacing (see matchPasswordLabelWidth
     in the script - the same technique playCenterTagline already uses to
     balance "Video Editor"/"motion graphics" against each other). */
  /* fixed-width (matched to the rect - see matchPasswordLabelWidth) clip
     box around the label itself, so its exit (see #password-label.exiting
     below) can blow its letter-spacing WAY out without spilling past the
     rect's own edges - text-align:center means the overflow clips evenly
     on both sides, reading as the text dissolving outward from its own
     middle rather than growing off to one side. */
  #password-label-clip {
    position: absolute;
    left: 960px;
    /* 451px = rect's own idle top edge (539.5 - 157.465/2 = 460.7675)
       minus a fixed ~9.77px gap - both baked into one constant at
       --logo-scale's landscape default of 1. #rect's idle top edge
       itself rises as --logo-scale grows it around its own (960,539.5)
       center (see .rect), so this has to track --logo-scale, not
       --password-scale, or the label gets left behind as a fixed y
       while the box's top edge rises past it - which is what made
       "ENTER PASSWORD" read as sitting inside the box instead of above
       it in portrait. calc(539.5px - 88.5px * var(--logo-scale))
       reduces to 451px exactly when --logo-scale is 1. */
    top: calc(539.5px - 88.5px * var(--logo-scale));
    transform-origin: 50% 100%;
    transform: translate(-50%, -100%) scale(var(--password-scale));
    overflow: hidden;
    text-align: center;
  }
  #password-label {
    display: inline-block;
    white-space: nowrap;
    color: #000;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 100;
    font-size: 18px;
    letter-spacing: 2px;
    user-select: none;
    transition: opacity 0.25s ease, letter-spacing 0.25s ease;
  }
  #password-label.exiting {
    opacity: 0;
    letter-spacing: 40px;
  }
  /* the typed value - a real (invisible) input for actual keystroke
     handling, with a visible mask span underneath standing in for what's
     shown (literal asterisks, not the native password dot) and a
     terminal-style blinking block cursor (same blink-square-flash
     steps(1,end) pattern as the button's own blink square, for one
     consistent "blinking" language across the page) rather than the
     native line caret, which is hidden (caret-color: transparent) in
     favor of this one. Fixed width (not sized to content) so it doesn't
     grow/shift as characters are typed - sized for "promo"'s own 5
     characters plus the cursor, with a little slack. Anchored on its
     bottom edge rather than centered, so the taller box only grows
     upward - keeps the same base while giving the cursor equal room to
     the bracket's own top/bottom (552.5 rather than the brackets' own
     notional 539.5+13 center - measured directly via
     getBoundingClientRect against the actual rendered bracket-left, not
     derived by hand, since the bracket PNG's own ink isn't perfectly
     centered in its declared box - see the 4px crop padding comment
     elsewhere in this file). Nudged left of the brackets' shared x=960 to
     sit closer to the left bracket (not centered between both - see the
     prompt this was built from) without touching it. Exits before the
     brackets normalize (see unlockPassword). */
  #password-value-wrap {
    position: absolute;
    left: 945px;
    top: 552.5px;
    transform-origin: 50% 100%;
    transform: translate(-50%, -100%) scale(var(--password-scale));
    width: 76px;
    height: 26px;
    display: flex;
    align-items: center;
    transition: opacity 0.25s ease;
  }
  /* macOS-style wrong-password shake: several quick back-and-forth
     oscillations rather than a single wiggle, bigger amplitude too (9px
     vs the original 6px) - see SHAKE_MS in the script, which the
     asterisk-clearing timeout matches so they stay visible for the whole
     shake instead of vanishing the instant it starts. */
  #password-value-wrap.shake {
    animation: password-shake 0.4s ease;
  }
  @keyframes password-shake {
    10%, 30%, 50%, 70%, 90% { transform: translate(calc(-50% - 9px), -100%) scale(var(--password-scale)); }
    20%, 40%, 60%, 80% { transform: translate(calc(-50% + 9px), -100%) scale(var(--password-scale)); }
  }
  #password-value-wrap.exiting {
    opacity: 0;
  }
  #password-mask {
    color: #fff;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 16px;
    letter-spacing: 3px;
    white-space: pre;
  }
  #password-cursor {
    width: 8px;
    height: 15px;
    background: #fff;
    margin-left: 2px;
    animation: blink-square-flash 0.6s steps(1, end) infinite;
  }
  #password-input {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    border: none;
    outline: none;
    padding: 0;
    margin: 0;
    color: transparent;
    caret-color: transparent;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 16px;
    letter-spacing: 3px;
  }
  /* single shared window (unlike the tagline's own two separate windows
     above) - the exact interior rectangle the brackets frame, i.e.
     #logo-text's own box (895,504) to (1026,576). Same fixed-window
     mechanic as "Video Editor"/"motion graphics": the window itself
     never moves, so a sliding element is only visible for whatever part
     of it currently overlaps this rectangle - one shared window here
     instead of two since both halves land in the same place, they just
     arrive from opposite sides. */
  /* insets expressed relative to the window's own center (960.5, 540 -
     which is also .canvas's own vertical center, hence top/bottom
     sharing one formula) so scaling by --logo-scale grows the window
     around that fixed center instead of just one edge - matches
     #text-diego-half/#text-tavella-half's own scale(var(--logo-scale))
     below, so the enlarged portrait halves don't get clipped by a
     window still sized for the landscape (var=1) glyph. */
  #logo-text-window {
    clip-path: inset(
      calc(540px - 36px * var(--logo-scale))
      calc(959.5px - 65.5px * var(--logo-scale))
      calc(540px - 36px * var(--logo-scale))
      calc(960.5px - 65.5px * var(--logo-scale))
    );
  }
  /* "Diego"/"Tavella" split entrance: two copies of the same text.png
     (there's no separate asset per word - see the script), each cropped
     to just its own half via clip-path (this is which half of the image
     each one is, independent of the window above) - "Diego" (the top
     half) slides in from the left, "Tavella" (the bottom half) slides in
     from the right, both landing at translateX(0) exactly on #logo-text's
     own default left/top/width/height, so the handoff to the real
     element is a no-op swap. filter: invert(1) matches #logo-text's own
     treatment (black ink -> white against the black button) - without it
     these read as black ink the whole time they're sliding, only
     flipping to white at the handoff, which looks like a color change
     rather than the reveal it's supposed to be. No opacity fade here
     (see the swap-slide comment in playCenterTagline for why) -
     #logo-text-window's clip-path is what actually governs visibility
     while these are off to the side. Start position is comfortably past
     the OTHER bracket's own rest position (872-895 for bracket-left,
     1026-1048 for bracket-right) - Β±190 clears either one's box by
     ~35-40px, not just past the window's own (895-1026) edge - so both
     visibly start beyond the brackets themselves, not just outside the
     invisible clip. Runs at the same time the brackets normalize below.
     filter lives on the #logo-text-invert wrapper below rather than here
     directly - Chromium rasterizes a filter into its own backing buffer,
     and combining that with clip-path+transform on the SAME element makes
     that buffer get created at a lower effective resolution than the rest
     of the page, which reads as soft/blurry on non-Retina displays (masked
     on a Retina screen by its extra pixel density). Isolating the filter
     on a plain, non-transformed, non-clipped wrapper keeps its rasterization
     independent of the sliding/clipping children. */
  #logo-text-invert {
    filter: invert(1);
  }
  #text-diego-half, #text-tavella-half {
    left: 895px;
    top: 504px;
    width: 131px;
    height: 72px;
    transition: transform 0.75s ease-in;
  }
  #text-diego-half {
    clip-path: inset(0 0 50% 0);
    /* the -190px clearance offset scales by --logo-scale too, not just
       the box itself - it's what keeps this parked OUTSIDE the (also
       --logo-scale'd) window below in portrait; left as a bare -190px it
       stayed fixed while the box grew around it, eating into the
       clearance until the two started overlapping and "Diego" bled
       through onto the still-locked password gate. */
    transform: translateX(calc(-190px * var(--logo-scale))) scale(var(--logo-scale));
  }
  #text-tavella-half {
    clip-path: inset(50% 0 0 0);
    transform: translateX(calc(190px * var(--logo-scale))) scale(var(--logo-scale));
  }
  #text-diego-half.entered, #text-tavella-half.entered {
    transform: translateX(0) scale(var(--logo-scale));
  }
  /* wraps #logo-text only - exactly the same 1920x1080 coordinate space
     as .canvas (same trick as #rect2-mask above), so #logo-text's own
     left/top absolute positioning still resolves exactly as before. Only
     playContactTransition ever sets a clip-path here, masking "Diego
     Tavella" to #rect's own live box the same way #bg-video-mask's own
     overflow:hidden already does for bg-video (see playContactTransition).
     pointer-events:
     none is load-bearing, not precautionary: #logo-text itself already
     has pointer-events:none (see .logo-sprite), but this wrapper is a
     plain div with no such rule of its own, and it paints a full,
     invisible 1920x1080 box LATER in the DOM than #rect/#rect-hover-zone/
     #password-gate - without this it silently sits on top of all three
     and swallows every click (confirmed: this exact omission is what
     broke the index page the first time this mask was added). */
  #logo-text-mask {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    pointer-events: none;
  }
  /* #logo-text stays hidden until the Diego/Tavella halves above finish
     converging (identical end state to what they just animated into, so
     the swap itself is invisible) */
  #logo-text {
    opacity: 0;
  }
  #logo-text.revealed {
    opacity: 1;
  }

  /* "logo desarme": three sprites cropped directly out of the real AE
     render (logodesarme_1_100.png, 4px padding for anti-aliasing) rather
     than reconstructed in a web font - neither the brackets nor the
     wordmark ever change size in the source frames, they only translate
     (brackets slide out horizontally, staying vertically centered; the
     text slides from screen-center up to the top-left), so a single crop
     of each piece is all that's needed, just moved around by JS. Positions
     below are frame 100's own bbox minus the 4px crop padding, in the
     comp's 1920x1080 coordinates. */
  .logo-sprite {
    position: absolute;
    user-select: none;
    pointer-events: none;
  }
  /* scaled up to match the button's own 10%-bigger un-pressed size,
     each around the same shared point the button itself is centered on
     (960, 539.5) - expressed as a transform-origin local to each
     element's own box, since a single shared-origin scale isn't
     possible across three separate elements without a wrapper. Presses
     back down to scale(1) in the same duration as the button (see
     PRESS_DURATION in the script - keep this in sync if that changes),
     which is also what leaves it there ever after - nothing later
     re-touches transform, only left/top. */
  #bracket-left { left: 872px; top: 483px; width: 23px; height: 113px; transform: scale(calc(1.1 * var(--logo-scale))); transform-origin: 88px 56.5px; }
  #bracket-right { left: 1026px; top: 483px; width: 22px; height: 113px; transform: scale(calc(1.1 * var(--logo-scale))); transform-origin: -66px 56.5px; }
  /* thin-stroke stand-ins for the two brackets above (2px stroke, matching
     rect's own border-width - see bracket-*-thin.png), same box/scale so
     they sit exactly on top of their bold counterparts - see
     multiplyPlusIntoBars, which crossfades bold->thin (opacity) in the
     same move that spreads/grays "botonera videos", rather than swapping
     the src outright (an instant cut would read as a glitch) */
  #bracket-left-thin { left: 872px; top: 483px; width: 23px; height: 113px; transform: scale(1.1); transform-origin: 88px 56.5px; opacity: 0; }
  #bracket-right-thin { left: 1026px; top: 483px; width: 22px; height: 113px; transform: scale(1.1); transform-origin: -66px 56.5px; opacity: 0; }
  /* highbracket-left/right.png: same ~23px width and ~7px cap thickness
     as bracket-left/right.png above, but 226px tall (2x) instead of 113 -
     the middle tick from the original 3-tick design is gone, its stroke
     just extended, so the caps never get thicker no matter how tall this
     renders. Cross-fades in for #bracket-left/#bracket-right (which stay
     exactly as they've always been - this is a separate pair of
     elements, not a src swap on the originals) partway through
     syncLogoToRect's own growth - see its own comment for the timing.
     top/transform-origin recalculated for this taller native size so its
     own vertical center still lands on RECT_CENTER_Y, same center point
     #bracket-left/right's own 483+56.5 already lands on. opacity:0 at
     rest - only ever visible mid-crossfade or once settled past it. */
  #bracket-left-tall { left: 872px; top: 426.5px; width: 23px; height: 226px; transform-origin: 88px 113px; opacity: 0; }
  #bracket-right-tall { left: 1026px; top: 426.5px; width: 23px; height: 226px; transform-origin: -66px 113px; opacity: 0; }
  #logo-text { left: 895px; top: 504px; width: 131px; height: 72px; transform: scale(calc(1.1 * var(--logo-scale))); transform-origin: 65px 35.5px; }
  /* starting position before the password unlocks: parked outside the
     button's own footprint on each bracket's own side (left bracket sits
     comfortably left of the rect, right bracket comfortably right of it),
     same scale(1.1) as the rest position - a slide, not a morph. Used to
     be a shrunk-down, password-box-matched transform that grew/uncramped
     into place (see git history) - simplified so the brackets no longer
     have anything to do with what the password box itself looks like:
     slideInBrackets in the script animates away from this via WAAPI once
     the password is entered, landing back on that exact scale(1.1) rest
     transform, translateX implicitly back to 0. */
  #bracket-left.bracket-offstage { transform: translateX(-300px) scale(calc(1.1 * var(--logo-scale))); }
  #bracket-right.bracket-offstage { transform: translateX(300px) scale(calc(1.1 * var(--logo-scale))); }
  /* filter: black ink on transparent, so invert() reads as solid white
     against the button's black fill - matches the button state above,
     swaps off at the same moment the fill does (see the press handling
     in the script). blink-square is excluded (it's a plain div, not one
     of these sprites) - inverting it would fight its own black fill.
     transition covers both properties in one rule - a second `transition`
     declaration for the same selector would replace this one outright
     instead of adding to it. */
  #bracket-left, #bracket-right, #logo-text {
    filter: invert(1);
    transition: filter 0.2s ease, transform 0.09s ease-out;
  }

  /* small red indicator that blinks on once the rect is nearly done
     growing - side length matches the bracket's own width (its
     horizontal "arm"), right-aligned with the right bracket, sitting
     the same EDGE_MARGIN_Y above the rect's bottom edge that the wordmark
     sits below its top edge */
  #blink-square {
    background: #000;
    display: none;
    /* shared with contact.html's own #blink-square - see the
       @view-transition rule up top and #rect2's own comment on why
       this is safe unconditionally */
    view-transition-name: byn-blink-square;
    clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%);
    /* clip-path isn't in this transition - animating a polygon morph
       (interpolating each point) was janky/stuttery, unlike transform,
       which is cheap to animate. The shape now swaps instantly between
       square and triangle while only the scale eases in smoothly. */
    transition: transform 0.5s ease;
  }
  #blink-square.visible {
    display: block;
    animation: blink-square-flash 0.6s steps(1, end) infinite;
  }
  /* 0.75, not 1, is the square's own "on" opacity - the blink still
     alternates between this and fully transparent */
  @keyframes blink-square-flash {
    0%, 100% { opacity: 0.75; }
    50% { opacity: 0; }
  }
  /* hover state for #blink-square-hover-zone (see below): the square
     instantly re-cuts into an equilateral-ish triangle pointing right
     (top-right/bottom-right corners collapsed onto the right edge's
     middle) - plus a 50% scale-up, from its own center (default
     transform-origin), which is what actually animates smoothly. Also
     goes fully opaque and stops blinking (`animation: none` overrides
     .visible's blink-square-flash here, same specificity but declared
     later) - once it's a triangle it reads as "click here" clearly
     enough on its own, no need to keep flashing. */
  #blink-square.triangle {
    clip-path: polygon(0% 0%, 100% 50%, 100% 50%, 0% 100%);
    transform: scale(1.5);
    opacity: 1;
    animation: none;
  }
  /* step 2's persistent "back" button: the same triangle shape, turned to
     point left instead of right via a flat, in-plane rotate() (the
     z-axis, the only one that stays flat against the screen - not
     rotateX/rotateY, which would fake a 3D card-flip look). -180deg
     rather than 180deg so the turn itself sweeps counterclockwise; the
     resting look is identical either way since a half turn lands on the
     same pixels regardless of which way it went (the shape's already
     symmetric top/bottom). Always on once applied (not hover-only like
     .triangle alone), so it reads as "click to go back". */
  #blink-square.triangle.back {
    transform: scale(1.5) rotate(-180deg);
  }
  /* the second click's actual hit target - see advanceFromOvershoot -
     once the blink square appears, THIS is what has to be clicked to
     move on from the overshoot hold, not the big rect/its own hover-zone
     anymore. Sized/positioned in JS (syncLogoToRect's tick), 5px larger
     than the blink square on every side, and invisible itself (no fill,
     just the hit area) since the blink square's own flashing red already
     shows what to click. */
  #blink-square-hover-zone {
    position: absolute;
    display: none;
  }
  #blink-square-hover-zone.visible {
    display: block;
    cursor: pointer;
  }
  /* "Contact" link: plain white Helvetica Neue Thin text, no button
     chrome - appears alongside the blink square once the rect reaches
     its overshoot (square) hold, sharing that same reveal threshold/fade
     (see syncLogoToRect's tick). Shares the blink square's own vertical
     center and "Diego Tavella"'s own left edge (horizontal) - both
     written there every frame, this element never computes its own
     position. Links straight to contact.html - nothing happens on this
     page itself. */
  #contact-button {
    position: absolute;
    transform: translateY(-50%);
    color: #fff;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 100;
    font-size: 16px;
    letter-spacing: 1px;
    text-decoration: none;
    white-space: nowrap;
    user-select: none;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  #contact-button.visible {
    opacity: 1;
    pointer-events: auto;
  }
  /* header divider: appears only once rect starts widening to 16:9 (see
     advanceFromOvershoot) - as wide as rect itself, tracking its width
     live, positioned below "Diego Tavella" by the same EDGE_MARGIN_Y gap
     the wordmark already keeps above rect's own top edge. Centered the
     same way rect is (left:960px + translate(-50%,0)) so it never needs
     its own left-tracking as it grows/shrinks in sync with rect's width. */
  #header-line {
    position: absolute;
    left: 960px;
    transform: translate(-50%, 0);
    height: 2px;
    background: #000;
    display: none;
  }
  #header-line.visible {
    display: block;
  }
  /* header fill: the solid black backing behind "Diego Tavella" once it's
     widening to 16:9 (was #666 gray, matching the wordmark's own ink
     color, before switching to solid black). Grows downward from rect's
     own top edge, in lockstep with #header-line (which is literally this
     fill's own bottom edge) - see advanceFromOvershoot. */
  #header-fill {
    position: absolute;
    left: 960px;
    top: 0;
    transform: translate(-50%, 0);
    height: 0;
    background: #000;
    display: none;
  }
  #header-fill.visible {
    display: block;
  }
  /* gray (30% black) stand-in for "Diego Tavella", stacked exactly on
     #logo-text - revealed top-down via clip-path as #header-line descends
     past it (see advanceFromOvershoot), so the ink reads this gray
     against #header-fill's own black everywhere the fill has already
     swept over, and still its normal gray everywhere it hasn't reached
     yet. brightness(0) flattens the sprite's ink to solid black first
     (ignoring whatever gray/opacity #logo-text itself is using), then
     invert(0.7) brings that back up to a 70%-white/30%-black gray instead
     of all the way to white; alpha is untouched, so the transparent parts
     of the sprite stay transparent. */
  #logo-text-white {
    position: absolute;
    filter: brightness(0) invert(0.7);
    opacity: 0;
    clip-path: inset(0 0 100% 0);
  }
  #logo-text-white.visible {
    opacity: 1;
  }

  /* reference frame for the whole right-hand header readout - top/bottom
     pinned to "Diego Tavella"'s own box (D's top to Tavella's bottom),
     left/right computed in positionHeaderVideoInfo so the gap from the
     box's own left edge out to the D's outer vertical line mirrors the
     gap from the number's right edge out to the rect's own right edge -
     i.e. both sides of the header carry the same outer margin, just
     measured from opposite ends. Solid gray for now to actually see it;
     this becomes invisible (background: transparent) once the numbers
     check out. */
  #header-box {
    position: absolute;
    /* invisible now that the layout it drives has been checked against
       it - kept (element + positioning both still run, see
       positionHeaderVideoInfo) rather than removed, since the same
       header/body/footer split is going to anchor the vertical/mobile
       layout later. */
    background: transparent;
    pointer-events: none;
  }
  /* same left/right as #header-box (see positionHeaderVideoInfo) - top is
     rect2's (the celeste rect) own live top edge, bottom is the globe's
     north pole (see GLOBE_NORTH_POLE_FRACTION there for where that
     actually comes from). Green just to tell the two boxes apart at a
     glance while both are visible for review. */
  #body-box {
    position: absolute;
    background: transparent; /* see #header-box's own comment */
    pointer-events: none;
  }
  /* same left/right as #header-box/#body-box; top/height match the
     back-triangle's (#blink-square) own live box exactly - see
     positionHeaderVideoInfo. Magenta just to tell the three boxes apart
     at a glance while all are visible for review. */
  #footer-box {
    position: absolute;
    background: transparent; /* see #header-box's own comment */
    pointer-events: none;
  }

  /* per-video header readout ("EDITION / title / tag" + big index number) -
     revealed on hover of a "botonera videos" index button (see
     multiplyPlusIntoBars' hover-zone listeners), mirroring "Diego
     Tavella" on the header's other side. top/right/font-sizes are all set
     in JS off the header's own live geometry (logo-text's height for
     vertical centering + the number's size, the triangle's live right
     edge for the number's own right edge) rather than fixed here, since
     both depend on the rect's current widened size. */
  .header-video-info {
    position: absolute;
    display: flex;
    align-items: center;
    gap: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease;
  }
  .header-video-info.visible {
    opacity: 1;
  }
  .header-video-info-lines {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    text-align: right;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #fff;
    line-height: 1;
    white-space: nowrap;
  }
  .header-video-info-edition {
    font-weight: 100;
    letter-spacing: 0.08em;
  }
  .header-video-info-title {
    font-weight: 700;
  }
  .header-video-info-tag {
    font-weight: 400;
  }
  .header-video-info-number {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 700;
    color: #fff;
    line-height: 1;
  }

  /* center tagline: a "+" at screen center, "Video Editor" sliding out
     to its left and "motion graphics" to its right, in Helvetica Thin.
     Text height is 85% of the bracket's own ink height (105px), and
     everything shares one vertical center (540, screen center) via
     top:540px + translateY(-50%). Plays once, after the rect finishes
     growing. The open (slid-out) right/left values are computed in JS
     (playCenterTagline) against the brackets' actual current position,
     not a fixed distance here - text length varies and the brackets'
     own position is viewport-dependent, so only a live measurement can
     guarantee the words never reach them. */
  .tagline {
    position: absolute;
    top: 540px;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 100;
    font-size: 89.25px;
    line-height: 1;
    color: #000;
    white-space: nowrap;
    user-select: none;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.8s ease, right 0.8s ease, left 0.8s ease;
  }
  #tagline-plus {
    left: 960px;
    transform: translate(-50%, -50%);
    transition: opacity 0.8s ease, transform 1.4s cubic-bezier(0.4, 0, 0.2, 1);
  }
  /* the "+" is two independent bars (not the glyph) so the spin trick
     below can retract one and stretch the other. Actual width/height/
     margin are set in JS (playCenterTagline) since the arm span is
     scaled at runtime (see PLUS_SCALE) - #tagline-plus itself also gets
     an explicit width/height there, since with only absolutely-positioned
     children it would otherwise report 0 for offsetWidth, and other
     tagline math (plusHalfWidth) depends on that being real. */
  .plus-arm {
    position: absolute;
    top: 50%;
    left: 50%;
    background: #000;
    transition: transform 1.4s cubic-bezier(0.4, 0, 0.2, 1);
  }
  /* the horizontal arm retracts to 0 and the vertical one stretches,
     landing on a plain vertical bar rather than a tilted "/" - no rotation
     needed for that shape change itself, since the vertical arm is
     already vertical. The spin flourish (full clockwise turns each time
     this toggles, "+"<->bar) is a separate effect layered on top, driven
     entirely by #tagline-plus's own inline `transform` (see
     playCenterTagline/the spin loop in the script), which keeps adding
     full 360deg turns every step - always clockwise in both directions,
     landing back on the same net rotation each time, rather than
     unwinding backwards the way toggling a single fixed rotate() value
     would. */
  #tagline-plus.spin .plus-arm-h {
    transform: scaleX(0);
  }
  #tagline-plus.spin .plus-arm-v {
    transform: scaleY(1.5);
  }
  /* the 6 bars the settled "|" (#tagline-plus.spin's own .plus-arm-v
     shape) multiplies into - see collapseCenterTagline/multiplyPlusIntoBars.
     Plain copies of that same bar, positioned/animated purely in JS since
     each one's target X depends on the brackets' own live position. */
  .plus-multiply-bar {
    position: absolute;
    top: 539.5px;
    background: #000;
    pointer-events: none;
  }
  /* the 8 index numbers ("01".."08") sitting at the midpoint of each of
     the 8 gaps in "botonera videos" (bracket-bar1, bar1-bar2, ...,
     bar7-bracket) - see multiplyPlusIntoBars. Centered on the same line
     as the bars themselves (translate(-50%,-50%) at their own top), sized
     and colored/animated identically. Each one is purely the VISIBLE chip
     (10% past the number's own measured size on each side, height pinned
     to the bars' own height instead) - pointer-events:none, since the
     actual hit-target is the wider .botonera-index-hover-zone sibling
     covering the whole gap (see multiplyPlusIntoBars); that zone toggles
     .forced-hover here in JS rather than relying on real :hover, since
     the chip itself never receives the pointer. This rule carries the
     constant look - black fill + bold number when active, rounded 2px to
     match the bars/brackets' own weight. */
  .botonera-index {
    position: absolute;
    transform: translate(-50%, -50%);
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 2px;
    background: transparent;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 100;
    color: #000;
    white-space: nowrap;
    user-select: none;
    pointer-events: none;
    transition: background-color 0.15s ease, border-radius 0.15s ease, transform 0.15s ease, color 0.15s ease;
  }
  .botonera-index:hover, .botonera-index.forced-hover {
    /* the fade-in animation commits an inline opacity: 0.6 (GRAY_OPACITY)
       that sticks around forever (fill: 'forwards') - inline style always
       outranks a class rule regardless of :hover, so without !important
       here that 0.6 would wash out the white text and black background
       back down to a grayish, half-see-through look */
    opacity: 1 !important;
    background: #000;
    font-weight: 700;
    color: #fff;
    border-radius: 4px;
    /* widens 20% from center - scaleX only (not the uniform scale()
       elsewhere in this file), added onto the same translate(-50%,-50%)
       so the button's own center point never shifts */
    transform: translate(-50%, -50%) scaleX(1.2);
  }
  /* the actual hit-target for a botonera index button - spans the full
     gap between its two neighboring bars (or bar/bracket), not just the
     number chip's own small box, per the "hover area = width between the
     bars" spec. Same center point/anchor as its .botonera-index chip
     (translate(-50%,-50%) at the same left/top), just wider/invisible. */
  .botonera-index-hover-zone {
    position: absolute;
    transform: translate(-50%, -50%);
    cursor: pointer;
  }
  /* "Video Editor"/"motion graphics" don't fade in - opacity has no
     transition here (it's absent from this rule's own `transition`, which
     fully replaces .tagline's), so adding .visible flips it to 1 instantly.
     The reveal itself isn't done on these elements at all - each one sits
     inside its own #tagline-*-window (below), a fixed mask at that word's
     own final resting spot. Both start swapped (Video Editor's left/right
     set to where motion graphics ends up, and vice versa - see
     playCenterTagline) then slide to their own true final position; since
     each is clipped by a window fixed at its OWN destination, it stays
     invisible while sitting at the other's spot (wrong window, or none)
     and only appears as it slides into alignment with its own window. */
  #tagline-left {
    right: 984px; /* 960 + 24px gap from the plus, closed position */
    transform: translateY(-50%);
    text-align: right;
    /* bold (not thin like the rest) plus tracking is what brings "Video
       Editor" up toward "motion graphics" own rendered width - permanent,
       not a later hover/reveal effect */
    font-weight: 700;
    letter-spacing: 3px;
    /* opacity deliberately left out - see the comment above - so only
       right/left (the swap-slide) animate; opacity itself just jumps */
    transition: right 0.8s ease, left 0.8s ease;
  }
  #tagline-right {
    left: 984px; /* 960 + 24px gap from the plus, closed position */
    transform: translateY(-50%);
    font-weight: 300; /* Helvetica Neue Light - .tagline's base 100 (Thin) is the next cut down, but 150 isn't a real cut and would just resolve back to 100 */
    transition: right 0.8s ease, left 0.8s ease;
  }
  .tagline.visible {
    opacity: 1;
  }
  /* fixed masks the "Video Editor"/"motion graphics" slide-swap plays out
     under - see playCenterTagline. Sized/positioned exactly like .canvas
     itself (not scoped tighter to the text) so a child's existing
     left/top/right math (already written in canvas-space coordinates)
     keeps working completely unchanged; only the clip-path differs
     between the two, a plain vertical cut 5px off the "+"/bar's own
     centerline (960,539.5) on each side - motion-graphics' to the right
     of it, video-editor's to the left - matching the bar's own straight
     vertical shape once it settles (#tagline-plus.spin's .plus-arm-v is
     never actually rotated to a diagonal "/" - the spin flourish's own
     rotation always lands back on a multiple of 360deg). */
  .tagline-window {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    pointer-events: none;
  }
  #tagline-left-window {
    clip-path: polygon(0 0, 955px 0, 955px 1080px, 0 1080px);
  }
  #tagline-right-window {
    clip-path: polygon(965px 0, 1920px 0, 1920px 1080px, 965px 1080px);
  }

  /* ondablanca.webm: hover-only preview on the blink-square/triangle hit
     zone (see its mouseenter/mouseleave listeners in the script) - the
     second-click target that only exists after the first click, once the
     rect is sitting at its overshoot size. A child of #rect2 (the celeste
     rect), not #rect - width/height:100% plus rect2's own overflow:hidden
     (see #rect2) is what tracks rect2's live size/rounded corners
     automatically, no JS sizing needed, same technique #bg-video already
     uses off its own #bg-video-mask. object-fit:cover keeps the footage
     itself from
     ever stretching even as rect2's own aspect ratio changes (square ->
     16:9). Full opacity - the webm's own alpha channel already handles
     transparency, so .visible just needs to reveal it, no extra dimming
     on top. */
  #onda-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  #onda-video.visible {
    opacity: 1;
  }

  /* rotates the globe footage itself 30deg clockwise around its own
     center, without rotating #bg-video-mask's own crop shape (which has
     to stay aligned with #rect - see its CSS comment) - a separate
     wrapper sitting between the two, rather than putting the rotation on
     #bg-video directly, since #bg-video's own transform is already
     driven by a dozen different places in the script (scale for its
     enter/exit, translateX/translateY for various slides - see its own
     CSS comment) and adding a rotation there would mean threading
     `rotate(30deg)` into every single one of them instead of just here,
     once, on an element nothing else ever touches. 100%/100% of
     #bg-video-mask's own live box, same as #bg-video used to be
     positioned directly. */
  /* no longer rotates its own box (see #bg-video's own comment on why
     that moved to the child) - kept as a plain pass-through wrapper since
     #bg-video-mask's sync code and the markup structure both still
     reference it. */
  #bg-video-rotate {
    position: absolute;
    inset: 0;
  }

  /* fdo_invloop.webm: revealed the moment "Video Editor"/"motion graphics"
     start sliding out to their sides (see the showBgVideo() call in
     playCenterTagline, right next to that reveal's own classList.add
     calls) - the webm's own alpha channel (VP9 alpha_mode) is what
     actually shows the rect through it where the footage is transparent.
     Enters by scaling from 0 to 100% over 0.75s (not a fade - opacity
     stays at 1 throughout); advanceFromOvershoot/reverseFromWidened later
     add a translateY on top of this same scale (never replacing it) to
     slide the globe down/up for its own reveal effect, and
     playContactTransition adds a translateX the same way for its own
     exit/entry slide - see both. The 30deg rotation used to live on the
     separate #bg-video-rotate wrapper instead, "unaffected by" this
     element's own transform - which held only while that transform was a
     pure scale (scale and rotate commute around the same center), but
     broke the instant a translate got added on top: a translate applied
     to a CHILD of an already-rotated element happens in the PRE-rotation
     local frame, so the parent's fixed 30deg then bends that motion into
     a diagonal instead of the intended straight line (a 50% translateY
     read as ~243px of unwanted sideways drift at this box's own size -
     exactly 50%*sin(30deg) of it). Moving rotate(30deg) here instead,
     always as the LAST (rightmost/innermost) term in the transform list,
     keeps the content's visual tilt identical while every translate/scale
     listed before it composes in plain screen space instead - every call
     site that sets this element's transform (see the ones referenced
     above) has to keep appending it as that same trailing term, or this
     element renders flat (untilted) for that one animation instead. */
  #bg-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scale(0) rotate(30deg);
    pointer-events: none;
    transition: transform 0.75s ease;
  }
  #bg-video.visible {
    transform: scale(1) rotate(30deg);
  }

  /* botonera video player: deliberately NOT a child of .canvas - the
     canvas is subject to fitCanvas()'s own scale() transform and, more
     importantly, is where #rect lives, and this has to sit above #rect
     no matter what state the rect/botonera animation is currently in.
     A plain position:fixed, real-viewport-px overlay sidesteps all of
     that instead of fighting it: it's always full-viewport regardless
     of canvas scale, and being the LAST element in the document (after
     .viewport, with no z-index needed elsewhere in this file - nothing
     else sets one) it paints on top of everything by simple DOM order.
     Same expanded-player look as marco.html's .cell.expanded, minus
     everything that only made sense for a persistent thumbnail grid
     (hover preview, fly-in layout, per-cell video-info popup) - here
     each botonera number is already a direct, one-step trigger. */
  .video-overlay {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .video-overlay.visible {
    opacity: 1;
    pointer-events: auto;
  }
  .video-overlay .player {
    position: relative;
    overflow: hidden;
    border: 3px solid #000;
    border-radius: 10px;
    box-shadow: 10px 10px 60px rgba(0, 0, 0, 0.8);
    background: #000;
    container-type: inline-size;
    transform: scale(0.92);
    transition: transform 0.3s ease;
  }
  .video-overlay.visible .player {
    transform: scale(1);
  }
  .video-overlay video {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
  }

  /* playback controls bar - copied from marco.html's .video-controls/
     .vc-* rules verbatim (same look/behavior, "que funcione igual") */
  .video-overlay .video-controls {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 6;
    display: flex;
    align-items: center;
    gap: clamp(8px, 0.9cqw, 12px);
    padding: clamp(6px, 0.7cqw, 10px) clamp(10px, 1.2cqw, 16px);
    background: linear-gradient(to top, rgba(0, 0, 0, 0.55), transparent);
    opacity: 1;
    transition: opacity 0.3s ease;
  }

    opacity: 0;
    pointer-events: none;

  .vc-playpause {

    width: clamp(28px, 2.8cqw, 40px);

    background: none;

<script>
  // sets --logo-scale/--password-scale (see :root above) BEFORE the body
  // below is ever parsed, so text-diego-half/text-tavella-half/bracket-*/
  // logo-text compute their portrait transform on their very first style
  // pass instead of resolving to the landscape default (1) first and
  // getting reassigned afterward. That reassignment is what fitCanvas()
  // in the main script (bottom of body) does on every resize - harmless
  // there since it's setting an already-current value on top of a settled
  // page - but done as the FIRST write, it's a genuine change these
  // elements' own `transition: transform ...` rules pick up, animating
  // from the landscape size up to the portrait one over the transition's
  // own duration. On #text-diego-half/#text-tavella-half (0.75s) that's
  // long enough to visibly show "Diego"/"Tavella" sliding/growing through
  // the still-locked password gate before settling - the "white things
  // passing through the rectangle" glitch. LOGO_PORTRAIT_SCALE/
  // PASSWORD_PORTRAIT_SCALE are declared here (not `const`, so the main
  // script can read the same globals later) precisely so both places
  // share one number instead of two copies drifting apart.
  // single source of truth for "which layout is this viewport": every
  // portrait/landscape decision in the file goes through here, so the
  // rule lives in one place instead of ~25 copies of the same comparison.
  // Portrait only exists on touch devices (phones/tablets) that LOAD the
  // page held taller than wide; a desktop browser (mouse/trackpad) is
  // always landscape however narrow the window gets - nobody needs a
  // phone-shaped window on a computer. Decided ONCE, at load, and then
  // locked for the whole session: whichever layout the page loaded in
  // stays, resizing/rotating afterwards only rescales that same stage
  // (white around it) and never flips the layout mid-session.
  var PORTRAIT_LOCKED = null;
  function isPortraitViewport() {
    if (PORTRAIT_LOCKED === null) {
      PORTRAIT_LOCKED = window.matchMedia('(pointer: coarse)').matches &&
        window.innerWidth < window.innerHeight;
    }
    return PORTRAIT_LOCKED;
  }

  // the "stage": the fixed-proportion block the whole design lives in.
  // Every layout number (rect margins, header, tagline offsets...) is
  // measured against THIS box, never against the raw window, so the
  // result is identical for any window size of the same orientation -
  // resizing only changes `scale`, nothing ever goes stale. The stage is
  // centered in the window (white around it), shrinks proportionally
  // when the window is smaller, and never grows past maxScale.
  //   landscape: 16:9, 1920x1080 local units, max 1:1 pixels
  //   portrait: 9:19.5 (the phone it was calibrated on), 1920x4160 local
  //   units, capped at 1080 real px tall
  var STAGE_LANDSCAPE = { w: 1920, h: 1080, maxScale: 1 };
  var STAGE_PORTRAIT = { w: 1920, h: 4160, maxScale: 1080 / 4160 };
  function stageBox() {
    var s = isPortraitViewport() ? STAGE_PORTRAIT : STAGE_LANDSCAPE;
    var scale = Math.min(window.innerWidth / s.w, window.innerHeight / s.h, s.maxScale);
    return { scale: scale, localW: s.w, localH: s.h, realW: s.w * scale, realH: s.h * scale };
  }
  var LOGO_PORTRAIT_SCALE = 2.5;
  var PASSWORD_PORTRAIT_SCALE = 2.5;
  (function () {
    var portrait = isPortraitViewport();
    document.documentElement.style.setProperty('--logo-scale', portrait ? LOGO_PORTRAIT_SCALE : 1);
    document.documentElement.style.setProperty('--password-scale', portrait ? PASSWORD_PORTRAIT_SCALE : 1);
    // arriving back from menu-portrait.html's own swipe-down: scopes the
    // html.push-down-transition CSS below (::view-transition-new(root)/
    // byn-rect/byn-rect2/byn-rect-frame/byn-blink-square, pushed IN from
    // above) - has to be set THIS early, same reasoning as --logo-scale
    // just above, so it's already on <html> well before the browser
    // needs it to style the incoming half of the cross-document
    // transition, not raced against the rest of this page's own (much
    // heavier) load.
    if (location.hash === '#from-menu-portrait') {
      document.documentElement.classList.add('push-down-transition');
    }
  })();
</script>

        <div class="vc-volume-wrap">
          <div class="vc-volume-hit">
            <input class="vc-volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volumen">
            <button class="vc-mute" type="button" aria-label="Silenciar"></button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- TEMP/provisional - Photoshop-style draggable ruler guides, not part
       of the design. Drag off the top/left strips to drop a horizontal/
       vertical guide; drag an existing guide to move it, double-click to
       delete one, Escape clears all. See setupRulerGuides in the script. -->
  <div id="ruler-top"></div>
  <div id="ruler-left"></div>
  <div id="ruler-guides"></div>


  <script>
    // back/forward navigation between this page and contact.html restores
    // the page from the browser's bfcache instead of actually reloading
    // it - none of this script re-runs, so the page pops back in frozen
    // however it happened to look the instant it was navigated away from,
    // instead of its real resting state - see contact.html's own matching
    // handler for the fuller version of this comment. Forcing a reload
    // fixes it the same way there, but a PLAIN reload here would land back
    // on the password gate, which is wrong: the only way to ever be on
    // this page mid-history with contact.html on the stack is having
    // already unlocked it once, so bfcache restoring it should always
    // re-form the way it does after Home on contact.html - straight into
    // enterFromContact() - not reset all the way back to square one.
    // setting the hash first, THEN reloading (rather than
    // location.replace('index.html#from-contact') in one shot) matters:
    // this page's own URL already has no hash at the point bfcache
    // restores it, and replace()/href to a URL that differs ONLY by hash
    // is a same-document jump to the browser, not a real navigation - the
    // script never re-runs, so enterFromContact() never fires and this
    // silently no-ops. history.replaceState (not location.hash=, which
    // pushes a real history entry of its own - and since we're sitting
    // in the MIDDLE of the stack right after a back(), that push
    // truncates contact.html back off the forward list entirely) updates
    // this entry's own URL in place instead, forward stack untouched.
    // location.reload() then reloads the page at that now-updated URL.
    window.addEventListener('pageshow', (event) => {
      if (event.persisted) {
        history.replaceState(null, '', '#from-contact');
        location.reload();
      }
    });

    // touch/coarse-pointer devices (phones, tablets) get the animation
    // durations below compressed by this factor - same code path, same
    // easing/geometry as desktop, just compressed into far fewer
    // expensive frames. This matters because most of this file's motion
    // (see DURATION below in particular) drives #rect's width/height/
    // border-radius directly rather than transform:scale (deliberately -
    // see .rect's own CSS comment on why), which forces a real layout
    // recalculation on every single frame for as long as it runs; a
    // Retina laptop shrugs that off, but a mid-range Android tablet's
    // CPU visibly drops frames over the ~2s this used to run at full
    // length. Shrinking the duration doesn't touch the per-frame cost,
    // but it cuts how many of those expensive frames a visitor ever
    // sits through, which is what actually reads as "choppy". Left at 1
    // on fine-pointer (mouse/trackpad) devices, where it's unnecessary -
    // only applied to constants that are pure WAAPI el.animate()
    // durations (not ones mirrored by a fixed CSS transition-duration
    // elsewhere, which scaling here would just desync).
    const isCoarsePointer = window.matchMedia('(pointer: coarse)').matches;
    const MOTION_SCALE = isCoarsePointer ? 0.15 : 1;

    // portrait-only globe size: #bg-video's OWN square box (see
    // syncRectMasks), as a multiple of #rect's own live width - NOT
    // #bg-video-mask's box, which just stays #rect's plain full size (see
    // that function's own comment on why coupling the globe's size to the
    // container's shape was the actual bug, twice). 1 would be the box
    // exactly as wide as #rect - the globe itself (ffprobe: only ~440px
    // across inside the source's full 1920x1080 frame, dead center,
    // everything else transparent padding) reads at roughly 41% of that
    // box's own width there via object-fit:cover, same fraction
    // landscape's own near-square rect already shows. 1.39 (confirmed by
    // the user on-device, via the now-removed DEBUG slider - see
    // readme.txt point 8) grows the box past that baseline.
    const GLOBE_PORTRAIT_SCALE = 1.39;
    // portrait-only globe rotation, degrees - trailing term in #bg-video's
    // own transform (see syncRectMasks), same convention #bg-video's own
    // CSS comment already documents for landscape's fixed rotate(30deg):
    // always last/rightmost/innermost, so the translate() term below
    // still composes in plain screen space instead of getting bent
    // diagonal by an ancestor-style rotation. -10 confirmed by the user
    // on-device (see readme.txt point 8).
    const GLOBE_PORTRAIT_ROTATE = -10;
    // portrait-only globe horizontal offset, canvas-local px (same
    // 1920x1080 coordinate space #rect/RECT_CENTER_X etc. all live in -
    // NOT real screen px). Folded into the FIRST/leftmost translate()
    // term in #bg-video's own transform (see syncRectMasks), not a
    // separate trailing translateX - staying before rotate() in the list
    // keeps this moving in plain screen space, unaffected by
    // GLOBE_PORTRAIT_ROTATE (same reasoning as that constant's own
    // comment on term order). Positive moves right, negative left. 3
    // confirmed by the user on-device (see readme.txt point 8).
    const GLOBE_PORTRAIT_OFFSET_X = 3;
    // starts invisible in portrait - syncRectMasks sizes/positions
    // #bg-video from the very first frame regardless of app state (idle
    // button, password gate, mid-growth...), so without this it would
    // read as fully opaque (CSS default) from page load on, well before
    // showBgVideo() ever means to reveal it.
    if (isPortraitViewport()) {
      document.getElementById('bg-video').style.opacity = '0';
    }

    // #bg-video (fdo_invloop.webm, ~3.4MB) and #onda-video no longer carry
    // a `src` in the markup (see their own tags) - on a normal cold visit
    // there's a whole password gate + intro to get through before either
    // is ever shown, so kicking off their fetch/decode here instead of at
    // parse time costs nothing visible. Arriving via contact.html's "Home"
    // link is different: enterFromContact/playArrivalReveal below land
    // directly on the resting page with #bg-video already sliding in, no
    // intro to buy time - and that ~3.4MB fetch+decode competing with the
    // cross-document view transition's own "new page ready" check is
    // exactly what used to make #rect's own outline (unnamed - see the
    // @view-transition CSS block's comment on why) sit there unpainted
    // for a beat right on arrival. playArrivalReveal defers loading (and
    // showing) #bg-video specifically until the `pagereveal` event says
    // the transition has already resolved, so "root" stays light while
    // it's actually being judged ready. Idempotent since both paths could
    // otherwise race to set `src` twice.
    let heavyVideosLoaded = false;
    function loadHeavyVideos() {
      if (heavyVideosLoaded) return;
      heavyVideosLoaded = true;
