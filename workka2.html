<!DOCTYPE html>
<html lang="es">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Diego Tavella — Works</title>
  <style>html,body{background:#000}</style>
  <link rel="stylesheet" href="workka2.css">
  <style>
    body { display: block; }
    #pages-wrap {
      width: 100%;

      display: flex;

      width: 100%;

      overflow: hidden;
      background: #000;

    #contact-stage {
      position: absolute;
      width: min(100vw, 1920px);
      height: min(100dvh, 1080px);

      top: 50%;

      overflow: hidden;

    #contact-label {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 26vh;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      color: #fff;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 12vh;
      letter-spacing: -0.03em;
      pointer-events: none;

<body><script>(function(){function s(){var p=screen.orientation?screen.orientation.type.startsWith("portrait"):window.innerHeight>=window.innerWidth;document.body.classList.toggle("is-portrait",p)}s();window.addEventListener("resize",s);if(screen.orientation)screen.orientation.addEventListener("change",s)})()</script>
  <div id="pages-wrap">
  <div id="screen-work" style="position:relative">
  <div id="stage">

    <img id="work-logo" src="assets/images/logoexacto.png" alt="">
    <div id="work-title"></div>


    <div id="vhs-ruler">
      <span id="ruler-left"><span class="ruler-dashes"></span><span class="ruler-title"></span><span class="ruler-arrow"> &gt;</span></span>
      <span id="ruler-gap"></span>
      <span id="ruler-right"><span class="ruler-arrow"> &lt;</span><span class="ruler-title"></span><span class="ruler-dashes"></span></span>
    </div>

  </div>

  <div id="shelf-wrap" style="visibility:hidden">
    <div id="shelf-rail"></div>
  </div>

  </div>

  <div id="screen-contact">
    <div id="contact-stage">
      <div id="contact-label">Contact</div>
    </div>
  </div>

  </div>

  <div id="player">
    <video id="player-v" playsinline></video>
    <button id="player-back" aria-label="Volver">
      <svg viewBox="0 0 16 16" fill="none"><path d="M10 3L4 8l6 5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>

    <div id="player-vol">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M11 5L6 9H2v6h4l5 4V5z" fill="white"/></svg>
      <input id="player-vol-input" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volumen">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M11 5L6 9H2v6h4l5 4V5z" fill="white"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14" stroke="white" stroke-width="1.5" stroke-linecap="round"/></svg>
    </div>
  </div>

  <script>
    const R2 = "https://pub-5dae75b9216945058a34d5462aa57b48.r2.dev";
    const works = [
      { title: "Demo Reel",            png: "assets/images/vhslomocarmin.png",   thumb: "assets/images/thumb_video1.png", video: R2+"/WORKS/video1/video1reel.mp4",                                      ratio:"16/9", startAt:1 },
      { title: "Multideportes · ESPN", png: "assets/images/vhslomorojo.png",     thumb: "assets/images/thumb_video2.png", video: R2+"/WORKS/video2/Multideportes.mp4",                                   ratio:"16/9" },
      { title: "Autocine Tenaris",     png: "assets/images/vhslomonaranja.png",  thumb: "assets/images/thumb_video3.png", video: R2+"/WORKS/video6ok/AUTOCINE%20TENARIS%20ALTA.mp4",                     ratio:"16/9", coverHeight:true },
      { title: "El Escuerzo",          png: "assets/images/vhslomoamarillo.png", thumb: "assets/images/thumb_video4.png", video: R2+"/WORKS/video4/video4.mp4",                                          ratio:"16/9" },
      { title: "Video 05",             png: "assets/images/vhslomolima.png",     thumb: "assets/images/thumb_video5.png", video: R2+"/WORKS/video5/efda.mp4",                                            ratio:"16/9" },
      { title: "Fox Channel",          png: "assets/images/vhslomoverde.png",    thumb: "assets/images/thumb_video6.png", video: R2+"/WORKS/videofav/FOX%20HIGHLIGHT%20FEBRERO%2060%20SEGS_PT%20(2).mp4", ratio:"16/9" },
      { title: "Highlight Fox",        png: "assets/images/vhslomocian.png",     thumb: "assets/images/thumb_video7.png", video: R2+"/WORKS/video6/hltfoxviejo.mp4",                                     ratio:"16/9" },
      { title: "—",                    png: "assets/images/vhslomovioleta.png"  },
      { title: "—",                    png: "assets/images/vhslomolila.png"      },
      { title: "—",                    png: "assets/images/vhslomorosa.png"      },
    ];

    const stage = document.getElementById("stage");
    const rail  = document.getElementById("shelf-rail");

    // ── BUILD ─────────────────────────────────────────────────────────────────
    function buildCover(work, visual) {
      if (!work.thumb) return;
      const img = document.createElement("img");
      img.className = "vhs-cover";
      img.alt = "";
      img.dataset.src = work.thumb;
      visual.insertBefore(img, visual.firstChild);
    }

    function loadCovers() {
      document.querySelectorAll(".vhs-cover[data-src]").forEach(img => {
        img.src = img.dataset.src;
        delete img.dataset.src;
      });
    }

    (function buildShelf() {
      works.forEach((work, i) => {
        const spine = document.createElement("div");
        spine.className = "vhs-spine";
        spine.dataset.index = i;

        const visual = document.createElement("div");
        visual.className = "vhs-visual";

        const png = document.createElement("img");
        png.className = "vhs-png";
        png.src = work.png;
        png.alt = "";

        const label = document.createElement("span");
        label.className = "vhs-label";
        label.textContent = work.title;

        visual.appendChild(png);
        visual.appendChild(label);
        buildCover(work, visual);
        spine.appendChild(visual);
        rail.appendChild(spine);
      });
    })();

    function activateShelf() {
      document.getElementById("shelf-wrap").style.visibility = "";
      const spines = document.querySelectorAll(".vhs-spine");
      const lastDelay = 80 + (spines.length - 1) * 60;
      spines.forEach((spine, i) => {
        setTimeout(() => spine.classList.add("entered"), 80 + i * 60);
      });
      setTimeout(loadCovers, lastDelay + 300);
      requestAnimationFrame(positionHomeBtn);
    }

    // ── CALIBRATE ─────────────────────────────────────────────────────────────
    function calibrateBlock() {
      const stageR  = stage.getBoundingClientRect();
      const margin  = 20;
      const targetH = stageR.height - margin * 2;
      const railH   = targetH / 0.85;
      rail.style.height = railH + "px";
      positionHomeBtn();
      requestAnimationFrame(fitTitleToRail);
      requestAnimationFrame(positionContactLabel);
    }

    function positionContactLabel() {
      const spines = rail.querySelectorAll(".vhs-spine");
      if (!spines.length) return;
      const stageR     = stage.getBoundingClientRect();
      const lastSpineR = spines[spines.length - 1].getBoundingClientRect();
      const rightPx    = stageR.right - lastSpineR.right;
      const label      = document.getElementById("contact-label");
      if (label) label.style.paddingRight = rightPx + "px";
    }

    let _titleTyped = false;

    function fitTitleToRail() {
      const title = document.getElementById("work-title");
      const logo  = document.getElementById("work-logo");
      if (!title || !logo) return;

      const spines = rail.querySelectorAll(".vhs-spine");
      if (!spines.length) return;

      const stageR = stage.getBoundingClientRect();
      const spineR = spines[0].getBoundingClientRect();
      const leftPx = (spineR.left - stageR.left);
      title.style.left = (leftPx - 7) + "px";
      logo.style.left  = leftPx + "px";
      logo.style.right = "";

      const stageH   = stageR.height;
      const titleH   = window.innerHeight * 0.16;
      const titleTop = stageH * 0.30 - titleH / 2;

      logo.style.top        = (window.innerHeight * 0.07) + "px";
      title.style.top       = titleTop + "px";
      title.style.transform = "none";

      if (!_titleTyped) {
        _titleTyped = true;
        title.textContent = "";
        "Movie Shelf".split("").forEach((c, i) =>
          setTimeout(() => { title.textContent += c; }, i * 90));
      }
    }

    requestAnimationFrame(() => requestAnimationFrame(calibrateBlock));

    // ── HOVER ─────────────────────────────────────────────────────────────────
    let activeIndex   = -1;
    let elevatedIdx   = -1;
    let elevatedDY    = 0;
    let elevatedScale = 1;

    function getVisual(idx) {
      return rail.querySelectorAll(".vhs-spine")[idx]?.querySelector(".vhs-visual") ?? null;
    }

    function elevatedTransform(extraRotate) {
      const t = `translateY(${elevatedDY.toFixed(1)}px) scale(${elevatedScale.toFixed(4)})`;
      return extraRotate ? `${t} rotateZ(${extraRotate.toFixed(1)}deg)` : t;
    }

    function elevateVisual(idx) {
      const stageR    = stage.getBoundingClientRect();
      const spines    = Array.from(rail.querySelectorAll(".vhs-spine"));
      const isPortrait = document.body.classList.contains("is-portrait");

      if (elevatedIdx >= 0 && elevatedIdx !== idx) {
        const prev = getVisual(elevatedIdx);
        if (prev) prev.style.transform = "";
      }

      spines.forEach((spine, i) => {
        spine.style.transform = (i !== idx) ? `translateY(${stageR.height}px)` : "";
      });

      elevatedIdx   = idx;
      elevatedDY    = 0;
      elevatedScale = 1;
      setActive(idx);
      updateLomoOpacities();

      if (isPortrait) {
        spines[idx].style.width = "75vw";
        const sp = spines[idx];
        if (sp._leaveHandler) sp.removeEventListener("mouseleave", sp._leaveHandler);
        sp._leaveHandler = () => { dropElevated(); setActive(-1); };
        sp.addEventListener("mouseleave", sp._leaveHandler);
        return;
      }

      const v = getVisual(idx);
      if (!v) return;
      const vR     = v.getBoundingClientRect();
      const frameR = { top: stageR.top + 20, bottom: stageR.bottom - 20,
                       height: stageR.height - 40 };

      document.body.classList.add("vhs-elevated");

      let dy = (frameR.top + frameR.height / 2) - (vR.top + vR.height / 2);
      if      (vR.top    + dy < frameR.top)    dy = frameR.top    - vR.top;
      else if (vR.bottom + dy > frameR.bottom) dy = frameR.bottom - vR.bottom;

      elevatedDY    = dy;
      v.style.transition = "transform 700ms cubic-bezier(0.16, 1, 0.3, 1)";
      v.style.transform  = `translateY(${dy.toFixed(1)}px)`;

      if (v._leaveHandler) v.removeEventListener("mouseleave", v._leaveHandler);
      v._leaveHandler = () => { dropElevated(); setActive(-1); };
      v.addEventListener("mouseleave", v._leaveHandler);

      showRuler(idx);
    }

    // ── RULER ─────────────────────────────────────────────────────────────────
    function showRuler(idx) {
      const ruler   = document.getElementById("vhs-ruler");
      const spine   = rail.querySelectorAll(".vhs-spine")[idx];
      const visual  = spine.querySelector(".vhs-visual");
      const visualR = visual.getBoundingClientRect();
      const spines  = Array.from(rail.querySelectorAll(".vhs-spine"));
      const firstR  = spines[0].getBoundingClientRect();
      const lastR   = spines[spines.length - 1].getBoundingClientRect();
      const railR   = rail.getBoundingClientRect();
      const stageR  = stage.getBoundingClientRect();

      const rulerLeft0  = firstR.left;
      const rulerRight0 = lastR.right;

      const leftW  = visualR.left - rulerLeft0;
      const gapW   = visualR.width;
      const rightW = rulerRight0 - visualR.right;

      const titleOnRight = rightW >= leftW;
      const DASHES = "-  ".repeat(60);
      const title  = works[idx].title;

      const rulerLeft  = document.getElementById("ruler-left");
      const rulerRight = document.getElementById("ruler-right");
      const rulerGap   = document.getElementById("ruler-gap");

      const halfExtra = gapW * 0.1;
      const lFill = Math.max(0, leftW  - halfExtra);
      const rFill = Math.max(0, rightW - halfExtra);
      const gap   = gapW + (leftW - lFill) + (rightW - rFill);
      rulerLeft.style.width  = lFill + "px";
      rulerGap.style.width   = gap   + "px";
      rulerRight.style.width = rFill + "px";

      const dashesL = rulerLeft.querySelector(".ruler-dashes");
      const titleL  = rulerLeft.querySelector(".ruler-title");
      const dashesR = rulerRight.querySelector(".ruler-dashes");
      const titleR  = rulerRight.querySelector(".ruler-title");

      if (titleOnRight) {
        dashesL.style.direction = "ltr";
        dashesL.textContent = DASHES;
        titleL.textContent  = "";
        titleR.textContent  = "-" + title + "-";
        dashesR.textContent = DASHES;
      } else {
        dashesL.style.direction = "rtl";
        dashesL.textContent = DASHES;
        titleL.textContent  = "-" + title + "-";
        titleR.textContent  = "";
        dashesR.textContent = DASHES;
      }

      ruler.classList.add("visible");
      ruler.style.left  = (rulerLeft0 - stageR.left) + "px";
      ruler.style.width = (rulerRight0 - rulerLeft0)  + "px";
      ruler.style.top   = (railR.top - stageR.top + railR.height * 0.075 - 50) + "px";
    }

    function hideRuler() {
      document.getElementById("vhs-ruler").classList.remove("visible");
    }

    function dropElevated(dur) {
      if (elevatedIdx < 0) return;
      const v = getVisual(elevatedIdx);
      if (v) {
        if (v._leaveHandler) { v.removeEventListener("mouseleave", v._leaveHandler); delete v._leaveHandler; }
        v.style.transition = "transform " + (dur || 280) + "ms cubic-bezier(0.55, 0, 1, 0.45)";
        v.style.transform  = "";
        v.addEventListener("transitionend", () => { v.style.transition = ""; }, { once: true });
      }
      rail.querySelectorAll(".vhs-spine").forEach(spine => spine.style.transform = "");
      const spinesAll = Array.from(rail.querySelectorAll(".vhs-spine"));
      spinesAll.forEach(sp => {
        sp.style.width = "";
        if (sp._leaveHandler) { sp.removeEventListener("mouseleave", sp._leaveHandler); delete sp._leaveHandler; }
      });
      elevatedIdx   = -1;
      elevatedDY    = 0;
      elevatedScale = 1;
      document.body.classList.remove("vhs-elevated");
      hideRuler();
      updateLomoOpacities();
    }

    function updateLomoOpacities() {
      const spines = Array.from(rail.querySelectorAll(".vhs-spine"));
      spines.forEach((spine, i) => {
        const png = spine.querySelector(".vhs-png");
        if (!png) return;
        let op;
        if (elevatedIdx >= 0) {
          op = i === elevatedIdx ? 1 : 0.74;
        } else if (activeIndex < 0) {
          op = 0.86;
        } else {
          const d = Math.abs(i - activeIndex);
          if      (d === 0) op = 1;
          else if (d === 1) op = 0.92;
          else              op = 0.80;
        }
        png.style.opacity = op;
      });
    }

    const _noteFreqs = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25, 587.33, 659.25];
    let _audioCtx = null;

    function _playNote(idx) {
      try {
        if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const ctx  = _audioCtx;
        const freq = _noteFreqs[idx % _noteFreqs.length];
        const now  = ctx.currentTime;

        const osc  = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.type = 'triangle';
        osc.frequency.value = freq;

        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.10, now + 0.006);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);

        osc.start(now);
        osc.stop(now + 0.55);
      } catch(e) {}
    }

    function setActive(idx) {
      if (activeIndex === idx) return;
      activeIndex = idx;
      if (idx >= 0) _playNote(idx);
      const spines = Array.from(rail.querySelectorAll(".vhs-spine"));
      spines.forEach((spine, i) => {
        spine.classList.toggle("is-active", idx >= 0 && i === idx);
      });
      updateLomoOpacities();
    }

    // ── TILT ──────────────────────────────────────────────────────────────────
    let prevMouseX = null;
    let smoothDx   = 0;
    let tiltTimer  = null;

    function updateTilt(mouseX, opts) {
      const ZONE        = opts?.zone        ?? 20;
      const MAX_ANGLE   = opts?.maxAngle    ?? 3;
      const SENSITIVITY = opts?.sensitivity ?? 0.35;
      const IDLE_MS     = opts?.idleMs      ?? 110;
      const onIdle      = opts?.onIdle      ?? clearTilt;
      const noPush      = opts?.noPush      ?? false;
      const pushScale   = opts?.pushScale   ?? 1;
      const emaK        = opts?.ema         ?? 0.55;

      const spines = Array.from(rail.querySelectorAll(".vhs-spine"));
      const idx    = activeIndex;

      if (idx < 0) { prevMouseX = null; smoothDx = 0; return; }

      const rect   = spines[idx].getBoundingClientRect();
      const inZone = mouseX >= rect.left - ZONE && mouseX <= rect.right + ZONE;
      if (!inZone) { prevMouseX = null; smoothDx = 0; onIdle(); return; }

      const rawDx = prevMouseX !== null ? mouseX - prevMouseX : 0;
      prevMouseX  = mouseX;
      smoothDx    = smoothDx * emaK + rawDx * (1 - emaK);

      const angle  = Math.max(-MAX_ANGLE, Math.min(MAX_ANGLE, smoothDx * SENSITIVITY));

      const visual  = spines[idx].querySelector(".vhs-visual");
      const vHeight = visual ? visual.offsetHeight : spines[idx].offsetHeight * 0.85;
      const pushPx  = vHeight * Math.sin(Math.abs(angle) * Math.PI / 180);

      spines.forEach((spine, i) => {
        const v = spine.querySelector(".vhs-visual");
        if (!v) return;
        const isElev = (elevatedIdx === i);
        if (i === idx) {
          v.style.transform = isElev
            ? elevatedTransform(0)
            : `rotateZ(${angle.toFixed(1)}deg)`;
          spine.style.transform = "";
        } else {
          v.style.transform = isElev ? elevatedTransform(0) : "";
          if (!noPush) {
            const px = (pushPx * pushScale).toFixed(1);
            if      (angle >  0.1 && i > idx) spine.style.transform = `translateX(${px}px)`;
            else if (angle < -0.1 && i < idx) spine.style.transform = `translateX(-${px}px)`;
            else                              spine.style.transform = "";
          } else {
            spine.style.transform = "";
          }
        }
      });

      clearTimeout(tiltTimer);
      tiltTimer = setTimeout(onIdle, IDLE_MS);
    }

    function clearTilt() {
      prevMouseX = null;
      smoothDx   = 0;
      Array.from(rail.querySelectorAll(".vhs-spine")).forEach((spine, i) => {
        const v = spine.querySelector(".vhs-visual");
        if (v) v.style.transform = (elevatedIdx === i) ? elevatedTransform(0) : "";
        spine.style.transform = "";
      });
    }

    // ── EVENTS ────────────────────────────────────────────────────────────────
    const isTouch = "ontouchstart" in window || navigator.maxTouchPoints > 0;

    function positionHomeBtn() {}

    // Swipe down para volver a hom4dtv
    let _swipeY0 = 0, _swipeX0 = 0;
    stage.addEventListener("touchstart", e => {
      _swipeY0 = e.touches[0].clientY;
      _swipeX0 = e.touches[0].clientX;
    }, { passive: true });
    stage.addEventListener("touchend", e => {
      if (elevatedIdx >= 0) return;
      const dy = e.changedTouches[0].clientY - _swipeY0;
      const dx = Math.abs(e.changedTouches[0].clientX - _swipeX0);
      if (dy > 60 && dx < dy * 0.7) {
        const sw = document.getElementById("shelf-wrap");
        sw.style.transition = "transform 750ms cubic-bezier(0.55, 0, 1, 0.45)";
        sw.style.transform  = "translateX(-50%) translateY(110%)";
        setTimeout(() => { window.location.href = "hom4dtv.html"; }, 780);
      }
    }, { passive: true });

    // Portrait: tap fuera del shelf cierra estado elevado
    stage.addEventListener("touchend", e => {
      if (elevatedIdx < 0) return;
      if (!document.body.classList.contains("is-portrait")) return;
      if (!e.target.closest(".vhs-spine")) { dropElevated(); setActive(-1); }
    }, { passive: true });

    if (isTouch) {
      let spineCenters = [];

      const TOUCH_OPTS = { zone: 60, maxAngle: 3, sensitivity: 0.6, idleMs: 110, pushScale: 0.35, ema: 0.78 };

      function touchClearTilt() {
        const spines = Array.from(rail.querySelectorAll(".vhs-spine"));
        spines.forEach(spine => {
          const v = spine.querySelector(".vhs-visual");
          if (v) v.style.transition = "transform 620ms cubic-bezier(0.25, 1.4, 0.5, 1)";
          spine.style.transition    = "transform 620ms cubic-bezier(0.25, 1.4, 0.5, 1)";
        });
        clearTilt();
        prevMouseX = null; smoothDx = 0;
        setTimeout(() => spines.forEach(sp => {
          const v = sp.querySelector(".vhs-visual");
          if (v) v.style.transition = "";
          sp.style.transition = "";
        }), 640);
      }

      TOUCH_OPTS.onIdle = touchClearTilt;

      rail.addEventListener("touchstart", e => {
        const spine = e.target.closest(".vhs-spine");
        if (!spine) return;
        setActive(+spine.dataset.index);
        prevMouseX = null; smoothDx = 0;
        spineCenters = Array.from(rail.querySelectorAll(".vhs-spine")).map(sp => {
          const r = sp.getBoundingClientRect();
          return (r.left + r.right) / 2;
        });
      }, { passive: true });

      rail.addEventListener("touchmove", e => {
        if (e.touches.length !== 1 || elevatedIdx >= 0) return;
        const touchX = e.touches[0].clientX;
        if (!spineCenters.length) return;
        let hoverIdx = 0, minD = Infinity;
        spineCenters.forEach((cx, i) => {
          const d = Math.abs(touchX - cx);
          if (d < minD) { minD = d; hoverIdx = i; }
        });
        if (hoverIdx !== activeIndex) setActive(hoverIdx);
        updateTilt(touchX, TOUCH_OPTS);
      }, { passive: true });

      rail.addEventListener("touchend",    touchClearTilt, { passive: true });
      rail.addEventListener("touchcancel", touchClearTilt, { passive: true });

      rail.addEventListener("click", e => {
        const spine = e.target.closest(".vhs-spine");
        if (!spine) return;
        const idx  = +spine.dataset.index;
        const work = works[idx];
        if (document.body.classList.contains("is-portrait")) {
          if (elevatedIdx === idx) {
            if (!work.video) return;
            dropElevated(); setActive(-1);
            spine.style.transition = "transform 340ms cubic-bezier(0.4, 0, 1, 1)";
            spine.style.transform  = "translateX(110%)";
            setTimeout(() => {
              spine.style.transition = "";
              spine.style.transform  = "";
              openPlayer(spine, work.video, work.startAt, work.ratio, work.coverHeight);
            }, 300);
          } else {
            dropElevated(); elevateVisual(idx);
          }
        } else {
          if (elevatedIdx === idx) {
            if (work.video) openPlayer(spine, work.video, work.startAt, work.ratio, work.coverHeight);
          } else {
            elevateVisual(idx);
          }
        }
      });

    } else {
      let rafId = null;
      rail.addEventListener("mousemove", e => {
        const spine = e.target.closest(".vhs-spine");
        const idx   = spine ? +spine.dataset.index : -1;
        const mx    = e.clientX;
        if (rafId) cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(() => {
          setActive(idx);
          updateTilt(mx);
          rafId = null;
        });
      });
      rail.addEventListener("mouseleave", () => {
        if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
        setActive(-1);
        clearTilt();
      });
      rail.addEventListener("click", e => {
        const spine = e.target.closest(".vhs-spine");
        if (!spine) return;
        const idx  = +spine.dataset.index;
        const work = works[idx];
        if (elevatedIdx === idx) {
          if (work.video) openPlayer(spine, work.video, work.startAt, work.ratio, work.coverHeight);
        } else {
          elevateVisual(idx);
        }
      });
    }

    // ── RESIZE ────────────────────────────────────────────────────────────────
    window.addEventListener("resize", () => {
      calibrateBlock();
      if (_pageState === 'contact') {
        pagesWrap.style.transition = 'none';
        pagesWrap.style.transform  = 'translateY(-' + window.innerHeight + 'px)';
        requestAnimationFrame(() => { pagesWrap.style.transition = ''; });
      }
      if (elevatedIdx >= 0) elevateVisual(elevatedIdx);
    });

    document.fonts.ready.then(fitTitleToRail);

    // ── ARRANCAR ──────────────────────────────────────────────────────────────
    activateShelf();

  
// ── PLAYER ────────────────────────────────────────────────────────────────────
const player     = document.getElementById('player');
const playerV    = document.getElementById('player-v');
const playerBack = document.getElementById('player-back');
let   playerAnim = null;

function openPlayer(spineEl, src, startAt, ratio, coverHeight) {
  const rect     = spineEl.getBoundingClientRect();
  const isSquare = ratio === '1/1';

  // Measure visual position BEFORE any state changes (still elevated)
  const visual  = spineEl.querySelector('.vhs-visual');
  const coverEl = spineEl.querySelector('.vhs-cover');
  const fromR   = (visual || spineEl).getBoundingClientRect();

  if (playerAnim) { playerAnim.cancel(); playerAnim = null; }

  document.body.classList.remove('vhs-elevated');
  document.body.classList.add('player-open');
  if (isSquare) document.body.classList.add('player-square');
  document.getElementById('shelf-wrap').style.visibility = 'hidden';

  player.classList.toggle('square', isSquare);
  player.classList.add('open');
  player.style.opacity  = '0';
  playerBack.style.opacity = '0';

  const playerRect = player.getBoundingClientRect();
  const cx    = (rect.left + rect.width  / 2) - playerRect.left;
  const cy    = (rect.top  + rect.height / 2) - playerRect.top;
  const cxPct = (cx / playerRect.width  * 100).toFixed(1);
  const cyPct = (cy / playerRect.height * 100).toFixed(1);

  // Hero: thumbnail vuela desde el lomo hasta el player
  if (coverEl && coverEl.src) {
    const scaleX = fromR.width  / playerRect.width;
    const scaleY = fromR.height / playerRect.height;
    const tx = (fromR.left + fromR.width  / 2) - (playerRect.left + playerRect.width  / 2);
    const ty = (fromR.top  + fromR.height / 2) - (playerRect.top  + playerRect.height / 2);

    const hero = new Image();
    hero.src = coverEl.src;
    hero.style.cssText = `position:fixed;left:${playerRect.left}px;top:${playerRect.top}px;width:${playerRect.width}px;height:${playerRect.height}px;object-fit:cover;object-position:center top;z-index:399;pointer-events:none;border-radius:4px 4px 24px 24px;`;
    document.body.appendChild(hero);

    hero.animate([
      { transform: `translate(${tx.toFixed(1)}px,${ty.toFixed(1)}px) scale(${scaleX.toFixed(4)},${scaleY.toFixed(4)})` },
      { transform: 'translate(0,0) scale(1)' }
    ], { duration: 500, easing: 'cubic-bezier(0.4, 0, 0.2, 1)' })
    .finished.then(() => {
      hero.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200, fill: 'forwards' })
      .finished.then(() => hero.remove());
    });
  }

  playerV.classList.toggle('square', isSquare);
  playerV.classList.toggle('cover-height', !!coverHeight);
  playerV.src = src;
  if (startAt) playerV.addEventListener('loadedmetadata', () => { playerV.currentTime = startAt; }, { once: true });
  playerV.muted = false;
  playerV.volume = 1;
  document.getElementById('player-vol-input').value = 1;
  playerV.play().catch(() => { playerV.muted = true; playerV.play().catch(() => {}); });

  playerAnim = player.animate(
    [{ opacity: '0' }, { opacity: '1' }],
    { duration: 300, easing: 'ease', fill: 'forwards' }
  );
  player.animate([
    { clipPath: 'circle(0% at ' + cxPct + '% ' + cyPct + '%)' },
    { clipPath: 'circle(150% at 50% 50%)' }
  ], { duration: 500, easing: 'cubic-bezier(0.4, 0, 0.2, 1)', fill: 'forwards' });

  playerAnim.finished.then(() => {
    playerAnim.cancel();
    player.style.opacity  = '1';
    player.style.clipPath = 'none';
    playerAnim = null;
    playerBack.style.opacity = '1';
  }).catch(() => {});
}

function closePlayer() {
  if (playerAnim) { playerAnim.cancel(); playerAnim = null; }
  playerBack.style.opacity = '0';
  playerV.pause();
  playerV.src = '';

  const anim = player.animate(
    [{ opacity: '1' }, { opacity: '0' }],
    { duration: 300, easing: 'ease', fill: 'forwards' }
  );
  playerAnim = anim;
  anim.finished.then(() => {
    anim.cancel();
    player.classList.remove('open', 'square');
    playerV.classList.remove('cover-height');
    player.style.opacity  = '';
    player.style.clipPath = '';
    document.body.classList.remove('player-open', 'player-square');
    document.getElementById('shelf-wrap').style.visibility = '';
    dropElevated();
  }).catch(() => {});
}

playerBack.addEventListener('click', e => { e.stopPropagation(); closePlayer(); });
player.addEventListener('click', e => { if (e.target === player) closePlayer(); });
playerV.addEventListener('ended', closePlayer);

document.getElementById('player-vol-input').addEventListener('input', function() {
  playerV.volume = +this.value;
  playerV.muted  = (+this.value === 0);
});

// ── PAGE STATE ────────────────────────────────────────────────────────────────
var _pageState     = 'work';
var _exitTriggered = false;
var _touchStartY   = null;
var EXIT_DUR       = 700;
var EXIT_EASE      = 'cubic-bezier(0.4, 0, 0.2, 1)';
var pagesWrap      = document.getElementById('pages-wrap');

// ── PAGE TRANSITIONS ──────────────────────────────────────────────────────────
function goToContact() {
  _pageState = 'contact';
  pagesWrap.style.transform = 'translateY(-' + window.innerHeight + 'px)';
  setTimeout(function() { _exitTriggered = false; }, EXIT_DUR + 50);
}

function goToWork() {
  _pageState = 'work';
  pagesWrap.style.transform = 'translateY(0)';
  setTimeout(function() { _exitTriggered = false; }, EXIT_DUR + 50);
}

function _doExitUp() {
  if (_exitTriggered || _pageState === 'contact') return;
  _exitTriggered = true;
  if (elevatedIdx >= 0) dropElevated(100);
  goToContact();
}

function _doExitDown() {
  if (_exitTriggered) return;
  _exitTriggered = true;
  if (_pageState === 'contact') {
    goToWork();
  } else {
    var curtain = document.createElement('div');
    curtain.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;pointer-events:none;transform:translateY(-100vh);';
    document.body.appendChild(curtain);
    curtain.animate(
      [{ transform: 'translateY(-100vh)' }, { transform: 'translateY(0)' }],
      { duration: 400, easing: 'cubic-bezier(0.4, 0, 1, 1)', fill: 'forwards' }
    );
    document.body.animate(
      [{ transform: 'translateY(0)' }, { transform: 'translateY(22vh)' }],
      { duration: 400, easing: 'cubic-bezier(0.4, 0, 1, 1)', fill: 'forwards' }
    );
    sessionStorage.setItem('resume_hom6dtv', '1');
    setTimeout(function() { window.location.href = 'hom6dtv.html'; }, 405);
  }
}

window.addEventListener('touchstart', function(e) {
  _touchStartY = e.touches[0].clientY;
}, { passive: true });
window.addEventListener('touchend', function(e) {
  if (_touchStartY === null) return;
  var dy = _touchStartY - e.changedTouches[0].clientY;
  if (dy > 50)  _doExitUp();
  if (dy < -50) _doExitDown();
  _touchStartY = null;
}, { passive: true });
window.addEventListener('mousedown', function(e) { _touchStartY = e.clientY; });
window.addEventListener('mouseup', function(e) {
  if (_touchStartY === null) return;
  var dy = _touchStartY - e.clientY;
  if (dy > 30)  _doExitUp();
  if (dy < -30) _doExitDown();
  _touchStartY = null;
});
window.addEventListener('wheel', function(e) {
  if (e.deltaY > 0) _doExitUp();
  if (e.deltaY < 0) _doExitDown();
}, { passive: true });

window.addEventListener('pageshow', function() {
  _exitTriggered = false;
  _touchStartY   = null;
  _pageState     = 'work';
  pagesWrap.style.transition = 'none';
  pagesWrap.style.transform  = 'translateY(0)';
  requestAnimationFrame(function() { pagesWrap.style.transition = ''; });
});
</script>
